<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precept Palette Optimizer</title>
<!-- the emoji as an SVG document, so there is no file to ship or fetch -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<!-- The biggest module the page needs, named before anything has parsed the
     script that asks for it. Unnamed it sits behind a serial hop — three.module
     is a renderer that imports the rest, so the browser must fetch and parse
     635 kB to discover the 1.4 MB behind it, and the largest file began
     downloading a second into the load. A hint, not a second fetch: the import
     takes it from the module map. The build points this at its bundle. -->
<link rel="modulepreload" href="./app.js">
<style>
  /* Fira, self-hosted, latin plus the one Greek weight the interface needs
     (the ΔL note). Everything Fira has no glyph for — ↺, ◐, the rotate
     arrows — falls back per glyph exactly as it did before. */
  @font-face { font-family:'Fira Sans'; font-style:normal; font-weight:400; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    src:url(./vendor/fontsource/fira-sans/files/fira-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'Fira Sans'; font-style:normal; font-weight:600; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    src:url(./vendor/fontsource/fira-sans/files/fira-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family:'Fira Sans'; font-style:normal; font-weight:700; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    src:url(./vendor/fontsource/fira-sans/files/fira-sans-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family:'Fira Sans'; font-style:normal; font-weight:400; font-display:swap;
    unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF;
    src:url(./vendor/fontsource/fira-sans/files/fira-sans-greek-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'Fira Mono'; font-style:normal; font-weight:400; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    src:url(./vendor/fontsource/fira-mono/files/fira-mono-latin-400-normal.woff2) format('woff2'); }
</style>
<!-- MathJax with the Fira math font, so the formulation is set in the same
     family as the interface. The combined component carries TeX input and CHTML
     output; the paths tell it where its own source tree is, since the speech
     worker and the character maps live under mathjax/ rather than the font. -->
<script>
  // The cover over the interface comes off when the module has laid it out. If
  // the module throws on the way there it never will, and the page would sit on
  // `loading…` for good — so uncover on an uncaught error too. A half-built
  // interface is at least legible, and the console says what happened. Only
  // script errors reach window this way; a font or image that fails to load
  // fires on its own element and does not bubble.
  addEventListener('error', () => document.body?.classList.add('ready'));

  window.MathJax = {
    loader: { paths: { mathjax: './vendor/mathjax',
                       'mathjax-fira': './vendor/mathjax-fira' } },
    startup: { typeset: false },      // the formulation is the only math, and it renders at startup
    // The explorer puts a focusable info badge on every expression and pulls in
    // a speech worker to fill it. Assistive MathML stays on, which is what a
    // screen reader actually reads, and costs neither the badge nor the worker.
    output: { displayOverflow: 'linebreak' },   // wrap wide formulas rather than scroll them
    options: { enableMenu: false,               // right-click belongs to the 3D views
               enableExplorer: false,           // and the badge it adds to every expression
               enableSpeech: false, enableBraille: false },
  };
</script>
<style>
  /* applyBg() overwrites every one of these on the root element, so these
     values are only ever on screen before it has run — which is exactly the
     stretch the cover below is up for. They were a dark scheme, so the page
     opened near-black and then turned the backdrop's cream the moment the
     module finished, a flash the cover made more obvious rather than less.
     They are now what applyBg() derives from the default backdrop, #f0ead6,
     which is the ground the interface is about to have. Change that default
     and these want recomputing with it. */
  :root { --bg:#f0ead6; --panel:#f0ead6; --line:#0000002e; --fg:#1b1a16; --dim:#75736f; --hot:#ee0012;
          --sel:#bbb9b4; --hud:#53514d; --ctl:#00000012; --link:#005fa4;
          /* chips sit over the 3D view, not in the panel, so they keep their own
             dark scheme however the panel is themed */
          --hudfg:#e8e8ec; --hudbg:#26262bd9; }
  * { box-sizing:border-box; }
  body { margin:0; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.45 'Fira Sans',ui-sans-serif,system-ui,sans-serif; }
  /* What the markup renders as before layout() runs is nothing like what it
     becomes: the panel is a column taller than the window, the tools are a
     stack in the corner, the plots sit in the middle of nothing, and the canvas
     is an empty black rectangle. Every one of those positions is computed, so
     there is no arrangement of CSS that would have them right in advance — but
     a page that spends its first second looking broken is worse than one that
     says what it is doing. So cover it until there is something worth showing. */
  #boot { position:fixed; inset:0; z-index:200; background:var(--bg);
          display:grid; place-content:center; justify-items:center; gap:9px; transition:opacity .3s ease; }
  #boot b { font-size:12px; font-weight:600; letter-spacing:.19em; color:var(--fg); }
  #boot span { font-size:11px; letter-spacing:.06em; color:var(--dim); }
  body.ready #boot { opacity:0; pointer-events:none; }
  /* still a transition, so transitionend still fires and still removes it */
  @media (prefers-reduced-motion: reduce) { #boot { transition-duration:1ms; } }
  /* the row must be 1fr, not the implicit auto: a sidebar taller than the
     viewport would otherwise stretch the row and push the canvas off-screen */
  #app { display:grid; grid-template-columns:1fr 330px; grid-template-rows:1fr; height:100vh; }
  main, aside { min-height:0; }

  main { position:relative; min-width:0; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  /* one canvas, four scissored viewports; the HUD is plain DOM on top */
  .quad { position:absolute; pointer-events:none; }
  .quad .sl { position:absolute; top:10px; bottom:10px; right:9px; display:flex; flex-direction:column;
              align-items:center; gap:6px; pointer-events:auto; font:11px 'Fira Mono',ui-monospace,monospace; color:var(--hud); }
  /* vertical range: writing-mode is the supported route now, and direction:rtl
     is what puts the minimum at the bottom rather than the top */
  .quad .sl input { flex:1; min-height:0; width:18px; accent-color:var(--link);
                    writing-mode:vertical-lr; direction:rtl; }
  .quad .sl b { font-weight:400; text-align:center; }
  .quad .sl i { font-style:normal; }
  input[type=color] { width:34px; height:24px; padding:1px; background:var(--ctl);
                      border:1px solid var(--line); border-radius:4px; }
  input[type=checkbox] { accent-color:var(--link); width:14px; height:14px; }
  /* no native dual range exists, so stack two: tracks inert, thumbs live */
  .dual { position:relative; flex:1; height:18px; min-width:0; }
  .dual::before { content:''; position:absolute; left:0; right:0; top:8px; height:3px; border-radius:2px; background:#3a3a42; }
  .dual .fill { position:absolute; left:0; right:0; top:8px; height:3px; border-radius:2px; }
  .dual input { position:absolute; inset:0; width:100%; height:18px; margin:0; background:none;
                pointer-events:none; -webkit-appearance:none; appearance:none; }
  .dual input::-webkit-slider-thumb { pointer-events:auto; -webkit-appearance:none; appearance:none;
    width:13px; height:13px; border-radius:50%; background:var(--link); border:1px solid var(--panel); cursor:pointer; }
  .dual input::-moz-range-thumb { pointer-events:auto; width:13px; height:13px; border-radius:50%;
    background:var(--link); border:1px solid var(--panel); cursor:pointer; }
  .dual input::-moz-range-track { background:none; }
  /* inline-flex, not flex: as a block it claimed the whole table cell and
     pushed the ? marker onto a line of its own */
  label.chk { display:inline-flex; align-items:center; gap:7px; cursor:pointer; vertical-align:middle; }
  #huewheel { cursor:crosshair; touch-action:none; display:block; }
  .wheelwrap { position:relative; display:inline-block; }
  #huereset { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
              width:34px; height:34px; padding:0; border-radius:50%; font-size:15px; line-height:1;
              display:grid; place-items:center; }
  /* tools live over the viewport, where the things they make are */
  /* one HUD column down the 3D view's left edge; layout() supplies the left */
  #hud { position:absolute; top:12px; display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
  #tool { display:flex; flex-direction:column; gap:4px; }
  #tip { position:absolute; right:14px; top:12px; }
  /* a grid cell rather than a floating card: layout() sizes it, so the canvas
     fills what is left after the buttons */
  #tip.cell { display:flex; flex-direction:column; gap:2px; padding:2px; }
  #tip.cell #tipcanvas { width:100%; height:auto; flex:1; min-height:0; }
  #tip.cell #tipbtns { margin-top:0; gap:2px; }
  #tip.cell #tipbtns button { font-size:9px; padding:1px 0; }
  #tipdock #tip { position:static; }
  #tipdock #tipcanvas { width:100%; height:auto; }
  #tipcanvas { display:block; border-radius:3px; width:264px; height:128px; }
  #tipbtns { display:flex; gap:4px; margin-top:6px; }
  #tipbtns button { flex:1; font-size:10px; padding:2px 0; }
  #tipbtns button[aria-pressed=true] { background:var(--sel); border-color:var(--link); }
  #hist { display:flex; flex-direction:column; gap:4px; }
  #hist button:disabled { opacity:.3; cursor:default; }
  #ctxmenu { position:absolute; z-index:40; display:flex; flex-direction:column; min-width:88px;
             background:#1c1c20f2; border:1px solid #32323a; border-radius:6px; padding:3px;
             box-shadow:0 6px 18px #000a; }
  #ctxmenu[hidden] { display:none; }
  #ctxmenu button { background:none; border:0; color:var(--hudfg); text-align:left; cursor:pointer;
                    padding:5px 9px; border-radius:4px; font:12px 'Fira Sans',ui-sans-serif,system-ui,sans-serif; }
  #ctxmenu button:hover { background:#3d5a6c; }
  #tool button, #graybtn, #hist button, #aboutbtn { width:34px; height:34px; padding:0; display:grid; place-items:center;
    background:var(--hudbg); border:1px solid #32323a; border-radius:5px; cursor:pointer;
    color:var(--hudfg); font-size:15px; line-height:1; }
  #tool button:hover, #graybtn:hover, #hist button:not(:disabled):hover, #aboutbtn:hover { background:#32323ae6; }
  #tool button[aria-pressed=true], #graybtn[aria-pressed=true] { background:#3d5a6c; border-color:#5f8ba6; }
  #tool svg { width:19px; height:19px; fill:none; stroke:var(--hudfg); stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; }
  #lplot { position:absolute; bottom:14px; right:14px; height:126px; display:flex; gap:16px; }
  .pplot { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  /* the controls sit above the plot rather than beside it: inside, they landed
     exactly where the curve ends up once lightness rises to the right */
  .phead { display:flex; align-items:center; gap:6px; height:18px;
           font:10px 'Fira Sans',ui-sans-serif,system-ui,sans-serif; color:var(--hud); }
  .phead .pbtns { margin-left:auto; display:flex; gap:3px; }
  .phead button { padding:1px 7px; font:10px 'Fira Mono',ui-monospace,monospace; background:#26262bcc;
    color:var(--hudfg); border:1px solid #32323a; border-radius:3px; cursor:pointer; }
  .pcanvas { flex:1; min-height:0; width:100%; display:block; cursor:ns-resize; touch-action:none; }
  #hex { flex:1; min-width:0; font:12px 'Fira Mono',ui-monospace,monospace; text-transform:lowercase; }
  #selcolor { flex:0 0 auto; width:40px; height:26px; }


  aside { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px;
          display:flex; flex-direction:column; gap:13px; }
  h1 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0; font-weight:600; }
  h2 { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:0 0 6px; font-weight:600; }
  section { border-top:1px solid var(--line); padding-top:11px; }
  section:first-of-type { border-top:0; padding-top:0; }

  .row { display:flex; align-items:center; gap:8px; }
  .row + .row { margin-top:6px; }
  label.f { flex:0 0 68px; color:var(--dim); }
  input[type=range] { flex:1; min-width:0; accent-color:var(--link); }
  .v { width:32px; text-align:right; font-variant-numeric:tabular-nums; }
  select, button { background:var(--ctl); color:var(--fg); border:1px solid var(--line);
                             border-radius:4px; padding:4px 6px; font:inherit; }
  button { cursor:pointer; } button:hover { background:#32323a; }
  .seg { display:flex; } .seg button { border-radius:0; flex:1; }
  .seg button:first-child { border-radius:4px 0 0 4px; } .seg button:last-child { border-radius:0 4px 4px 0; }
  .seg button[aria-pressed=true] { background:var(--sel); border-color:var(--link); }

  /* The one control the page is for, so it leads the section and is the only
     filled button in the panel — which is what makes it findable, rather than a
     colour nothing else uses. Running is the same button in the warning colour:
     the thing to press and the thing to press again are one place, not two. */
  #run { width:100%; margin:0 0 9px; padding:8px; font:600 12px/1 'Fira Sans',ui-sans-serif,system-ui,sans-serif;
         letter-spacing:.04em; background:var(--sel); border-color:var(--link); }
  #run:hover { background:var(--hud); color:var(--panel); }
  #run[data-on] { background:var(--hot); border-color:var(--hot); color:var(--panel); }

  /* A profile plot docked against the term it belongs to. The row is inserted
     after that term's own row, so the curve sits under the checkbox that turns
     it on rather than in a panel of its own somewhere else.
     Which is also why the plot's own checkbox goes: it is the same term as the
     row directly above, and two identical labels stacked read as a bug rather
     than as a convenience. Its buttons stay, and take the panel's own chrome
     instead of the dark chip they wear over the 3D view. */
  #metrics tr.plotrow > td { padding:1px 0 9px; }
  #metrics tr.plotrow .pplot { height:84px; }
  #metrics tr.plotrow .phead > .chk { display:none; }
  #metrics tr.plotrow .phead button { background:var(--ctl); color:var(--fg); border-color:var(--line); }
  #metrics tr.plotrow .phead button:hover { background:var(--sel); }

  /* the output belongs next to the thing it came from, not in a side panel.
     layout() sets top and bottom, since what is above it depends on where the
     preview ended up and what is below it on which split is in play. */
  #bar { position:absolute; right:14px; top:14px; bottom:154px; width:38px; min-height:130px;
         display:flex; flex-direction:column; align-items:center; gap:6px; }
  #strip { width:100%; flex:1; min-height:0; display:block; border-radius:5px; border:1px solid #0004; }
  #swatches { display:flex; flex-direction:column-reverse; gap:3px; width:100%; flex:1; min-height:0; }
  .sw { flex:1; width:100%; border-radius:3px; border:1px solid #0006; cursor:pointer; position:relative; }
  .sw[data-sel=true] { outline:2px solid #fff; outline-offset:1px; }
  .sw[data-bad=true]::after { content:'!'; position:absolute; inset:0; display:grid; place-items:center;
                              color:var(--hot); font-weight:700; text-shadow:0 0 3px #000; }

  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:2px 0; } td:first-child { color:var(--dim); } td:last-child { text-align:right; }
  td.warn { color:var(--hot); }
  #metrics td:nth-child(2) { white-space:nowrap; }
  .q { cursor:help; opacity:.4; margin-left:4px; font-size:10px; vertical-align:super; }
  /* A Metrics row has a help line under the table to write into; a control row
     does not, so these carry their own. */
  .row, section h2 { position:relative; }
  .row:has(.q[data-h]:hover), section h2:has(.q[data-h]:hover) { z-index:30; }
  /* a table row is not a reliable containing block, and these markers all sit in
     the first column anyway, so they anchor to themselves and open rightward */
  #metrics .q[data-h] { position:relative; }
  #metrics .q[data-h]:hover::after { left:0; right:auto; width:max-content; max-width:224px; }
  .q[data-h]:hover::after {
    content:attr(data-h); position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:30;
    padding:6px 8px; text-align:left; white-space:normal;
    background:#111116; border:1px solid #32323a; border-radius:5px; color:var(--hudfg);
    font:11px/1.45 'Fira Sans',ui-sans-serif,system-ui,sans-serif; box-shadow:0 5px 16px #000a;
    text-transform:none; letter-spacing:normal;   /* h2 hosts would pass theirs down */
    vertical-align:baseline; pointer-events:none; }
  .q:hover { opacity:1; color:var(--link); }
  #metrics td.w { width:52px; padding-left:4px; white-space:nowrap; }
  #metrics input.w { width:38px; background:var(--ctl); color:var(--fg); border:1px solid var(--line);
    border-radius:3px; padding:1px 3px; font:11px 'Fira Mono',ui-monospace,monospace; text-align:right;
    -moz-appearance:textfield; appearance:textfield; }
  #metrics input.w::-webkit-outer-spin-button, #metrics input.w::-webkit-inner-spin-button {
    -webkit-appearance:none; margin:0; }
  #metrics input.w { cursor:ns-resize; touch-action:none; }
  #metrics input.w:disabled { opacity:.3; cursor:default; }
  #metrics .mx { color:var(--dim); font-size:10px; margin-left:3px; }
  #metrics .mx[data-off] { opacity:.3; }
  .note { color:var(--dim); font-size:11px; }

  #aboutbtn { font-size:17px; flex:0 0 auto; }
  h2 #mathbtn { float:right; margin:-3px 0 0; padding:0 6px; font:11px/1.5 'Fira Sans',ui-sans-serif,system-ui,sans-serif;
                background:var(--ctl); color:var(--dim); border:1px solid var(--line); border-radius:3px;
                cursor:pointer; text-transform:none; letter-spacing:0; }
  h2 #mathbtn:hover { color:var(--fg); }
  .doc { max-width:min(760px, calc(100vw - 32px)); max-height:calc(100dvh - 56px); overflow-y:auto;
    overscroll-behavior:contain; padding:22px 26px; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:9px; font:13px/1.6 'Fira Sans',ui-sans-serif,system-ui,sans-serif; }
  .doc::backdrop { background:#000a; }
  .doc h3 { margin:0 0 14px; font-size:15px; letter-spacing:.06em; text-transform:uppercase; }
  .doc h4 { margin:19px 0 6px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  .doc p { margin:0 0 8px; }
  .doc dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 12px; align-items:baseline; }
  .doc dt { white-space:nowrap; }
  .doc dd { margin:0; color:var(--dim); }
  .doc .terms { margin:0; padding:0; list-style:none; }
  .doc .terms > li { margin:0 0 14px; }
  .doc .terms > li > p { margin:0; }
  .doc .terms .d { color:var(--dim); }
  /* two columns need room for the widest set definition; below that the label
     column squeezes the gloss into a three-word ribbon, so stack them */
  @media (max-width: 560px) {
    .doc dl { grid-template-columns:1fr; gap:0; }
    .doc dd { margin:1px 0 7px 14px; }
    /* The dock is one column at this width, so the preview takes the whole of
       it, and at its natural 2.06 that came back 180px tall — a third of the
       panel for the one thing there that is already legible small.
       An aspect rather than a height: a fixed height is one shape at 412 and
       another at 540, and the wide end of this tier is where it looked pulled.
       Every test image is drawn from the canvas's own size, so a wider box is
       a wider picture rather than a squashed one. */
    #tipdock #tipcanvas { height:auto; aspect-ratio:2.7; }
  }
  /* Wide formulas scroll sideways on a narrow viewport. The vertical padding is
     not decoration: MathJax's box arithmetic leaves each container overflowing
     its own height by a pixel or six, which with overflow-y hidden clips a
     descender and with overflow-y auto raises a scrollbar on a formula that
     fits. Six pixels of slack absorbs it. */
  .doc mjx-container[display="true"] { margin:0; padding:10px 0;
                                           overflow-x:auto; overflow-y:hidden; }
  /* MathJax sizes math relative to its surroundings; the dialog runs small */
  .doc mjx-container { font-size:107%; }
  .doc > button.x { position:absolute; top:12px; right:14px; width:26px; height:26px; padding:0;
    background:none; border:0; color:var(--dim); font-size:19px; line-height:1; cursor:pointer; }
  .doc > button.x:hover { color:var(--fg); }
  #aboutdlg { max-width:min(560px, calc(100vw - 32px)); max-height:calc(100dvh - 56px); overflow-y:auto; overscroll-behavior:contain; padding:20px 22px;
    background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:9px;
    font:13px/1.55 'Fira Sans',ui-sans-serif,system-ui,sans-serif; }
  #aboutdlg::backdrop { background:#000a; }
  #loaddlg { width:min(720px, calc(100vw - 32px)); max-height:calc(100dvh - 56px); overflow-y:auto;
    overscroll-behavior:contain; padding:20px 22px; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:9px;
    font:13px/1.5 'Fira Sans',ui-sans-serif,system-ui,sans-serif; }
  #loaddlg::backdrop { background:#000a; }
  #loaddlg h3 { margin:0 0 4px; font-size:15px; letter-spacing:.06em; text-transform:uppercase; }
  #loaddlg h4 { margin:16px 0 7px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  #loadclose { position:absolute; top:12px; right:12px; width:26px; height:26px; padding:0;
    background:none; border:0; color:var(--dim); font-size:19px; line-height:1; cursor:pointer; }
  #loadclose:hover { color:var(--fg); }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:7px; }
  .pcard { display:block; width:100%; padding:0; border:1px solid var(--line); border-radius:5px;
    background:none; overflow:hidden; cursor:pointer; text-align:left; }
  .pcard:hover { border-color:var(--link); }
  .pcard .pramp { display:block; height:26px; }
  .pcard .pname { display:block; padding:3px 6px; font-size:11px;
    font-family:'Fira Mono',ui-monospace,monospace; color:var(--dim); }
  .pcard:hover .pname { color:var(--fg); }
  #aboutdlg h3 { margin:0; font-size:15px; letter-spacing:.06em; text-transform:uppercase; }
  #aboutdlg h4 { margin:17px 0 5px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  #aboutdlg p { margin:0 0 9px; }
  #aboutdlg .lede { color:var(--dim); margin:3px 0 13px; }
  #aboutdlg ul { margin:6px 0 0; padding-left:17px; color:var(--dim); font-size:12px; }
  #aboutdlg li + li { margin-top:5px; }
  /* the citations are a footnote and read as one; instructions are not */
  #aboutdlg ul.how { color:inherit; font-size:inherit; margin:0; }
  #aboutdlg ul.how li + li { margin-top:4px; }
  #aboutdlg a, .doc a { color:var(--link); }
  #chromadlg { max-width:min(460px, calc(100vw - 32px)); }
  #chroma { width:100%; height:auto; display:block; border-radius:4px; }
  #chromacap { color:var(--dim); font-size:11px; margin:9px 0 0; line-height:1.5; }
  #aboutdlg .q { opacity:1; vertical-align:baseline; margin:0; font-size:inherit; color:var(--link); }
  #aboutclose { position:absolute; top:12px; right:12px; width:26px; height:26px; padding:0;
    background:none; border:0; color:var(--dim); font-size:19px; line-height:1; cursor:pointer; }
  #aboutclose:hover { color:var(--fg); }
  /* ── narrow ────────────────────────────────────────────────────────────────
     One column: canvas above, controls below. 48vh of canvas cannot also carry
     a 278px preview, a color bar and two plots on top of four viewports, so
     the preview and the plots move into the panel — see reflow(). They are the
     two overlays that are readouts and editors rather than camera furniture,
     and the plots want the full width anyway, since you drag their knots.
     The breakpoint is shared with the JS through matchMedia; the viewport
     split it selects lives in layout(). */
  #tipdock { display:none; }

  /* ── compact: the panel takes the overlays ──────────────────────────────
     Two thresholds, not one. The SHELL only has to stack on a phone, but the
     overlays stop fitting long before that: at 1280x720 the preview is most
     of the 3D panel's width, and by 933 the two plots are ~180px each and
     their button strips collide with their own labels. So the preview and the
     profiles move into the side panel here, while the layout stays side by
     side, and the tools rise to the top now that nothing sits above them. */
  @media (max-width: 1280px), (max-height: 719px) {
    #tipdock { display:block; margin-bottom:9px; }
    #lplot { position:static; height:auto; flex-direction:column; gap:9px; }
    .pplot { flex:none; height:84px; }          /* flex:1 would beat the height */
    #hud { top:12px; }
    #bar { bottom:14px; }
  }

  @media (max-width: 860px) {
    #app { grid-template-columns:1fr; grid-template-rows:48vh minmax(0,1fr); height:100dvh; }
    aside { border-left:0; border-top:1px solid var(--line); gap:11px;
            display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); align-content:start; }
    h1, section { grid-column:1/-1; }
    section { grid-column:auto; }

    /* the preview is the fourth cell of the cut strip; layout() places it.
       position must come BACK: the compact tier above sets it static to dock,
       and narrow is inside compact, so without this the inline left/top that
       layout() writes are ignored and it lays out in flow over the 3D view. */
    #lplot { position:static; height:auto; flex-direction:column; gap:8px; }
    #bar { right:10px; min-height:80px; }
    /* a 125px cut panel cannot spare 30px for a slider, and there is no wheel
       to scroll one with. The axis letter and its value stay as a label; the
       cuts move by touching a node, which is what lock-to-node is for. */
    .quad .sl { top:5px; bottom:auto; right:6px; flex-direction:row; gap:4px;
                pointer-events:none; font-size:10px; }
    .quad .sl input { display:none; }
    /* flex:none, or the desktop flex-basis:0 keeps overriding the height */
    .pplot { flex:none; height:76px; }

    /* nothing above the tools any more, and the bar stops at the cut row */
    #hud { top:10px; }
  }
  /* A phone on its side is 390px tall: stacking there leaves a canvas too
     short to orbit in. Side by side is the shape that fits, with the panel
     narrow — the dock inside it is already a column either way. */
  @media (max-width: 860px) and (min-aspect-ratio: 1/1) {
    #app { grid-template-columns:1fr minmax(240px,38%); grid-template-rows:1fr; }
    aside { border-top:0; border-left:1px solid var(--line); grid-template-columns:1fr; }
  }
</style>

<div id="boot"><b>PRECEPT PALETTE OPTIMIZER</b><span>loading…</span></div>
<div id="app">
  <main>
    <canvas id="gl"></canvas>
    <div id="tip">
      <canvas id="tipcanvas" width="264" height="128"></canvas>
      <div id="tipbtns"></div>
    </div>
    <div id="ctxmenu" hidden></div>
    <div id="hud">
      <button id="aboutbtn" title="what this is and how to drive it">?</button>
      <div id="tool">
        <button data-v="edit" title="Points"><svg viewBox="0 0 24 24">
          <polyline points="4,18 10,8 16,14 20,5"/><circle cx="4" cy="18" r="2.1"/>
          <circle cx="10" cy="8" r="2.1"/><circle cx="16" cy="14" r="2.1"/><circle cx="20" cy="5" r="2.1"/></svg></button>
        <button data-v="obstacle" title="Keep-out spheres"><svg viewBox="0 0 24 24">
          <circle cx="11" cy="13" r="7"/><path d="M11 13 L16 8"/><circle cx="16.6" cy="7.4" r="2.1"/></svg></button>
        <button data-v="plane" title="Halfplanes"><svg viewBox="0 0 24 24">
          <path d="M3 15 L12 10 L21 13 L12 18 Z"/><path d="M12 10 L12 3"/><circle cx="12" cy="3" r="1.9"/></svg></button>
      </div>
      <div id="tool" class="one">
        <button id="panelbtn" title="show or hide the cut views"><svg viewBox="0 0 24 24">
          <rect x="3" y="3.5" width="18" height="11" rx="1"/>
          <rect x="3" y="17" width="5" height="4" rx="1"/><rect x="9.5" y="17" width="5" height="4" rx="1"/>
          <rect x="16" y="17" width="5" height="4" rx="1"/></svg></button>
      </div>
      <div id="hist">
        <button id="undo" title="undo · ctrl+Z">↶</button>
        <button id="redo" title="redo · ctrl+shift+Z">↷</button>
      </div>
    </div>
    <div class="quad" id="q1">
      <div class="sl"><i id="nL">L</i><input type="range" id="sL" min="0" max="100" step="0.5" value="55"><b id="vL">55</b></div></div>
    <div class="quad" id="q2">
      <div class="sl"><i id="nA">a</i><input type="range" id="sA" min="-36" max="36" step="0.5" value="0"><b id="vA">0</b></div></div>
    <div class="quad" id="q3">
      <div class="sl"><i id="nB">b</i><input type="range" id="sB" min="-36" max="36" step="0.5" value="0"><b id="vB">0</b></div></div>
    <div class="quad" id="q0"></div>
    <div id="lplot">
      <div class="pplot" data-plot="L">
        <div class="phead">
          <label class="chk"><input type="checkbox" data-on="lramp">lightness profile</label>
          <span class="pbtns"><button data-p="fit" title="target ← the ramp's current profile">fit</button>
            <button data-p="p1"></button><button data-p="p2"></button></span>
        </div><canvas class="pcanvas"
              title="drag a knot to shape the target · drag the bracket on the left to move the whole profile, or its ends to stretch it"></canvas>
      </div>
      <div class="pplot" data-plot="H">
        <div class="phead">
          <label class="chk"><input type="checkbox" data-on="hprof">hue profile</label>
          <span class="pbtns"><button data-p="fit" title="target ← the ramp's current profile">fit</button>
            <button data-p="p1"></button><button data-p="p2"></button></span>
        </div><canvas class="pcanvas"
              title="drag a knot to shape the target · drag the bracket on the left to turn the whole profile, or its ends to widen the turn"></canvas>
      </div>
    </div>
    <div id="bar">
      <button id="graybtn" title="show the output in grayscale">◐</button>
      <canvas id="strip" width="40" height="600"></canvas><div id="swatches"></div>
    </div>
  </main>

  <aside>
    <h1>Precept Palette Optimizer</h1>

    <section>
      <h2>Palette</h2>
      <div id="tipdock"></div>
      <div class="seg" id="mode"><button data-v="continuous">Continuous</button><button data-v="discrete">Discrete</button></div>
      <div class="row" style="margin-top:6px"><label class="f">load</label>
        <button id="loadbtn" style="flex:1">load…</button></div>
    </section>

    <section id="selpanel">
      <h2>Selection</h2>
      <div class="row" id="selpreview">
        <input type="color" id="selcolor" title="pick the selected color">
        <span id="selinfo" class="note"></span></div>
      <div class="row"><select id="colorfmt" style="width:88px"></select>
        <input type="text" id="hex" spellcheck="false" style="flex:1;min-width:0"></div>
      <div class="row"><button id="flip" style="flex:1">flip the excluded side</button></div>
    </section>

    <section><h2>Optimize<button id="mathbtn" title="the problem being solved">?</button></h2>
      <button id="run">run optimizer</button>
      <table id="metrics"></table>
      <div class="row" style="margin-top:8px"><label class="f">rate</label>
        <input type="range" id="rate" min="0" max="1" step="0.02" value="0.3"><span class="v" id="ratev">.30</span>
        <label class="chk" title="jolt out of a stall and keep the best attempt"><input type="checkbox" id="restart">restarts</label></div>
      <div class="row" id="contrastrow"><label class="f">contrast</label>
        <input type="color" id="cbg" value="#ffffff" title="the ground swatches are judged against">
        <input type="number" id="cfloor" min="1" max="21" step="0.5" value="3"
               style="width:52px" title="minimum contrast ratio the palette should reach">
        <span class="note" style="flex:1">:1 floor</span>
        <span class="v" id="lcnow" style="width:auto;opacity:.7"
              title="the same worst swatch in APCA Lc — 60 is the floor for body text"></span>
        <span class="v" id="cnow" style="width:auto" title="worst swatch against that ground">–</span></div>
      <div class="row" id="lseprow"><label class="f">grayscale</label>
        <span class="note" style="flex:1">ΔL floor <b id="lsepv">–</b>, closest pair</span>
        <span class="v" id="lnow" style="width:auto" title="closest pair in lightness">–</span></div>
    </section>
    <section>
      <h2>Bounds</h2>
      <div class="row"><label class="f">lightness</label>
        <span class="dual" id="ldual"><span class="fill"></span>
          <input type="range" id="lmin" min="0" max="100" step="1" value="0">
          <input type="range" id="lmax" min="0" max="100" step="1" value="100"></span>
        <span class="v" style="width:56px" id="lboundv">0–100</span></div>
      <div class="row"><label class="f">chroma</label>
        <span class="dual" id="cdual"><span class="fill"></span>
          <input type="range" id="cmin" min="0" max="40" step="0.5" value="0">
          <input type="range" id="cmax" min="0" max="40" step="0.5" value="40"></span>
        <span class="v" style="width:56px" id="cboundv">0–40</span></div>
      <div class="row" style="align-items:flex-start"><label class="f" style="padding-top:44px">hue</label>
        <span class="wheelwrap"><canvas id="huewheel" width="112" height="112" title="drag an edge of the arc"></canvas>
          <button id="huereset" title="allow every hue">↺</button></span>
        <span class="v" style="width:56px;padding-top:44px" id="hboundv">any</span></div>
    </section>
    <section>
      <h2>View</h2>
      <div class="row"><label class="f">space</label><select id="spacesel" style="flex:1"></select>
        <button id="spacebtn" title="what each space is" style="padding:4px 9px">?</button></div>
      <div class="row"><label class="f">gamut</label><select id="gamutsel" style="flex:1"></select>
        <button id="iccbtn" style="padding:4px 7px">ICC…</button>
        <button id="chromabtn" title="the gamut on a chromaticity diagram" style="padding:4px 8px">&#9651;</button>
        <input type="file" id="iccfile" accept=".icc,.icm,application/vnd.iccprofile" hidden></div>
      <div class="row"><label class="f">vision</label>
        <select id="cvd" style="flex:1">
          <option value="none">normal</option><option value="protan">protan · red</option>
          <option value="deutan">deutan · green</option><option value="tritan">tritan · blue</option></select></div>
      <div class="row"><label class="f">severity</label>
        <input type="range" id="sev" min="0" max="1" step="0.05" value="1"><span class="v" id="sevv">1.0</span></div>
      <div class="row"><label class="f">solid</label>
        <input type="range" id="shell" min="0" max="1" step="0.02" value="0.8"><span class="v" id="shellv">0.8</span></div>
      <div class="row"><label class="f">slices</label>
        <input type="range" id="sliceop" min="0.1" max="1" step="0.05" value="0.8"><span class="v" id="sliceopv">0.8</span></div>
      <div class="row"><label class="f">backdrop</label><input type="color" id="bg" value="#f0ead6"></div>
      <div class="row"><label class="chk"><input type="checkbox" id="planes3d">slice planes in 3D</label></div>
      <div class="row"><label class="chk"><input type="checkbox" id="lock">lock slices to node</label></div>
    </section>

    <section><h2>Export</h2>
      <div class="row"><label class="f">name</label>
        <input type="text" id="scenename" value="precept" style="flex:1;min-width:0"></div>
      <div class="row"><label class="f">link</label>
        <button id="sharelink" style="flex:1">copy link to this palette</button></div>
      <div class="row"><label class="f">format</label><select id="exportfmt" style="flex:1"></select></div>
      <div class="row"><button id="copypy" style="flex:1">copy</button>
        <button id="savepy" style="flex:1">save</button></div></section>
  </aside>
</div>

<dialog id="aboutdlg">
  <button id="aboutclose" title="close">&times;</button>
  <div id="aboutbody"></div>
</dialog>

<dialog id="loaddlg">
  <button id="loadclose" title="close">&times;</button>
  <h3>Load a palette</h3>
  <div id="loadlist"></div>
</dialog>

<dialog id="chromadlg" class="doc">
  <button class="x" id="chromaclose" title="close">&times;</button>
  <h3>Chromaticity</h3>
  <canvas id="chroma"></canvas>
  <p id="chromacap" class="note"></p>
</dialog>

<dialog id="spacedlg" class="doc">
  <button class="x" id="spaceclose" title="close">&times;</button>
  <div id="spacebody"></div>
</dialog>

<dialog id="mathdlg" class="doc">
  <button class="x" id="mathclose" title="close">&times;</button>
  <div id="mathbody"></div>
</dialog>
