        } else S.obs[S.sel.i].c = p;
        disturb();
        sync();
        return;
      }
      if (e.key === 'Backspace' || e.key === 'Delete') {
        removeAt(S.sel.kind, S.sel.i);
      }
      if (e.key === 'Escape') {
        closeMenu();
        S.sel = null;
        sync();
      }
    });

    // ─── controls ────────────────────────────────────────────────────────────────
    /**
     * Retune the chroma bound to a new gamut. A bound parked at the old ceiling
     * meant "no bound", so it follows the ceiling up or down rather than staying at
     * a number that now means something; anything else is just clamped.
     */
    function retuneChroma() {
      const pal = S.pts.length ? palette() : [];
      const reach = pal.reduce((m, p) => Math.max(m, Math.hypot(p[1], p[2])), gamutReach);
      setChromaCeiling(Math.ceil(reach * 1.02));
    }

    /**
     * The chroma slider's top, from the gamut's reach and the palette's own.
     *
     * The gamut alone is not enough. A palette can sit outside the gamut on screen
     * — one loaded from a link written under a wider one, or a node dragged past
     * the hull — and with the ceiling set only by the gamut the band would cut it
     * off at a value the slider could not even express. Taking the larger of the
     * two means the loaded palette always fits inside the band it arrives in.
     *
     * setChromaCeiling then does the following through: a band sitting at the old
     * ceiling was never narrowed on purpose, so it moves to the new one, while a
     * band the user set stays where it is and is only clamped down if it has to be.
     */
    function setChromaCeiling(max) {
      const was = BOUND_MAX[1];
      if (max === was) return;
      BOUND_MAX[1] = max;
      for (const id of ['cmin', 'cmax']) {
        $(id).max = max;
        $(id).step = 'any';
      }
      if (S.hi[1] >= was - 1e-9) S.hi[1] = max;
      else S.hi[1] = Math.min(S.hi[1], max);
      S.lo[1] = Math.min(S.lo[1], S.hi[1]);
      invalidateCaps();
      // the thumbs and the readout come from S, and nothing else on this path puts
      // them there: raising the ceiling would leave a handle at its old value while
      // the band says otherwise
      paintBounds();
    }

    /** the three cut sliders and their readouts, from S.slice */
    function paintSlices() {
      ['sL', 'sA', 'sB'].forEach((id, k) => ($(id).value = S.slice[k]));
      [$('vL'), $('vA'), $('vB')].forEach((el, k) => (el.textContent = S.slice[k].toFixed(0)));
    }
    /**
     * One writer for a slice, so no caller has to remember what a slice is made
     * of: the value, clamped, the slider and the readout. Unclamped, scrolling past
     * the end would keep counting in S.slice while the slider sat pinned at its max.
     */
    const setSlice = (k, v) => {
      S.slice[k] = Math.min(FRAME.hi[k], Math.max(FRAME.lo[k], +v));
      paintSlices();
      sync();
    };
    const wheelStep = (k) => (FRAME.hi[k] - FRAME.lo[k]) / 66;
    $('sL').oninput = (e) => setSlice(0, e.target.value);
    $('sA').oninput = (e) => setSlice(1, e.target.value);
    $('sB').oninput = (e) => setSlice(2, e.target.value);

    $('shell').oninput = (e) => {
      S.shell = +e.target.value;
      $('shellv').textContent = unit1(S.shell);
      shell.material.uniforms.uOpacity.value = S.shell;
      shell.visible = S.shell > 0;
      capGroup.visible = S.shell > 0;
      paintCaps();
    };
    $('bg').oninput = (e) => {
      S.bg = e.target.value;
      applyBg();
    };
    $('sliceop').oninput = (e) => {
      S.sliceOp = +e.target.value;
      $('sliceopv').textContent = unit1(S.sliceOp);
      // the alpha is uOpacity in the fragment shader, and only paintSlice writes it.
      // Setting material.opacity and material.alphaTest did nothing: a raw
      // ShaderMaterial reads neither unless its shader asks for them, and this one
      // does not — it has no alphatest chunk and no opacity uniform of three's.
      slices.forEach(paintSlice);
    };
    $('gamutsel').onchange = (e) => {
      params.gamut = e.target.value; // changes what is REACHABLE; the screen stays sRGB
      refitSpace(); // the box the gamut occupies moved
      sync({ colors: true });
    };
    $('spacesel').onchange = (e) => {
      params.space = e.target.value; // a change of chart: no distance moves
      refitSpace();
      S.slice = [...FRAME.mid];
      paintSlices();
      sync();
    };
    /**
     * The strip a preset would actually produce, as a CSS gradient.
     *
     * Rendered rather than listed: a continuous map is its spline resampled to
     * equal perceived steps, which is not the same as its control points laid out
     * evenly, and the picker should show what loading it gives you. It goes
     * through paint() like everything else, so the swatches simulate whatever
     * observer the Vision panel has selected.
     */
    function rampCss(preset) {
      const pts = preset.hex.map(fromHex);
      if (preset.mode === 'discrete') {
        const w = 100 / pts.length;
        return `linear-gradient(90deg, ${pts
          .map((p, i) => `${paint(p)} ${(i * w).toFixed(3)}% ${((i + 1) * w).toFixed(3)}%`)
          .join(', ')})`;
      }
      const parts =
        preset.cut === undefined
          ? [pts]
          : [pts.slice(0, preset.cut + 1), pts.slice(preset.cut + 1)];
      const cs = parts.map((q) =>
        spline(
          q.map((p) => toSpace(p)),
          PER_SPAN,
          preset.kind === 'cyclic',
        ).map((c) => fromSpace(c)),
      );
      const { runs, len, total } = resampleRuns(cs, 32, M());
      const stops = [];
      let at = 0;
      runs.forEach((ps, k) => {
        const w = (100 * len[k]) / total;
        ps.forEach((p, i) =>
          stops.push(`${paint(p)} ${(at + (w * i) / (ps.length - 1)).toFixed(2)}%`),
        );
        at += w; // the next run starts where this one ended: a hard step
      });
      return `linear-gradient(90deg, ${stops.join(', ')})`;
    }

    const KIND_ORDER = ['sequential', 'diverging', 'multi', 'cyclic', 'categorical'];
    function paintLoadList() {
      const byKind = {};
      for (const [name, p] of Object.entries(PRESETS)) (byKind[p.kind] ??= []).push([name, p]);
      $('loadlist').innerHTML = KIND_ORDER.filter((k) => byKind[k])
        .map(
          (k) =>
            `<h4>${k}</h4><div class="pgrid">` +
            byKind[k]
              .map(
                ([name, p]) =>
                  `<button class="pcard" data-preset="${esc(name)}" title="${esc(name)}, ${p.hex.length} control points">` +
                  `<span class="pramp" style="background:${rampCss(p)}"></span>` +
                  `<span class="pname">${esc(name)}</span></button>`,
              )
              .join('') +
            '</div>',
        )
        .join('');
    }

    $('panelbtn').onclick = () => {
      S.panels = !S.panels;
      layout();
      mirror();
      sync();
    };

    wireDialog('loadbtn', 'loaddlg', 'loadclose', paintLoadList);
    $('loadlist').onclick = (e) => {
      const name = e.target.closest('[data-preset]')?.dataset.preset;
      const preset = PRESETS[name];
      if (!preset) return;
      S.mode = preset.mode;
      S.pts = preset.hex.map(fromHex);
      S.pin = []; // a new palette, not the old one renumbered
      S.cut = [];
      S.marks = [];
      if (preset.cut !== undefined) S.cut[preset.cut] = true; // where a multi-sequential map steps
      S.loop = [preset.kind === 'cyclic']; // the cyclic maps load as the loops they are
      S.sel = null;
      fitProfiles();
      retuneChroma(); // a band left at the top follows the new palette
      paintToggle('mode');
      $('loaddlg').close();
      sync();
    };
    /** whatever named the color — the picker or the typed field — lands here */
    function setSelColor(p) {
      if (!S.sel || !p || !p.every(Number.isFinite)) return;
      if (S.sel.kind === 'pt') S.pts[S.sel.i] = p;
      else if (S.sel.kind.startsWith('obs')) S.obs[S.sel.i].c = p;
      else return; // a plane has no color to set
      if (S.lock) setSlices(p);
      sync();
    }
    $('hex').oninput = (e) => setSelColor(COLORFMT[S.cfmt].from(e.target.value));
    $('selcolor').oninput = (e) => setSelColor(fromHex(e.target.value));
    const REPULSIONS = ['rep', 'repcvd'];
    /** Groups where running two members at once is incoherent, not just redundant. */
    const EXCLUSIVE = [REPULSIONS];
    $('metrics').onclick = (e) => {
      const { on } = e.target.dataset ?? {};
      if (on) {
        S.on[on] = e.target.checked;
        // The two repulsions overlap rather than complement: 'all' already includes
        // the observer 'normal' measures, so running both only weights that one
        // observer twice against the others. At most one — neither is fine too.
        if (e.target.checked)
          for (const grp of EXCLUSIVE)
            if (grp.includes(on)) for (const other of grp) if (other !== on) S.on[other] = false;
        sidebar();
      }
    };
    // no re-render on input: the table is rebuilt from S.w anyway, and rebuilding
    // under the cursor would take the field's focus away mid-number
    $('metrics').oninput = (e) => {
      const k = e.target.dataset?.w;
      if (!k) return;
      S.w[k] = Math.max(0, +e.target.value || 0);
      pushState();
    };

    /**
     * Drag a multiplier up or down to set it.
     *
     * Weights are read as ratios — twice this term, a tenth of that — and a linear
     * drag spends most of its travel between 5 and 20 and almost none of it under
     * 1, which is where the useful settings are. So the travel is logarithmic:
     * two decades, 0.1 to 10, and the same drag is the same ratio wherever it
     * starts. Two significant figures, because a weight of 0.6231 is a number
     * pretending to a precision the objective does not have.
     *
     * The whole range is one 220px drag either way, so fewer decades buy a gentler
     * curve rather than a shorter gesture: 110px per decade instead of 73.
     *
     * The field stays typable. Nothing moves until the pointer has, by a few
     * pixels, so a click still lands a caret.
     */
    const W_LO = 0.1,
      W_HI = 10,
      W_TRAVEL = 220; // px for the whole range
    const wAt = (t) => +(W_LO * (W_HI / W_LO) ** Math.min(1, Math.max(0, t))).toPrecision(2);
    const wPos = (v) =>
      Math.log(Math.min(W_HI, Math.max(W_LO, v || W_LO)) / W_LO) / Math.log(W_HI / W_LO);

    let wDrag = null;
    $('metrics').addEventListener('pointerdown', (e) => {
      const el = e.target.closest('input.w');
      if (el && !el.disabled)
        wDrag = { el, y: e.clientY, t: wPos(+el.value), id: e.pointerId, moved: false };
    });
    // The whole range is 220px and the box is 38 tall, so the pointer is outside it
    // for all but the smallest change. Following it on the window rather than
    // capturing it keeps that working without depending on capture being available.
    addEventListener('pointermove', (e) => {
      if (!wDrag || e.pointerId !== wDrag.id) return;
      const dy = wDrag.y - e.clientY; // up is more
      if (!wDrag.moved) {
        if (Math.abs(dy) < 3) return; // a click is still a click
        wDrag.moved = true;
      }
      e.preventDefault(); // or the drag selects the digits
      const v = wAt(wDrag.t + dy / W_TRAVEL);
      wDrag.el.value = v;
      S.w[wDrag.el.dataset.w] = v;
      pushState();
    });
    for (const ev of ['pointerup', 'pointercancel'])
      addEventListener(ev, () => {
        wDrag = null;
      });
    $('run').onclick = () => (running ? stopSolver() : startSolver());
    $('graybtn').onclick = (e) => {
      S.gray = !S.gray;
      e.currentTarget.ariaPressed = S.gray;
      applyBg();
      sidebar();
    };
    // The preview folds away to its own button, which stays where the preview was
    // — so the way back is in the place the thing that left used to be.
    $('tipoff').onclick = () => {
      S.tip = !S.tip;
      layout();
      mirror();
      sidebar();
    };
    $('rate').oninput = (e) => {
      S.rate = +e.target.value;
      $('ratev').textContent = S.rate.toFixed(2).slice(1);
      pushState(); // read every step, repaints nothing
    };
    $('restart').onchange = (e) => {
      S.restart = e.target.checked;
      sidebar();
    };
    $('cbg').oninput = (e) => {
      S.cbg = e.target.value;
      sidebar();
    };
    $('cfloor').oninput = (e) => {
      S.cmin = Math.max(1, +e.target.value || 1);
      sidebar();
    };
    $('flip').onclick = () => {
      const pl = S.planes[S.sel?.i];
      if (!pl || !S.sel.kind.startsWith('plane')) return;
      pl.n = pl.n.map((c) => -c);
      pl.d = -pl.d; // same plane, other side excluded
      sync();
    };
    /**
     * Hue lives on a circle, so it gets a circle. Two thumbs on a straight track
     * could only ever express arcs that do not cross 0°, which rules out every
     * warm corridor — magma's runs purple through red to orange, straight over the
     * seam. Dragging an edge past the other here just wraps, with nothing to
     * special-case. Orientation matches the "down L" panel: +a right, +b up.
     */
    const wheel = $('huewheel'),
      wctx = wheel.getContext('2d');
    const WN = wheel.width,
      WMID = WN / 2,
      WOUT = 52,
      WIN = 33;
    const wheelAngle = (x, y) => ((Math.atan2(WMID - y, x - WMID) * 180) / Math.PI + 360) % 360;
    const onRing = (h, r) => [
      WMID + r * Math.cos((h * Math.PI) / 180),
      WMID - r * Math.sin((h * Math.PI) / 180),
    ];

    const WLUT = new Float32Array(720 * 3);
    let wlutKey = null;
    /** The ring's color is a function of ANGLE alone — one variable, not two — so
     *  it wants a lookup table, not a shader. Resolving it once per half-degree
     *  turns 12.5k gamut-mapping bisections into 720, which beats moving the same
     *  redundant work to the GPU. Half a degree is well under a pixel at this radius. */
    function wheelLut() {
      const key = `${S.cvd}|${S.sev}|${params.gamut}`; // the ring depends on nothing else
      if (key === wlutKey) return;
      wlutKey = key;
      for (let i = 0; i < 720; i++) {
        const a = (i * Math.PI) / 360;
        const c = toSRGB(view(toGamut([62, 20 * Math.cos(a), 20 * Math.sin(a)], 'srgb')));
        for (let k = 0; k < 3; k++) WLUT[i * 3 + k] = 255 * clamp01(c[k]);
      }
    }

    /**
     * The ring is a picture of the gamut through the active color-vision view, so
     * it goes stale on a vision change and on a gamut change — neither of which
     * goes anywhere near paintBounds, which used to be its only caller. Keying it
     * on everything it reads and calling it from sidebar() means no path can miss
     * it: an added dependency shows up in the key, not in a bug report.
     */
    let wheelKey = null;
    function drawWheel() {
      const key = `${S.cvd}|${S.sev}|${params.gamut}|${S.hue}`;
      if (key === wheelKey) return;
      wheelKey = key;
      wheelLut();
      const img = wctx.createImageData(WN, WN),
        d = img.data;
      for (let y = 0; y < WN; y++)
        for (let x = 0; x < WN; x++) {
          const dx = x - WMID + 0.5,
            dy = WMID - y - 0.5,
            r = Math.hypot(dx, dy);
          if (r < WIN || r > WOUT) continue;
          const h = ((Math.atan2(dy, dx) * 180) / Math.PI + 360) % 360;
          const li = (Math.round(h * 2) % 720) * 3;
          const k = inHueArc(h) ? 1 : 66 / 255; // same dimming as the slice shading
          const o = 4 * (y * WN + x);
          d[o] = WLUT[li] * k;
          d[o + 1] = WLUT[li + 1] * k;
          d[o + 2] = WLUT[li + 2] * k;
          d[o + 3] = 255;
        }
      wctx.putImageData(img, 0, 0);
      if (hueAll()) return; // full circle: no edges to mark
      wctx.lineWidth = 2;
      S.hue.forEach((h, i) => {
        const [ax, ay] = onRing(h, WIN - 1),
          [bx, by] = onRing(h, WOUT + 1);
        wctx.beginPath();
        wctx.moveTo(ax, ay);
        wctx.lineTo(bx, by);
        wctx.strokeStyle = '#000';
        wctx.stroke();
        const [hx, hy] = onRing(h, (WIN + WOUT) / 2);
        wctx.beginPath();
        wctx.arc(hx, hy, 4.5, 0, 7);
        wctx.fillStyle = i === 0 ? '#fff' : '#111';
        wctx.fill();
        wctx.strokeStyle = i === 0 ? '#111' : '#fff';
        wctx.lineWidth = 1.5;
        wctx.stroke();
        wctx.lineWidth = 2;
      });
    }

    let wheelDrag = null;
    const wheelAt = (e) => {
      const r = wheel.getBoundingClientRect();
      return wheelAngle(
        ((e.clientX - r.left) * WN) / r.width,
        ((e.clientY - r.top) * WN) / r.height,
      );
    };

    wheel.addEventListener('pointerdown', (e) => {
      const h = wheelAt(e);
      if (hueAll()) {
        // opening a fresh arc: start it at the cursor and take hold of the FAR
        // edge. Snapping the grabbed edge to the click would open a zero-width
        // arc, which excludes every hue at once.
        S.hue = [h, (h + 90) % 360];
        wheelDrag = 1;
      } else {
        wheelDrag = angGap(h, S.hue[0]) <= angGap(h, S.hue[1]) ? 0 : 1; // nearer edge
        S.hue[wheelDrag] = h;
      }
      wheel.setPointerCapture(e.pointerId);
      boundsChanged();
    });
    wheel.addEventListener('pointermove', (e) => {
      if (wheelDrag === null) return;
      S.hue[wheelDrag] = wheelAt(e); // dragging past the other edge simply wraps
      boundsChanged();
    });
    wheel.addEventListener('pointerup', () => {
      wheelDrag = null;
    });
    // The arc by keyboard: left and right move its start, up and down its end, two
    // degrees a press and ten with shift. On a full circle the first press opens a
    // quarter arc, as a click does. Delete allows every hue again. Stopped, so the
    // window does not read Delete as removing the selected node.
    wheel.addEventListener('keydown', (e) => {
      const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowDown: [1, -1], ArrowUp: [1, 1] }[
        e.key
      ];
      if (e.key === 'Delete' || e.key === 'Backspace') S.hue = [0, 360];
      else if (d) {
        if (hueAll()) S.hue = [0, 90];
        S.hue[d[0]] = (((S.hue[d[0]] + d[1] * (e.shiftKey ? 10 : 2)) % 360) + 360) % 360;
      } else return;
      e.preventDefault();
      e.stopPropagation();
      boundsChanged();
      announce(
        hueAll()
          ? 'every hue allowed'
          : `hue arc ${S.hue[0].toFixed(0)}° to ${S.hue[1].toFixed(0)}°`,
      );
    });
    wheel.addEventListener('dblclick', () => {
      S.hue = [0, 360];
      boundsChanged();
    });

    /** hard-stop gradient over [0,1] spans, so one code path draws both a plain
     *  band and the two pieces a wrapped hue arc splits into */
    const fillCss = (spans) => {
      const stops = ['transparent 0%'];
      for (const [a, b] of spans)
        stops.push(
          `transparent ${a * 100}%`,
          `var(--link) ${a * 100}%`,
          `var(--link) ${b * 100}%`,
          `transparent ${b * 100}%`,
        );
      return `linear-gradient(90deg, ${stops.join(',')}, transparent 100%)`;
    };
    function paintBounds() {
      [
        ['ldual', 'lmin', 'lmax', 'lboundv', 0],
        ['cdual', 'cmin', 'cmax', 'cboundv', 1],
      ].forEach(([wrap, lo, hi, out, k]) => {
        $(lo).value = S.lo[k];
        $(hi).value = S.hi[k];
        $(out).textContent = `${Math.round(S.lo[k])}–${Math.round(S.hi[k])}`;
        $(wrap).querySelector('.fill').style.background = fillCss([
          [S.lo[k] / BOUND_MAX[k], S.hi[k] / BOUND_MAX[k]],
        ]);
      });
      const [h0, h1] = S.hue;
      $('hboundv').textContent = hueAll() ? 'any' : `${h0.toFixed(0)}–${h1.toFixed(0)}°`;
      drawWheel();
    }
    const boundsChanged = () => {
      paintBounds();
      sync({ colors: true });
    };
    [
      ['lmin', 'lo', 0],
      ['lmax', 'hi', 0],
      ['cmin', 'lo', 1],
      ['cmax', 'hi', 1],
    ].forEach(([id, side, k]) => {
      $(id).oninput = (e) => {
        S[side][k] = +e.target.value;
        if (S.lo[k] > S.hi[k]) S[side === 'lo' ? 'hi' : 'lo'][k] = S[side][k]; // thumbs never cross
        boundsChanged();
      };
    });

    $('lock').onchange = (e) => {
      S.lock = e.target.checked;
    };
    $('planes3d').onchange = (e) => {
      S.planes3d = e.target.checked;
      setPlanes3d();
    };
    const setPlanes3d = () => (S.planes3d ? cam3.layers.enable(3) : cam3.layers.disable(3));
    $('sev').oninput = (e) => {
      S.sev = +e.target.value;
      $('sevv').textContent = unit1(S.sev);
      setView();
    };
    $('cvd').onchange = (e) => {
      S.cvd = e.target.value;
      setView();
    };
    $('swatches').onclick = (e) => {
      const i = e.target.dataset?.i;
      if (i != null && S.mode === 'discrete') {
        select({ kind: 'pt', i: +i });
        sync();
      }
    };

    function setView() {
      sync({ colors: true }); // derive() picks the observer up
      applyBg(); // and the page around the palette follows
    }

    /** press the button of a group that matches S */
    const paintToggle = (id) => {
      for (const b of $(id).children) b.ariaPressed = b.dataset.v === S[id];
    };
    for (const id of ['mode', 'tool']) {
      $(id).onclick = (e) => {
        // closest(), not e.target: the tool buttons wrap an <svg>, so a click on the
        // icon itself targets a <path> or <circle> that carries no data-v. Testing
        // the target directly meant only the button's padding responded.
        const btn = e.target.closest('[data-v]');
        if (!btn) return;
        S[id] = btn.dataset.v;
        paintToggle(id);
        sync();
      };
    }

    // Controls mirror S, so a state that did not come from the DOM cannot desync.
    // Loading a scene is exactly that case, which is why this is a function.
    function mirror() {
      $('cvd').value = S.cvd;
      $('sev').value = S.sev;
      $('shell').value = S.shell;
      $('bg').value = S.bg;
      $('lock').checked = S.lock;
      $('planes3d').checked = S.planes3d;
      setPlanes3d();
      $('panelbtn').ariaPressed = String(S.panels);
      $('tipoff').innerHTML = S.tip ? '&#9652;' : '&#9662;'; // folds up, unfolds down
      $('tipoff').title = S.tip ? 'hide the preview' : 'show the preview';
      $('sliceop').value = S.sliceOp;
      $('sliceopv').textContent = unit1(S.sliceOp);
      $('rate').value = S.rate;
      $('ratev').textContent = S.rate.toFixed(2).slice(1);
      $('restart').checked = S.restart;
      $('cbg').value = S.cbg;
      $('cfloor').value = S.cmin;
      $('exportfmt').value = S.fmt;
      $('colorfmt').value = S.cfmt;
      $('hex').placeholder = COLORFMT[S.cfmt].hint;
      $('sevv').textContent = unit1(S.sev);
      $('shellv').textContent = unit1(S.shell);
      $('spacesel').value = params.space;
      $('gamutsel').value = params.gamut;
      ['sL', 'sA', 'sB'].forEach((id, k) => ($(id).value = S.slice[k]));
      for (const id of ['mode', 'tool']) paintToggle(id);
      paintBounds();
      paintPlotButtons();
      applyBg();
    }
    /** the gamut menu, rebuilt when a profile is loaded */
    function paintGamutList() {
      $('gamutsel').innerHTML = Object.entries(GAMUTS)
        .map(
          ([k, g]) =>
            `<option value="${k}"${k === params.gamut ? ' selected' : ''}>${g.name}</option>`,
        )
        .join('');
    }

    /**
     * Hover help for the controls, in one table rather than title= attributes
     * scattered through the markup. The marker is the same ? the Metrics rows use.
     */
    const HINTS = {
      mode: 'Ramp or swatch set.',
      loadbtn: 'Load a published palette.',
      spacesel: 'Space for the panels and for distances.',
      gamutsel:
        'Which colors are reachable. ICC\u2026 loads a profile, \u25b3 shows the chromaticity diagram.',
      cvd: 'Simulate a color vision deficiency.',
      sev: 'Severity. 1 is dichromacy, less is anomalous trichromacy.',
      shell: 'Opacity of the gamut solid.',
      sliceop: 'Opacity of the cut planes.',
      bg: 'Backdrop color. The panel follows it.',
      planes3d: 'Show the cut planes in the 3D view.',
      lock: 'Cuts follow the node you touch.',
      colorfmt: 'Notation for the selected color.',
      lmin: 'Lightness band.',
      cmin: 'Chroma band.',
      huewheel: 'Allowed hue arc.',
      cbg: 'Background and minimum contrast ratio.',
      rate: 'Step size.',
      restart: 'On a stall, jolt the points and keep the best result.',
      run: 'Optimize the enabled terms until stopped.',
      scenename: 'Name for saved files and exports.',
      sharelink: 'Copy a link that holds this whole setup.',
      exportfmt: 'Format for copy and save.',
    };
    for (const [k, text] of Object.entries(HINTS)) {
      const el = document.getElementById(k);
      // a hint for a control that no longer exists is a typo, not a reason to take
      // the page down on the way past
      if (!el) {
        console.warn(`hint for missing control: ${k}`);
        continue;
      }
      const host =
        el.closest('label.chk') ??
        el.closest('.row')?.querySelector('label.f') ??
        el.closest('.row') ??
        el.closest('section').querySelector('h2');
      const id = `q-${k}`;
      host.insertAdjacentHTML(
        'beforeend',
        `<span class="q" id="${id}" role="note" tabindex="0" aria-label="${esc(text)}" data-h="${esc(text)}">?</span>`,
      );
      // the control is described by its hint, so a screen reader reads both
      el.setAttribute(
        'aria-describedby',
        [el.getAttribute('aria-describedby'), id].filter(Boolean).join(' '),
      );
    }
    /**
     * Where the two profile plots live.
     *
     * Over the canvas they are one overlay side by side. Docked, each takes a row
     * of the Optimize table directly under its own checkbox. Discrete mode has no
     * profile terms, so there is no row to find and they stay in the overlay, which
     * sidebar() has already hidden.
     *
     * Lift both out before touching the rows. paintMetrics regenerates the table by
     * innerHTML with the plots still inside it and only then calls here, so by this
     * point they are detached, canvas, context and listeners intact, and the
     * document has no .pplot to query. The elements come from PLOTS for that
     * reason, and re-appending them is the repair.
     */
    function homePlots() {
      const plots = ['L', 'H'].map((id) => PLOTS[id].root);
      lplotEl.append(...plots);
      $('metrics')
        .querySelectorAll('tr.plotrow')
        .forEach((r) => r.remove());
      if (!DOCK.matches) return;
      ['lramp', 'hprof'].forEach((term, i) => {
        const tr = $('metrics').querySelector(`tr[data-k="${term}"]`);
        if (!tr) return;
        const row = tr.parentElement.insertBefore(document.createElement('tr'), tr.nextSibling);
        row.className = 'plotrow';
        const td = row.appendChild(document.createElement('td'));
        td.colSpan = 3;
        td.appendChild(plots[i]);
      });
    }

    /**
     * The profiles are an editor rather than camera furniture, and they move into
     * the panel when there is no room for them over the canvas. Reparenting rather
     * than duplicating: one plot canvas with one set of listeners, in whichever
     * place the width can afford.
     */
    function reflow() {
      homePlots(); // the profiles, into Optimize or back out
      layout(); // and the preview, which layout() sizes
      sidebar(); // both canvases were just resized
    }

    // ─── boot ────────────────────────────────────────────────────────────────────
    // Open on a real colormap rather than a placeholder ramp: every metric in the
    // panel then reads against something whose values are known and worth knowing.
    S.pts = PRESETS.viridis.hex.map(fromHex);
    reframe(); // FRAME must exist before anything calls world()
    S.slice = [...FRAME.mid];
    $('spacesel').innerHTML = Object.entries(SPACES)
      .map(
        ([k, sp]) =>
          `<option value="${k}"${k === params.space ? ' selected' : ''}>${sp.name}</option>`,
      )
      .join('');
    paintGamutList();
    $('exportfmt').innerHTML = Object.keys(FORMATS)
      .map((k) => `<option value="${k}">${k}</option>`)
      .join('');
    $('colorfmt').innerHTML = Object.entries(COLORFMT)
      .map(([k, f]) => `<option value="${k}">${f.label}</option>`)
      .join('');
    buildShell();
    retuneChroma();
    shell.material.uniforms.uOpacity.value = S.shell;
    shell.visible = S.shell > 0;
    select(S.sel);
    // The 3D view is the one worth opening on at any size — the three cuts are a
    // second reading of the same solid, and they are worth asking for rather than
    // worth arriving with. Only the opening default: the button says which way it
    // is, a resize does not undo a choice, and a scene in the URL sets it from the
    // link rather than from the screen it is opened on.
    S.panels = false;
    fitProfiles();
    mirror();
    commit();
    loadFromHash();
    for (const mq of [NARROW, DOCK]) mq.addEventListener('change', reflow);
    new ResizeObserver(layout).observe(main); // catches sidebar and devtools resizes too
    reflow();
    applyBg();
    setView();
    frame();
    /**
     * Uncover the interface: laid out by reflow(), filled by setView(), and drawn
     * once by the frame() above. The wait is one frame and not zero because the
     * canvas has been rendered into but not yet composited — revealing in this
     * callback puts the cover's fade and the first real paint in the same frame,
     * where dropping it a moment earlier would show exactly the unplaced markup it
     * was there to hide.
     */
    requestAnimationFrame(() => {
      document.body.classList.add('ready');
      $('boot').addEventListener('transitionend', (e) => e.target.remove(), { once: true });
    });
  </script>
</html>
