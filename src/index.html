<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Precept Palette Optimizer</title>
  <!-- the emoji as an SVG document, so there is no file to ship or fetch -->
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>"
  />
  <!-- The biggest module the page needs, named before anything has parsed the
     script that asks for it. Unnamed it sits behind a serial hop — three.module
     is a renderer that imports the rest, so the browser must fetch and parse
     635 kB to discover the 1.4 MB behind it, and the largest file began
     downloading a second into the load. A hint, not a second fetch: the import
     takes it from the module map. The build points this at its bundle. -->
  <link rel="modulepreload" href="/node_modules/three/build/three.core.js" />
  <style>
    /* Fira, self-hosted, latin plus the one Greek weight the interface needs
     (the ΔL note). Everything Fira has no glyph for — ↺, ◐, the rotate
     arrows — falls back per glyph exactly as it did before. */
    @font-face {
      font-family: 'Fira Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      unicode-range:
        U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
        U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      src: url(/node_modules/@fontsource/fira-sans/files/fira-sans-latin-400-normal.woff2)
        format('woff2');
    }
    @font-face {
      font-family: 'Fira Sans';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      unicode-range:
        U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
        U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      src: url(/node_modules/@fontsource/fira-sans/files/fira-sans-latin-700-normal.woff2)
        format('woff2');
    }
    @font-face {
      font-family: 'Fira Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
      src: url(/node_modules/@fontsource/fira-sans/files/fira-sans-greek-400-normal.woff2)
        format('woff2');
    }
    @font-face {
      font-family: 'Fira Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      unicode-range:
        U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
        U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      src: url(/node_modules/@fontsource/fira-mono/files/fira-mono-latin-400-normal.woff2)
        format('woff2');
    }
  </style>
  <script>
    // The cover over the interface comes off when the module has laid it out. If
    // the module throws on the way there it never will, and the page would sit on
    // `loading…` for good — so uncover on an uncaught error too. A half-built
    // interface is at least legible, and the console says what happened. Only
    // script errors reach window this way; a font or image that fails to load
    // fires on its own element and does not bubble.
    addEventListener('error', () => document.body?.classList.add('ready'));
  </script>
  <style>
    /* applyBg() overwrites every one of these on the root element, so these
     values are only ever on screen before it has run — which is exactly the
     stretch the cover below is up for. They were a dark scheme, so the page
     opened near-black and then turned the backdrop's cream the moment the
     module finished, a flash the cover made more obvious rather than less.
     They are now what applyBg() derives from the default backdrop, #f0ead6,
     which is the ground the interface is about to have. Change that default
     and these want recomputing with it. */
    :root {
      --bg: #f0ead6;
      --panel: #f0ead6;
      --line: #0000002e;
      --fg: #1b1a16;
      --dim: #696864;
      --hot: #c4000c;
      --sel: #bbb9b4;
      --hud: #53514d;
      --ctl: #00000012;
      --link: #005fa4;
      /* chips sit over the 3D view, not in the panel, so they keep their own
             dark scheme however the panel is themed */
      --hudfg: #e8e8ec;
      --hudbg: #26262bd9;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font:
        13px/1.45 'Fira Sans',
        ui-sans-serif,
        system-ui,
        sans-serif;
    }
    /* What the markup renders as before layout() runs is nothing like what it
     becomes: the panel is a column taller than the window, the tools are a
     stack in the corner, the plots sit in the middle of nothing, and the canvas
     is an empty black rectangle. Every one of those positions is computed, so
     there is no arrangement of CSS that would have them right in advance — but
     a page that spends its first second looking broken is worse than one that
     says what it is doing. So cover it until there is something worth showing. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 9px;
      transition: opacity 0.3s ease;
    }
    #boot b {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.19em;
      color: var(--fg);
    }
    #boot span {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--dim);
    }
    body.ready #boot {
      opacity: 0;
      pointer-events: none;
    }
    /* still a transition, so transitionend still fires and still removes it */
    @media (prefers-reduced-motion: reduce) {
      #boot {
        transition-duration: 1ms;
      }
    }
    /* the row must be 1fr, not the implicit auto: a sidebar taller than the
     viewport would otherwise stretch the row and push the canvas off-screen */
    #app {
      display: grid;
      grid-template-columns: 1fr 330px;
      grid-template-rows: 1fr;
      height: 100vh;
    }
    main,
    aside {
      min-height: 0;
    }

    main {
      position: relative;
      min-width: 0;
    }
    #gl {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* one canvas, four scissored viewports; the HUD is plain DOM on top */
    .quad {
      position: absolute;
      pointer-events: none;
    }
    .quad .sl {
      position: absolute;
      top: 10px;
      bottom: 10px;
      right: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      font:
        11px 'Fira Mono',
        ui-monospace,
        monospace;
      color: var(--hud);
    }
    /* vertical range: writing-mode is the supported route now, and direction:rtl
     is what puts the minimum at the bottom rather than the top */
    .quad .sl input {
      flex: 1;
      min-height: 0;
      width: 18px;
      accent-color: var(--link);
      writing-mode: vertical-lr;
      direction: rtl;
    }
    .quad .sl b {
      font-weight: 400;
      text-align: center;
    }
    .quad .sl i {
      font-style: normal;
    }
    input[type='color'] {
      width: 34px;
      height: 24px;
      padding: 1px;
      background: var(--ctl);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    input[type='checkbox'] {
      accent-color: var(--link);
      width: 14px;
      height: 14px;
    }
    /* no native dual range exists, so stack two: tracks inert, thumbs live */
    /* drawn to the measurements of the native accent-colored range the other
     sliders are: an 8px rounded track, light when inactive, and a 14px thumb */
    .dual {
      position: relative;
      flex: 1;
      height: 24px;
      min-width: 0;
    }
    .dual::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      height: 8px;
      border-radius: 4px;
      background: #efefef;
      box-shadow: inset 0 0 0 1px #0000001a;
    }
    .dual .fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      height: 8px;
      border-radius: 4px;
    }
    .dual input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 24px;
      margin: 0;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .dual input::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--link);
      border: 0;
      cursor: pointer;
    }
    .dual input::-moz-range-thumb {
      pointer-events: auto;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--link);
      border: 0;
      cursor: pointer;
    }
    .dual input::-moz-range-track {
      background: none;
    }
    /* inline-flex, not flex: as a block it claimed the whole table cell and
     pushed the ? marker onto a line of its own */
    label.chk {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      vertical-align: middle;
    }
    #huewheel {
      cursor: crosshair;
      touch-action: none;
      display: block;
    }
    .wheelwrap {
      position: relative;
      display: inline-block;
    }
    #huereset {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      font-size: 15px;
      line-height: 1;
      display: grid;
      place-items: center;
    }
    /* tools live over the viewport, where the things they make are */
    /* one HUD column down the 3D view's left edge; layout() supplies the left */
    #hud {
      position: absolute;
      top: 12px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      gap: 5px;
      align-items: flex-start;
    }
    #tool,
    #tool2 {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #tip {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 264px;
    }
    /* a grid cell rather than a floating card: layout() sizes it, so the canvas
     fills what is left after the buttons */
    #tip.cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 2px;
    }
    #tip.cell #tipcanvas {
      width: 100%;
      height: auto;
      flex: 1;
      min-height: 0;
    }
    #tip.cell #tipbtns,
    #tip.mini #tipbtns {
      margin-top: 3px;
      gap: 2px;
    }
    /* [data-tip] only: these squeeze the test NAMES, and the toggle beside them
     is one glyph that still has to be hittable */
    #tip.cell #tipbtns button[data-tip],
    #tip.mini #tipbtns button[data-tip] {
      font-size: 9px;
      padding: 1px 0;
    }
    /* aspect rather than a height: drawTest sizes the backing store from the box
     it is given, so the element's own width and height attributes are whatever
     it was last drawn at and cannot be the thing that decides the shape */
    #tipcanvas {
      display: block;
      border-radius: 3px;
      width: 100%;
      height: auto;
      aspect-ratio: 264/128;
    }
    #tipbtns {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    #tipbtns button {
      flex: 1;
      font-size: 10px;
      padding: 2px 0;
      min-height: 24px;
    }
    /* the one button that is not a test image, and the only thing left of the
     preview when it is off — so it does not take an equal share of the row */
    #tipbtns #tipoff {
      flex: 0 0 auto;
      padding: 0 6px;
      min-width: 24px;
      font-size: 11px;
      line-height: 1.4;
    }
    #tip.off #tipcanvas,
    #tip.off #tipbtns button[data-tip] {
      display: none;
    }
    #tip.off #tipbtns {
      margin-top: 0;
    }
    #tipbtns button[aria-pressed='true'] {
      background: var(--sel);
      border-color: var(--link);
    }
    #hist {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #hist button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    #ctxmenu {
      position: absolute;
      z-index: 40;
      display: flex;
      flex-direction: column;
      min-width: 88px;
      background: #1c1c20f2;
      border: 1px solid #32323a;
      border-radius: 6px;
      padding: 3px;
      box-shadow: 0 6px 18px #000a;
    }
    #ctxmenu[hidden] {
      display: none;
    }
    #ctxmenu button {
      background: none;
      border: 0;
      color: var(--hudfg);
      text-align: left;
      cursor: pointer;
      padding: 5px 9px;
      border-radius: 4px;
      font:
        12px 'Fira Sans',
        ui-sans-serif,
        system-ui,
        sans-serif;
    }
    #ctxmenu button:hover {
      background: #3d5a6c;
    }
    #tool button,
    #tool2 button,
    #graybtn,
    #hist button,
    #aboutbtn {
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--hudbg);
      border: 1px solid #32323a;
      border-radius: 5px;
      cursor: pointer;
      color: var(--hudfg);
      font-size: 15px;
      line-height: 1;
    }
    #tool button:hover,
    #tool2 button:hover,
    #graybtn:hover,
    #hist button:not(:disabled):hover,
    #aboutbtn:hover {
      background: #32323ae6;
    }
    #tool button[aria-pressed='true'],
    #tool2 button[aria-pressed='true'],
    #graybtn[aria-pressed='true'] {
      background: #3d5a6c;
      border-color: #5f8ba6;
    }
    #tool svg,
    #tool2 svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: var(--hudfg);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #lplot {
      position: absolute;
      bottom: 14px;
      right: 14px;
      height: 132px;
      display: flex;
      gap: 16px;
    }
    .pplot {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    /* the controls sit above the plot rather than beside it: inside, they landed
     exactly where the curve ends up once lightness rises to the right */
    .phead {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      font:
        10px 'Fira Sans',
        ui-sans-serif,
        system-ui,
        sans-serif;
      color: var(--hud);
    }
    .phead .pbtns {
      margin-left: auto;
      display: flex;
      gap: 3px;
    }
    .phead > .chk {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
    }
    .phead button {
      padding: 1px 7px;
      min-height: 24px;
      font:
        10px 'Fira Mono',
        ui-monospace,
        monospace;
      background: #26262bcc;
      color: var(--hudfg);
      border: 1px solid #32323a;
      border-radius: 3px;
      cursor: pointer;
    }
    .pcanvas {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: block;
      cursor: ns-resize;
      touch-action: none;
    }
    #hex {
      flex: 1;
      min-width: 0;
      font:
        12px 'Fira Mono',
        ui-monospace,
        monospace;
      text-transform: lowercase;
    }
    #selcolor {
      flex: 0 0 auto;
      width: 40px;
      height: 26px;
    }
    #selsim {
      flex: 0 0 auto;
      width: 40px;
      height: 26px;
      border-radius: 4px;
      border: 1px solid var(--line);
      box-sizing: border-box;
    }

    aside {
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    #panelcols {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    h1 {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 0;
      font-weight: 700;
    }
    h2 {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 0 0 6px;
      font-weight: 700;
    }
    section {
      border-top: 1px solid var(--line);
      padding-top: 11px;
    }
    section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row + .row {
      margin-top: 6px;
    }
    label.f {
      flex: 0 0 68px;
      color: var(--dim);
    }
    input[type='range'] {
      flex: 1;
      min-width: 0;
      accent-color: var(--link);
    }
    .v {
      width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    select,
    button {
      background: var(--ctl);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 6px;
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #32323a;
    }
    .seg {
      display: flex;
    }
    .seg button {
      border-radius: 0;
      flex: 1;
    }
    .seg button:first-child {
      border-radius: 4px 0 0 4px;
    }
    .seg button:last-child {
      border-radius: 0 4px 4px 0;
    }
    .seg button[aria-pressed='true'] {
      background: var(--sel);
      border-color: var(--link);
    }

    /* The one control the page is for, so it leads the section and is the only
     filled button in the panel — which is what makes it findable, rather than a
     colour nothing else uses. Running is the same button in the warning colour:
     the thing to press and the thing to press again are one place, not two. */
    #run {
      width: 100%;
      margin: 0 0 9px;
      padding: 8px;
      font:
        600 12px/1 'Fira Sans',
        ui-sans-serif,
        system-ui,
        sans-serif;
      letter-spacing: 0.04em;
      background: var(--sel);
      border-color: var(--link);
    }
    #run:hover {
      background: var(--hud);
      color: var(--panel);
    }
    #run[data-on] {
      background: var(--hot);
      border-color: var(--hot);
      color: var(--panel);
    }

    /* A profile plot docked against the term it belongs to. The row is inserted
     after that term's own row, so the curve sits under the checkbox that turns
     it on rather than in a panel of its own somewhere else.
     Which is also why the plot's own checkbox goes: it is the same term as the
     row directly above, and two identical labels stacked read as a bug rather
     than as a convenience. Its buttons stay, and take the panel's own chrome
     instead of the dark chip they wear over the 3D view. */
    #metrics tr.plotrow > td {
      padding: 1px 0 9px;
    }
    #metrics tr.plotrow .pplot {
      height: 104px;
    } /* 64px of curve was thin between the 0 and 100 ticks */
    #metrics tr.plotrow .phead > .chk {
      display: none;
    }
    #metrics tr.plotrow .phead button {
      background: var(--ctl);
      color: var(--fg);
      border-color: var(--line);
    }
    #metrics tr.plotrow .phead button:hover {
      background: var(--sel);
    }

    /* the output belongs next to the thing it came from, not in a side panel.
     layout() sets top and bottom, since what is above it depends on where the
     preview ended up and what is below it on which split is in play. */
    /* the swatch, and so the bar: a share of the viewport, no smaller than a
     24px target and no larger than it was on a full window */
    :root {
      --swatch: clamp(24px, 2.6vw, 38px);
    }
    #bar {
      position: absolute;
      right: 14px;
      top: 14px;
      bottom: 154px;
      width: var(--swatch);
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #strip {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: block;
      border-radius: 5px;
      border: 1px solid #0004;
    }
    /* squares stacked from the bottom right, index 0 lowest; past the bar's height
     they wrap into a further column to the left rather than shrinking */
    #swatches {
      position: absolute;
      right: 0;
      top: 40px;
      bottom: 0;
      display: flex;
      flex-direction: column-reverse;
      flex-wrap: wrap-reverse;
      align-content: flex-start;
      justify-content: flex-start;
      gap: 3px;
    }
    .sw {
      flex: none;
      width: var(--swatch);
      height: var(--swatch);
      border-radius: 3px;
      border: 1px solid #0006;
      cursor: pointer;
      position: relative;
      padding: 0;
      font: inherit;
    }
    .sw[data-sel='true'] {
      outline: 2px solid #fff;
      outline-offset: 1px;
    }
    .sw[data-bad='true']::after {
      content: '!';
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--hot);
      font-weight: 700;
      text-shadow: 0 0 3px #000;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    /* fixed: the value column and the weight column keep their width whatever
     they hold, so a number, a share bar or a warning mark appearing during a
     run moves nothing else */
    #metrics {
      table-layout: fixed;
    }
    td {
      padding: 2px 0;
    }
    td:first-child {
      color: var(--dim);
    }
    td:last-child {
      text-align: right;
    }
    td.warn {
      color: var(--hot);
    }
    #metrics td:nth-child(2) {
      white-space: nowrap;
      width: 66px;
      text-align: right;
      position: relative;
      padding-left: 36px;
    }
    .q {
      cursor: help;
      opacity: 0.65;
      margin-left: 4px;
      font-size: 10px;
      vertical-align: super;
    }
    /* A Metrics row has a help line under the table to write into; a control row
     does not, so these carry their own. */
    .row,
    section h2 {
      position: relative;
    }

     One column: canvas above, controls below. 48vh of canvas cannot also carry
     two plots on top of four viewports, so the profiles move into the panel —
     see reflow(). They are the overlay that is an editor rather than camera
     furniture, and they want the full width anyway, since you drag their knots.
     The preview stays over the view and shrinks with it; see layout().
     The breakpoint is shared with the JS through matchMedia; the viewport
     split it selects lives in layout(). */
    /* ── compact: the panel takes the profiles ─────────────────────────────
     Two thresholds, not one. The SHELL only has to stack on a phone, but the
     profiles stop fitting long before that: by 933 the two plots are ~180px
     each and their button strips collide with their own labels. So they move
     into the side panel here, while the layout stays side by side, and the
     tools rise to the top now that nothing sits above them. */
    @media (max-width: 1280px), (max-height: 719px) {
      #lplot {
        position: static;
        height: auto;
        flex-direction: column;
        gap: 9px;
      }
      .pplot {
        flex: none;
        height: 84px;
      } /* flex:1 would beat the height */
      #hud {
        top: 12px;
      }
      #bar {
        bottom: 14px;
      }
    }

    @media (max-width: 860px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 48vh minmax(0, 1fr);
        height: 100dvh;
      }
      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
        gap: 11px;
      }
      /* Columns, not a grid of them. A grid lays the sections out a ROW at a
       time, so a row is as tall as the tallest thing in it and Optimize — the
       one section that is 600px long — left Palette beside it as a strip of
       controls over 500px of nothing, with Bounds and View pushed off the
       bottom of the panel. Multicol fills one column before it starts the
       next, so the short sections gather in the other column instead of
       queueing behind the tall one, and reading order still runs down a column
       and across, which is also the order the keyboard tabs in. The panel
       scrolls, so the height the columns balance against has to be the
       wrapper's own and not the panel's, or the overflow would go sideways.

       Two at most, though the tier is wide enough for three at 860. Columns
       are filled in order, and Optimize is taller than a third of the panel,
       so a third column can only be [Palette][Optimize][the rest] — which puts
       an 89px section alone in a column and is the same complaint in another
       shape. At two it comes out 720 against 668. */
      #panelcols {
        display: block;
        columns: 258px 2;
        column-gap: 11px;
      }
      #panelcols > section {
        break-inside: avoid;
        margin-bottom: 11px;
      }

      /* the preview is the fourth cell of the cut strip; layout() places it.
       position must come BACK: the compact tier above sets it static to dock,
       and narrow is inside compact, so without this the inline left/top that
       layout() writes are ignored and it lays out in flow over the 3D view. */
      #lplot {
        position: static;
        height: auto;
        flex-direction: column;
        gap: 8px;
      }
      #bar {
        right: 10px;
        min-height: 80px;
      }
      /* a 125px cut panel cannot spare 30px for a slider, and there is no wheel
       to scroll one with. The axis letter and its value stay as a label; the
       cuts move by touching a node, which is what lock-to-node is for. */
      .quad .sl {
        top: 5px;
        bottom: auto;
        right: 6px;
        flex-direction: row;
        gap: 4px;
        pointer-events: none;
        font-size: 10px;
      }
      .quad .sl input {
        display: none;
      }
      /* flex:none, or the desktop flex-basis:0 keeps overriding the height */
      .pplot {
        flex: none;
        height: 76px;
      }

      /* nothing above the tools any more, and the bar stops at the cut row */
      #hud {
        top: 10px;
      }
    }
    /* A phone on its side is 390px tall: stacking there leaves a canvas too
     short to orbit in. Side by side is the shape that fits, with the panel
     narrow — the dock inside it is already a column either way. */
    @media (max-width: 860px) and (min-aspect-ratio: 1/1) {
      #app {
        grid-template-columns: 1fr minmax(240px, 38%);
        grid-template-rows: 1fr;
      }
      aside {
        border-top: 0;
        border-left: 1px solid var(--line);
        grid-template-columns: 1fr;
      }
    }

    import {

      CVD_ID,
      FRAME,
      QUADS,
      boxLines,
      buildObstacles,
      buildPlanes,
      buildPoints,
      buildShell,

      cam3,
      canvas,
      capGroup,
      controls,
      cpt,
      gamutReach,
      invalidateCaps,
      paintCaps,
      paintShell,
      obsGroup,
      paintSlice,
      planeCenter,
      planeGroup,
      ptGroup,

      renderer,

      scene,
      sdir,
      shell,
      slices,
      updateBox,

    import { PRESETS } from './data/palettes.js';
    import { SPECTRAL_LOCUS } from './data/spectral-locus.ts';

    const $ = (id) => document.getElementById(id);
    /**
     * Severity and the two opacities all run 0 to 1 and all read to one decimal,
     * so they are three characters wide whatever they hold: 0.0, 0.8, 1.0. The
     * panel's other sliders strip the leading zero, which cannot hold a width —
     * .8 is two characters and 1.0 is three — and reading 1 through the same
     * .slice(1) gives ".0", since the digit it drops is only a zero in the middle
     * of the range.
     */
    const unit1 = (v) => v.toFixed(1);
    const esc = (x) => x.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

    // ─── state the sections share ────────────────────────────────────────────────
    let stepShare = null; // each term's share of the solver's last step, from the worker
    let plotsShown = null; // whether the profile plots were in the layout at the last sidebar paint
    let BAR_BOTTOM = '',
      TIP_FLOATS = true; // what layout() decided, for placeTip()
    let running = false,
      frames = 0; // whether the solver is running, and how many frames it has sent
    let drag = null; // what the pointer is dragging in the views, if anything

    /** the space or the gamut changed: refit the frame, the panels and the solid */
    function refitSpace() {
      reframe();
      layout();
      buildShell();
      retuneChroma();
    }
    const paint = (p) =>
      `rgb(${rgb(p)
        .map((c) => Math.round(255 * c))
        .join(' ')})`;
    /**
     * What the output bar shows. Grayscale here is the neutral color at the SAME
     * chart lightness, not a luma-weighted average of the channels — the question
     * it answers is "does this ramp still read once hue and chroma are gone", and
     * only the perceptual lightness axis answers that.
     */
    const shownCss = (p) => paint(S.gray ? [p[0], 0, 0] : p);

    /**
     * Where a new control point belongs. Appending is almost never what you meant:
     * click near the ribbon and you want the curve to pass through there, which is
     * an insertion between the two controls that already bracket that stretch;
     * click out in open space and you are extending the ramp, which is an insertion
     * at whichever END you clicked nearer. Blind append does the second badly and
     * the first not at all — it drags the tail of the curve across the solid.
     *
     * `spline` emits PER_SPAN samples per interval, so the index of the nearest
     * curve sample names the interval directly. No search over control points.
     */
    function addPoint(p) {
      const d3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
      // pins and breaks both move with the points: a new node inherits neither
      const at = (i) => {
        S.pin.splice(i, 0, false);
        S.cut.splice(i, 0, false);
        return i;
      };
      if (S.mode !== 'continuous' || S.pts.length < 2) return at(S.pts.push(p) - 1);

      // the nearest place on any run, not on a concatenation of them: the index of
      // a sample only names a span within the run it came from
      let best = null;
      runs().forEach((r) => {
        if (r.nodes.length < 2) return;
        curveOf(
          r.nodes.map((i) => S.pts[i]),
          r.closed,
        ).forEach((q, j) => {
          const d = d3(p, q);
          if (!best || d < best.d) best = { d, j, r };
        });
      });
      if (best && best.d <= 10) {
        // chart units: about a comfortable ΔE
        const { r, j } = best,
          m = r.nodes.length;
        // spans are PER_SPAN samples each, and span s runs from node s to node s+1,
        // so the new point goes just after node s
        const idx = r.nodes[Math.min(m - 1, Math.floor(j / PER_SPAN))] + 1;
        S.pts.splice(idx, 0, p);
        return at(idx);
      }
      if (d3(p, S.pts[0]) < d3(p, S.pts[S.pts.length - 1])) {
        S.pts.unshift(p);
        return at(0);
      }
      return at(S.pts.push(p) - 1);
    }

    // ─── layout and render loop ──────────────────────────────────────────────────
    const main = canvas.parentElement,
      lplotEl = $('lplot');
    // declared above layout(), which reads them: anything that lays out during
    // module evaluation would otherwise hit their temporal dead zone
    const NARROW = matchMedia('(max-width: 860px)');
    const DOCK = matchMedia('(max-width: 1280px), (max-height: 719px)');
    function layout() {
      const w = Math.max(1, main.clientWidth),
        h = Math.max(1, main.clientHeight);
      renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
      renderer.setSize(w, h, false);
      /**
       * Which of three arrangements the canvas can hold, by its own aspect rather
       * than by a media query — the panel's position changes the canvas shape as
       * much as the window does, so 918x874 and 730x874 want different splits even
       * though neither is a phone.
       *
       *   columns  the classic 3|1, three cuts stacked beside a tall 3D view
       *   squares  two squares: a 2x2 of the cuts and the preview, and the 3D view
       *   row      3D above, the four cells in a strip beneath it
       *
       * QUADS is ordered with the ortho views first, so index 3 is the big one.
       */
      // With the cut views hidden there is no split to choose: the 3D view takes
      // the canvas and the three quads are given no box at all, which is also what
      // keeps frame() from setting a zero-width scissor on them.
      const A = w / h;
      // Aspect alone cannot choose any of these, because the same shape at two
      // sizes wants opposite splits. A phone in portrait leaves a canvas near
      // 412x380 and a laptop leaves one near 1060x900: three stacked cuts are
      // readable at 350 wide and useless at 100, so columns needs the width. A
      // maximized 1080p window leaves 1590x960 and a small landscape one leaves
      // 760x432, both about 1.66 wide: three stacked cuts are 320 tall in the first
      // and 144 in the second, so squares needs the canvas to be short as well as
      // wide. Without that, taking a browser out of fullscreen was enough to swap
      // the layout, since chrome is exactly what moves 1080 into the band.
      const mode = A >= 1.6 && h < 720 ? 'squares' : A <= 1.0 || w < 640 ? 'row' : 'columns';
      let RECTS,
        cell = null,
        stripH = 0;
      if (!S.panels) {
        RECTS = [null, null, null, { x: 0, y: 0, w, h }];
      } else if (mode === 'squares') {
        // A 2x2 beside the 3D view. The column's WIDTH is capped so it cannot take
        // more than half the canvas, but its height is not: below aspect 2 a square
        // grid would leave a band of dead space under it, and a cell slightly
        // taller than wide costs nothing — the cameras fit their content either way.
        const gw = Math.min(Math.floor(w / 2), h);
        const cw = Math.floor(gw / 2),
          ch = Math.floor(h / 2);
        RECTS = [
          { x: 0, y: 0, w: cw, h: ch },
          { x: cw, y: 0, w: gw - cw, h: ch },
          { x: 0, y: ch, w: cw, h: h - ch },
          { x: gw, y: 0, w: w - gw, h },
        ];
        cell = { x: cw, y: ch, w: gw - cw, h: h - ch };
      } else if (mode === 'row') {
        // square-ish cells: a share of the width is the natural size, and a taller
        // row only letterboxes the content it holds. Capped so the strip cannot eat
        // the 3D view on a short canvas.
        //
        // Four cells when the preview is one of them, three when it is floating
        // over the view instead: on a phone a quarter of the width is a hundred
        // pixels, and three cuts at a third are worth more than four at a quarter.
        // Hidden, it is not one of them either, and the cuts take the width back.
        const four = !DOCK.matches && S.tip;
        const colW = Math.floor(w / (four ? 4 : 3)),
          rowH = Math.min(colW, Math.round(h * 0.4));
        stripH = rowH;
        RECTS = [
          { x: 0, y: h - rowH, w: colW, h: rowH },
          { x: colW, y: h - rowH, w: colW, h: rowH },
          { x: 2 * colW, y: h - rowH, w: four ? colW : w - 2 * colW, h: rowH },
          { x: 0, y: 0, w, h: h - rowH },
        ];
        cell = four ? { x: 3 * colW, y: h - rowH, w: w - 3 * colW, h: rowH } : null;
      } else {
        const colW = Math.min(440, Math.max(200, Math.round(w * 0.3)));
        const rowH = Math.floor(h / 3);
        RECTS = [
          { x: 0, y: 0, w: colW, h: rowH },
          { x: 0, y: rowH, w: colW, h: rowH },
          { x: 0, y: 2 * rowH, w: colW, h: h - 2 * rowH },
          { x: colW, y: 0, w: w - colW, h },
        ];
      }
      /**
       * The preview is the fourth cell when the split has one for it, and floats
       * over the 3D view when it does not. layout() owns that call rather than
       * reflow(), because it is the one that computed the split.
       *
       * Switched off it is never a cell: what is left is one button, and a button
       * does not want a quarter of the cut strip.
       */
      if (!S.tip) cell = null;
      const tip = $('tip');
      if (tip.parentElement !== main) main.appendChild(tip);
      tip.classList.toggle('cell', !!cell);
      // Floating, it keeps the share of the view it has on a full-size window: 264
      // over the 777 that a 1440 leaves for the 3D panel. Held to the share rather
      // than to 264 pixels, a phone gets a thumbnail instead of a card lying across
      // the gamut, and the preview never has to be somewhere other than the view it
      // is previewing. Under 200 it is too narrow for the test names at full size.
      const tw = cell ? cell.w : Math.min(264, Math.round(RECTS[3].w * 0.34));
      tip.classList.toggle('mini', !cell && tw < 200);
      tip.classList.toggle('off', !S.tip);
      if (cell) {
        Object.assign(tip.style, {
          left: `${cell.x}px`,
          top: `${cell.y}px`,
          right: 'auto',
          bottom: 'auto',
          width: `${cell.w}px`,
          height: S.tip ? `${cell.h}px` : 'auto',
        });
      } else {
        tip.removeAttribute('style');
        tip.style.width = S.tip ? `${tw}px` : 'auto'; // off, it is one button wide
      }
      // the color bar stops above the strip whenever there is one, whether or not
      // the preview is one of its cells
      $('bar').style.top = '14px';
      // above the strip when there is one; otherwise the stylesheet's reserve for
      // the profile plots, which a discrete palette does not have, so there it
      // goes to the corner
      BAR_BOTTOM = stripH ? `${stripH + 12}px` : S.mode === 'continuous' ? '' : '14px';
      TIP_FLOATS = !cell;
      placeTip();
      QUADS.forEach((q, i) => {
        q.rect = RECTS[i];
        q.el.hidden = !q.rect;
        if (!q.rect) return;
        Object.assign(q.el.style, {
          left: q.rect.x + 'px',
          top: q.rect.y + 'px',
          width: q.rect.w + 'px',
          height: q.rect.h + 'px',
        });
        const aspect = q.rect.w / q.rect.h;
        if (q.cam.isPerspectiveCamera) {
          q.cam.aspect = aspect;
        } else {
          // grow the frustum to whichever dimension the content needs, so the view
          // fills the quad at any aspect instead of staying square and spilling out
          const { w: cw, h: ch } = q.cam.userData.content;
          const H = Math.max(ch, cw / aspect) * 1.08;
          q.cam.top = H;
          q.cam.bottom = -H;
          q.cam.right = H * aspect;
          q.cam.left = -H * aspect;
        }
        q.cam.updateProjectionMatrix();
      });
      /**
       * The tools are one column, and the 3D view is not always tall enough for it.
       * With the cuts showing, a phone in portrait leaves the view 187px and the
       * column wants 265, so undo and redo sat on top of the first cut view — over
       * its nodes, and over the taps meant for them. Given the height the view
       * actually has, the column wraps into a second one beside it rather than
       * running off the end of the thing it belongs to. Nothing wraps on a desktop,
       * where the view is the full height of the window.
       */
      const hud = $('hud');
      hud.style.left = `${RECTS[3].x + 12}px`;
      hud.style.maxHeight = `${RECTS[3].y + RECTS[3].h - hud.offsetTop - 12}px`;
      // only while it is an overlay; docked in the panel it is laid out by flow
      if (!DOCK.matches) lplotEl.style.left = RECTS[3].x + 14 + 'px';
      // drawTest sizes the backing store from the box the preview is given, and
      // the box moves with the split, so a resize that changes it has to redraw or
      // the picture stays at the old resolution with CSS stretching it to the new one.
      if (
        S.tip &&
        (tipc.width !== Math.round(tipc.clientWidth) ||
          tipc.height !== Math.round(tipc.clientHeight))
      )
        drawTest();
      layoutPlot();
    }

    /**
     * The bar and a floating preview share the right edge, the preview at the
     * bottom of it and the bar stopping above.
     *
     * Where the bottom IS depends on what else is down there — the cut strip, or
     * the profile plots on a full window, or nothing — and the bar already knows,
     * because it stops above the same things. So the gap is read off the bar's
     * own box rather than reconstructed from the three bottoms it can have.
     *
     * Stacking the two needs a tall view, and a phone does not have one: with the
     * cuts showing it leaves 187px, and the bar came out 60 tall, which is a
     * swatch rather than a color bar. So when stacking would leave the bar a
     * stub, the preview steps to the LEFT of it and the bar keeps its height.
     * The swatches wrap into columns to the left of the bar, so beside it the
     * preview clears the widest of them; sidebar() calls this again once it has
     * laid the swatches out.
     */
    function placeTip() {
      const tip = $('tip'),
        bar = $('bar');
      bar.style.bottom = BAR_BOTTOM;
      if (!TIP_FLOATS) return;
      tip.style.right = '';
      const gap = main.clientHeight - (bar.offsetTop + bar.offsetHeight);
      tip.style.bottom = `${gap}px`;
      bar.style.bottom = `${gap + tip.offsetHeight + 14}px`;
      if (bar.offsetHeight < 120) {
        bar.style.bottom = `${gap}px`;
        const m = main.getBoundingClientRect().left,
          sw = $('swatches');
        const left =
          Math.min(
            bar.getBoundingClientRect().left,
            ...(sw.style.display === 'none'
              ? []
              : [...sw.children].map((e) => e.getBoundingClientRect().left)),
          ) - m;
        tip.style.right = `${main.clientWidth - left + 8}px`;
      }
    }

    /**
     * The backdrop is the whole interface's ground, not just the viewport's: the
     * panel takes the same color and everything on it flips for contrast. Which
     * way to flip is decided by the backdrop's own lightness in the chart, the one
     * perceptual number already to hand. Chips over the 3D view keep their dark
     * scheme, since they float over a colored solid rather than sit on the panel.
     */
    function applyBg() {
      // As the chosen observer sees it: the backdrop, and every color derived from
      // it, go through the vision view and the grayscale switch, so the whole page
      // is looked at the way the palette is.
      const seen = (p) => toGamut(S.gray ? [p[0], 0, 0] : view(p), 'srgb');
      const ground = toHex(seen(fromHex(S.bg)));
      renderer.setClearColor(new T.Color(ground), 1);
      // Text and accent are derived from the backdrop rather than picked from two
      // fixed palettes: the same hue, pushed the other way along lightness by a
      // fixed amount, which is a contrast the chart can actually promise. The
      // accent takes the opposite hue when the backdrop has one to oppose. The
      // offsets for --dim and --hot are the smallest that clear 4.5:1 on the
      // default backdrop.
      const [L, C, h] = toLCh(fromHex(S.bg));
      const light = L > 55,
        dir = light ? -1 : 1;
      const at = (dL, c2, hue = h) =>
        toHex(seen(toGamut(fromLCh([Math.min(100, Math.max(0, L + dir * dL)), c2, hue]))));
      const v = document.documentElement.style;
      for (const [k, val] of Object.entries({
        '--panel': ground,
        '--bg': ground,
        '--fg': at(72, Math.min(C * 0.25, 5)),
        '--dim': at(42, Math.min(C * 0.25, 4)),
        '--hot': at(42, 32, 28),
        '--link': at(46, 26, C > 3 ? h + 170 : 250),
        // A pressed toggle reads as filled by being a step away from the ground,
        // not by being colored: an accent-hue fill was a slab of light blue in the
        // middle of the panel. The accent stays on its border, which is enough.
        '--sel': at(15, Math.min(C * 0.3, 4)),
        '--hud': at(50, Math.min(C * 0.25, 4)),
        '--line': light ? '#0000002e' : '#ffffff26',
        '--ctl': light ? '#00000012' : '#ffffff12',
      }))
        v.setProperty(k, val);
      slices.forEach((s) => s.edge.material.color.set(light ? 0x3a3a42 : 0xc6c6d0));
      boxLines.material.color.set(light ? 0x3a3a42 : 0xc6c6d0);
      drawPlots();
    }

    function frame() {
      controls.update();
      updateBox(); // the near corner moves as you orbit
      const h = canvas.clientHeight;
      for (const q of QUADS) {
        if (!q.rect) continue; // hidden, so nothing to scissor
        const { x, y, w: qw, h: qh } = q.rect;
        renderer.setViewport(x, h - y - qh, qw, qh); // WebGL counts y from the bottom
        renderer.setScissor(x, h - y - qh, qw, qh);
        renderer.clear();
        renderer.render(scene, q.cam);
      }
      requestAnimationFrame(frame);
    }

    // ─── sidebar ─────────────────────────────────────────────────────────────────
    const strip = $('strip'),
      sctx = strip.getContext('2d');

    function sidebar() {
      $('gl').setAttribute(
        'aria-label',
        `palette view: ${S.pts.length} control points, ${S.mode}, ${SPACES[params.space].name}`,
      );
      const pal = palette(),
        W = strip.width,
        H = strip.height;
      // one representation per mode: a ramp is not a set of swatches and a set of
      // swatches is not a ramp. Index 0 sits at the bottom either way, colorbar side up.
      const ramp = S.mode === 'continuous' && S.pts.length >= 2;
      strip.style.display = ramp ? '' : 'none';
      $('swatches').style.display = ramp ? 'none' : '';
      // A discrete set has no ramp to profile, so the plots go away rather than
      // sitting there inert.
      const cont = S.mode === 'continuous';
      lplotEl.style.display = cont ? '' : 'none';
      // the bar and the preview stop above the plots only while there are plots
      if (plotsShown !== cont) {
        plotsShown = cont;
        layout();
      }
      if (cont) layoutPlot();
      if (ramp) {
        sctx.clearRect(0, 0, W, H);
        // uniform in ARC LENGTH — the additive quantity. See color-space.ts.
        rampOf(H).forEach((p, i) => {
          sctx.fillStyle = shownCss(p);
          sctx.fillRect(0, H - 1 - i, W, 1);
        });
      } else {
        // buttons: a click selects the node, so the keyboard can too. The name is
        // what a sighted user reads off the color, plus the nearest named color.
        $('swatches').innerHTML = pal
          .map((p, i) => {
            const sel = S.sel?.kind === 'pt' && S.sel.i === i,
              bad = !inGamut(p);
            return `<button class="sw" data-i="${i}" data-sel="${sel}" aria-pressed="${sel}" data-bad="${bad}"
        style="background:${shownCss(p)}" title="${toHex(p)}"
        aria-label="swatch ${i + 1}, ${toHex(p)}, ${colorName(p)}${bad ? ', out of gamut' : ''}"></button>`;
          })
          .join('');
      }
      if (TIP_FLOATS) placeTip(); // the swatch columns may have changed width

      // worst swatch against the contrast ground, live next to the two knobs that
      // set it. Discrete only, with the term: a ramp is read as a surface and needs
      // its dark end, so there is nothing here for a continuous palette to answer.
      $('contrastrow').style.display = S.mode === 'discrete' ? '' : 'none';
      if (S.mode === 'discrete') {
        const bg = fromHex(S.cbg);
        const set = pal;
        const lo = set.length ? Math.min(...set.map((p) => contrastRatio(p, bg))) : null;
        // the same worst case in APCA, which is the reading the ratio is meant to
        // be replaced by. |Lc|, since the sign only says which color is on top.
        const lc = set.length ? Math.min(...set.map((p) => Math.abs(apcaLc(p, bg)))) : null;
        $('cnow').textContent = lo === null ? '–' : `${lo.toFixed(2)}:1`;
        $('cnow').style.color = lo !== null && lo < S.cmin ? 'var(--hot)' : '';
        $('lcnow').textContent = lc === null ? '' : `Lc ${Math.round(lc)}`;
        $('lcnow').style.color = lc !== null && lc < 60 ? 'var(--hot)' : '';
      }

      // closest pair in lightness alone: what a grayscale print leaves you with
      $('lseprow').style.display = S.mode === 'discrete' ? '' : 'none';
      if (S.mode === 'discrete') {
        let gap = Infinity;
        for (let i = 0; i < pal.length; i++)
          for (let j = i + 1; j < pal.length; j++)
            gap = Math.min(gap, Math.abs(pal[i][0] - pal[j][0]));
        const ok = Number.isFinite(gap);
        $('lsepv').textContent = LSEP.toFixed(1);
        // no red: this is even spacing to aim at, not a rule being broken, and
        // how close you get is a trade against chroma that only you can price
        $('lnow').textContent = ok ? gap.toFixed(1) : '–';
      }

      const rows = [];
      if (S.obs.length) {
        const probe = S.mode === 'continuous' && S.pts.length >= 2 ? curve() : pal;
        const hit = probe.reduce((a, p) => a + obstaclePenalty(p, S.obs, M(), primary()), 0);
        rows.push(['obstacle cost', hit.toFixed(0), hit > 0]);
      }
      const cx = ctxOf(S.pts);
      for (const o of OBJ) {
        if (o.mode && o.mode !== S.mode) continue;
        const v = o.f(cx);
        rows.push([
          typeof o.label === 'function' ? o.label() : o.label,
          v < 10 ? v.toFixed(2) : v.toFixed(0),
          !!o.bad && v > WARN_EPS,
          o.key,
          HELP[o.key],
          stepShare?.[o.key],
        ]);
      }
      paintMetrics(rows);

      const s = S.sel;
      $('selpanel').style.display = s ? '' : 'none';
      const target =
        s?.kind === 'pt' ? S.pts[s.i] : s?.kind?.startsWith('obs') ? S.obs[s.i]?.c : null;
      // leave the field alone while it has focus, or it fights whoever is typing
      if (target && document.activeElement !== $('hex'))
        $('hex').value = COLORFMT[S.cfmt].to(target);
      $('hex').closest('.row').style.display = target ? '' : 'none';
      $('selpreview').style.display = s ? '' : 'none';
      // a plane has no color, but it still has something to say
      $('selcolor').style.display = target ? '' : 'none';
      // the true value, not the value through the active view: this is a picker
      // now, and it has to open on the color you would be editing
      if (target && document.activeElement !== $('selcolor')) $('selcolor').value = toHex(target);
      // the picker holds the true color; this is the same color through the view
      const simulated = S.cvd !== 'none' || S.gray;
      $('selsim').hidden = !(target && simulated);
      if (target && simulated) {
        $('selsim').style.background = shownCss(target);
        $('selsim').setAttribute(
          'aria-label',
          `as ${S.gray ? 'grayscale' : observer()} sees it: ${shownCss(target)}`,
        );
      }
      $('flip').closest('.row').style.display =
        s?.kind === 'plane' || s?.kind === 'planerot' ? '' : 'none';
      if (s?.kind === 'pt' && S.pts[s.i]) {
        const [L, C, h] = toLCh(S.pts[s.i]);
        $('selinfo').innerHTML =
          `L ${L.toFixed(1)} C ${C.toFixed(1)} h ${((h + 360) % 360).toFixed(0)}°` +
          ` <span class="d" title="nearest CSS color name">${colorName(S.pts[s.i])}</span>`;
      } else if ((s?.kind === 'plane' || s?.kind === 'planerot') && S.planes[s.i]) {
        const pl = S.planes[s.i],
          ax = SPACES[params.space].axes;
        const terms = pl.n
          .map((c, j) =>
            Math.abs(c) < 0.01 ? '' : `${c > 0 ? '+' : '−'}${Math.abs(c).toFixed(2)}·${ax[j]}`,
          )
          .filter(Boolean)
          .join(' ')
          .replace(/^\+/, '');
        $('selinfo').textContent = `plane ${s.i} · keep ${terms} ≤ ${pl.d.toFixed(1)}`;
      } else if ((s?.kind === 'obs' || s?.kind === 'obsr') && S.obs[s.i]) {
        const o = S.obs[s.i];
        $('selinfo').innerHTML =
          `r ${o.r.toFixed(1)} perceived, ${unperceive(o.r).toFixed(1)} in chart units`;
      }

      paintPlotButtons();
      drawPlots();
      drawWheel();
      drawTest();
      pushState();
    }

    // ─── test image preview ──────────────────────────────────────────────────────
    // Metrics do not see banding. A colormap can score well on every term in the
    // panel and still put a ridge where the data is flat, or lose a feature where
    // its contrast dips — both of which are obvious the moment you map something
    // through it. Everything here goes through the same view as the rest of the
    // page, so the color-vision and grayscale settings apply to the test too.
    const tipc = $('tipcanvas'),
      tctx = tipc.getContext('2d');
    /** a test belongs to one mode, or, with no mode of its own, to both */
    const fitsMode = (t) => !!t && (!t.mode || t.mode === S.mode);

    /**
     * A height field with coastlines: five octaves of value noise on a fixed seed,
     * so it is the same terrain every time and two colormaps can be compared on it.
     *
     * Elevation is the case these maps were drawn for and the one where a bad ramp
     * invents landscape — a false ridge where the map has an edge, a plateau where
     * it flattens. In discrete mode the same field comes out classified into one
     * band per swatch, which is the other half of how geographic data gets drawn.
     */
    const TERRAIN = (() => {
      const smooth = (t) => t * t * (3 - 2 * t);
      const oct = [2, 4, 8, 16, 32].map((g, o) => {
        const r = rnd(1237 + o * 977);
        return { g, h: Array.from({ length: (g + 1) * (g + 1) }, () => r()) };
      });
      return (x, y) => {
        let v = 0,
          amp = 1,
          norm = 0;
        for (const { g, h } of oct) {
          const gx = x * g,
            gy = y * g;
          const i = Math.min(g - 1, Math.floor(gx)),
            j = Math.min(g - 1, Math.floor(gy));
          const fx = smooth(gx - i),
            fy = smooth(gy - j),
            at = (a, b) => h[b * (g + 1) + a];
          v +=
            amp *
            ((at(i, j) * (1 - fx) + at(i + 1, j) * fx) * (1 - fy) +
              (at(i, j + 1) * (1 - fx) + at(i + 1, j + 1) * fx) * fy);
          norm += amp;
          amp *= 0.55;
        }
        return v / norm;
      };
    })();

    /** what a mode falls back to when the current pick does not belong to it */
    const TIP_DEFAULT = { continuous: 'sineramp', discrete: 'lines' };

    const TESTS = {
      sineramp: {
        mode: 'continuous',
        label: 'ramp', // 'sineramp' overran the button when small
        note:
          'Kovesi\u2019s sineramp: a constant-amplitude sine riding a linear ramp, fading out downward. ' +
          'Where the map loses contrast the wave disappears early; where it has a false edge the flat ramp shows a band.',
        f: (x, y) => x + 0.05 * Math.sin(x * 32 * Math.PI) * (1 - y),
      },
      field: {
        mode: 'continuous',
        label: 'field',
        note: 'A smooth scalar field. Any ring, ridge or bright seam you can see is the colormap talking, not the data.',
        f: (x, y) => {
          const g = (cx, cy, s) => Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * s * s));
          return (
            0.95 * g(0.26, 0.62, 0.2) + 0.75 * g(0.68, 0.36, 0.26) + 0.45 * g(0.46, 0.84, 0.14)
          );
        },
      },
      lines: {
        mode: 'discrete',
        label: 'lines',
        note: 'One series per class, crossing and overlapping, over a light and a dark ground. Line work is thin, so a pair that reads as distinct in a swatch row can still merge here.',
      },
      scatter: {
        mode: 'discrete',
        label: 'scatter',
        note: 'Every class on a light and a dark ground. A swatch that vanishes against either, or that you cannot tell from its neighbor, fails here and not in the metrics.',
      },
      geo: {
        label: 'geo',
        note:
          'A choropleth: one value per region, over synthetic counties on a synthetic coast. Regions ' +
          'are read against their neighbours rather than against a scale, so a map fails here by ' +
          'making two adjacent classes look like one. In discrete mode each swatch is a class.',
      },
    };

    /**
     * Each run resampled to its share of n samples. The share is proportional to
     * arc length, so a short run does not get the same share of the bar as a long
     * one, and every run gets at least a pixel of it.
     */
    function resampleRuns(cs, n, g) {
      const len = cs.map((c) => arcLength(c, g)),
        total = len.reduce((a, b) => a + b, 0) || 1;
      const runs = cs.map((c, k) => resample(c, Math.max(2, Math.round((n * len[k]) / total)), g));
      return { runs, len, total };
    }
    /** the palette as bytes, through the active view — CVD and grayscale included */
    function rampOf(n) {
      if (S.mode !== 'continuous' || S.pts.length < 2) return palette();
      const cs = curves().filter((c) => c.length >= 2);
      if (!cs.length) return palette();
      return resampleRuns(cs, n, M()).runs.flat();
    }
    const lutOf = (n) =>
      rampOf(n).map((p) => rgb(S.gray ? [p[0], 0, 0] : p).map((c) => Math.round(255 * c)));

    function drawTest() {
      if (!S.tip) return; // hidden: no box to draw into, and nothing to show
      // the cell it sits in is a wide strip on desktop and a tall quarter of the
      // cut row on a phone, so the image is drawn at whatever shape it is given
      const W = Math.max(1, Math.round(tipc.clientWidth)),
        H = Math.max(1, Math.round(tipc.clientHeight));
      if (tipc.width !== W || tipc.height !== H) {
        tipc.width = W;
        tipc.height = H;
      }
      const kind = fitsMode(TESTS[S.tipKind]) ? S.tipKind : TIP_DEFAULT[S.mode];
      // same reason as the metrics table: redrawing at solver rate would replace
      // these between mousedown and mouseup, so only touch what actually changed
      for (const [k, t] of Object.entries(TESTS)) {
        let b = $('tipbtns').querySelector(`[data-tip="${k}"]`);
        const want = fitsMode(t);
        if (want && !b) {
          $('tipbtns').insertAdjacentHTML(
            'beforeend',
            `<button data-tip="${k}" title="${t.note}">${t.label}</button>`,
          );
          b = $('tipbtns').lastElementChild;
        } else if (!want && b) {
          b.remove();
          continue;
        }
        if (b) b.ariaPressed = String(k === kind);
      }
      const lut = lutOf(256);
      tctx.clearRect(0, 0, W, H);
      if (!lut.length) return;
      if (kind === 'geo') return drawGeo(W, H, lut);
      if (kind === 'scatter') return drawScatter(W, H, lut);
      if (kind === 'lines') return drawLines(W, H, lut);

      // normalize whatever the field returns, so a test only has to be smooth
      const f = TESTS[kind].f,
        v = new Float64Array(W * H);
      let mn = Infinity,
        mx = -Infinity;
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++) {
          const t = f(x / (W - 1), y / (H - 1));
          v[y * W + x] = t;
          if (t < mn) mn = t;
          if (t > mx) mx = t;
        }
      const span = mx - mn || 1,
        img = tctx.createImageData(W, H);
      for (let i = 0; i < W * H; i++) {
        const c = lut[Math.round(((v[i] - mn) / span) * (lut.length - 1))];
        img.data[i * 4] = c[0];
        img.data[i * 4 + 1] = c[1];
        img.data[i * 4 + 2] = c[2];
        img.data[i * 4 + 3] = 255;
      }
      tctx.putImageData(img, 0, 0);
    }

    /**
     * Smooth crossing series rather than a random walk: noise would make them hard
     * to follow for reasons that are nothing to do with the colors. Each class
     * gets its own phase, frequency and tilt, so they overlap the way real series
     * do — which is where thin strokes of two similar hues stop being two.
     */
    function drawLines(W, H, lut) {
      const half = Math.round(W / 2);
      tctx.fillStyle = '#ececec';
      tctx.fillRect(0, 0, half, H);
      tctx.fillStyle = '#101014';
      tctx.fillRect(half, 0, W - half, H);
      tctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const y = Math.round((i * H) / 4) + 0.5;
        tctx.strokeStyle = '#00000014';
        tctx.beginPath();
        tctx.moveTo(0, y);
        tctx.lineTo(half, y);
        tctx.stroke();
        tctx.strokeStyle = '#ffffff1c';
        tctx.beginPath();
        tctx.moveTo(half, y);
        tctx.lineTo(W, y);
        tctx.stroke();
      }
      tctx.lineJoin = 'round';
      tctx.lineCap = 'round';
      tctx.lineWidth = 2;
      lut.forEach((c, i) => {
        const r = rnd(i * 2749 + 91);
        const ph = r() * 7,
          fr = 1.1 + 2.2 * r(),
          tilt = (r() - 0.5) * 0.9,
          ph2 = r() * 7;
        tctx.strokeStyle = `rgb(${c.join(' ')})`;
        tctx.beginPath();
        for (let x = 0; x <= W; x += 3) {
          const t = x / W;
          const v = Math.min(
            0.94,
            Math.max(
              0.06,
              0.5 +
                tilt * (t - 0.5) +
                0.2 * Math.sin(ph + fr * t * 6.2832) +
                0.08 * Math.sin(ph2 + fr * 2.3 * t * 6.2832),
            ),
          );
          const y = H - 7 - v * (H - 14);
          x === 0 ? tctx.moveTo(x, y) : tctx.lineTo(x, y);
        }
        tctx.stroke();
      });
    }

    /**
     * Synthetic counties: a Voronoi tessellation of a jittered grid of seeds, over
     * a coastline taken from the same noise field.
     *
     * Real boundaries were not worth the download. What a choropleth tests is
     * whether neighbouring regions stay distinguishable when nothing separates
     * them but a hairline, and that needs irregular contiguous polygons carrying
     * spatially correlated values, which this has. It does not need to be Iowa.
     *
     * The assignment only depends on the canvas size, so it is cached: recomputing
     * a nearest-seed lookup for every pixel on every redraw would cost more than
     * everything else the panel does put together.
     */
    let GEO = null;
    function geoCells(W, H) {
      if (GEO && GEO.W === W && GEO.H === H) return GEO;
      const COLS = 9,
        ROWS = Math.max(3, Math.round((COLS * H) / W));
      const r = rnd(90210);
      const seeds = [];
      for (let j = 0; j < ROWS; j++)
        for (let i = 0; i < COLS; i++)
          seeds.push([((i + 0.15 + 0.7 * r()) / COLS) * W, ((j + 0.15 + 0.7 * r()) / ROWS) * H]);
      const cell = new Int16Array(W * H),
        land = new Uint8Array(W * H);
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++) {
          let best = 0,
            near = Infinity;
          // only the seeds in the neighbouring grid blocks can win, which turns the
          // scan from every seed per pixel into about nine
          const ci = Math.floor((x / W) * COLS),
            cj = Math.floor((y / H) * ROWS);
          for (let dj = -1; dj <= 1; dj++)
            for (let di = -1; di <= 1; di++) {
              const a = ci + di,
                b = cj + dj;
              if (a < 0 || b < 0 || a >= COLS || b >= ROWS) continue;
              const k = b * COLS + a,
                d = (seeds[k][0] - x) ** 2 + (seeds[k][1] - y) ** 2;
              if (d < near) {
                near = d;
                best = k;
              }
            }
          cell[y * W + x] = best;
          land[y * W + x] = TERRAIN(x / W, y / H) > 0.42 ? 1 : 0; // the coast
        }
      // one value per region, sampled at its seed, so neighbours correlate the way
      // anything mapped onto geography does
      const val = seeds.map(([x, y]) => TERRAIN(x / W, y / H));
      const lo = Math.min(...val),
        hi = Math.max(...val);
      GEO = { W, H, cell, land, val: val.map((v) => (v - lo) / (hi - lo || 1)) };
      return GEO;
    }

    function drawGeo(W, H, lut) {
      const g = geoCells(W, H),
        img = tctx.createImageData(W, H);
      const sea = [0xe9, 0xe9, 0xe9];
      for (let i = 0; i < W * H; i++) {
        const c = g.land[i] ? lut[Math.round(g.val[g.cell[i]] * (lut.length - 1))] : sea;
        img.data[i * 4] = c[0];
        img.data[i * 4 + 1] = c[1];
        img.data[i * 4 + 2] = c[2];
        img.data[i * 4 + 3] = 255;
      }
      // hairline borders, found by looking right and down for a change of region.
      // Without them two neighbours of the same class merge into one shape, and
      // whether that is legible is the thing being tested.
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (!g.land[i]) continue;
          if (!(
            (x + 1 < W && (g.cell[i + 1] !== g.cell[i] || !g.land[i + 1])) ||
            (y + 1 < H && (g.cell[i + W] !== g.cell[i] || !g.land[i + W]))
          ))
            continue;
          for (let k = 0; k < 3; k++) img.data[i * 4 + k] = Math.round(img.data[i * 4 + k] * 0.45);
        }
      tctx.putImageData(img, 0, 0);
    }

    /**
     * Split ground, because a categorical color has to survive both. The split runs
     * ACROSS the classes rather than between them: a left/right split put each
     * class wholly on one side, so half the palette was only ever seen on white and
     * the other half only on black — which is the one thing this test exists to
     * catch. Every cluster now straddles the line, alternating sides point by point
     * so each class puts the same count on each ground.
     */
    function drawScatter(W, H, lut) {
      const mid = Math.round(H / 2);
      tctx.fillStyle = '#f2f2f2';
      tctx.fillRect(0, 0, W, mid);
      tctx.fillStyle = '#101014';
      tctx.fillRect(0, mid, W, H - mid);
      lut.forEach((c, i) => {
        const r = rnd(i * 7919 + 13);
        tctx.fillStyle = `rgb(${c.join(' ')})`;
        const cx = ((i + 0.5) / lut.length) * W;
        for (let k = 0; k < 26; k++) {
          const x = cx + (r() - 0.5) * (W / lut.length) * 1.5;
          const y = mid + (k % 2 ? 1 : -1) * (0.03 + 0.43 * r()) * H;
          tctx.beginPath();
          tctx.arc(x, y, 2.6, 0, 7);
          tctx.fill();
        }
      });
    }

    $('tipbtns').onclick = (e) => {
      const k = e.target.dataset.tip;
      if (k) {
        S.tipKind = k;
        drawTest();
      }
    };

    // ─── export ──────────────────────────────────────────────────────────────────
    const download = (name, text, type) => {
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([text], { type })),
        download: name,
      });
      a.click();
      URL.revokeObjectURL(a.href);
    };

    /** a filename stem and a Python identifier, from whatever is in the name box */
    const stem = () => ($('scenename').value.trim() || 'precept').replace(/[^\w-]+/g, '-');
    const ident = () =>
      stem()
        .replace(/\W/g, '_')
        .replace(/^(?=\d)/, 'cmap_');

    /** A continuous map is emitted as 256 samples spaced by ARC LENGTH, not as its
     *  control points: every target below interpolates evenly in t, so handing over
     *  the control points would reintroduce exactly the non-uniformity the
     *  resampling exists to remove. toHex maps into sRGB whatever the working gamut
     *  is, because that is what every one of these consumers will display. */
    const expCont = () => S.mode === 'continuous' && S.pts.length >= 2;
    const expCols = () => (expCont() ? rampOf(256) : palette());

    /** provenance, as plain lines; each format wraps them in its own comment syntax */
    function headText(cols, link) {
      const outside = cols.filter((p) => !inGamut(p)).length;
      return [
        `${stem()} — generated by precept`,
        ...(link ? [`edit at ${link}`] : []),
        `${SPACES[params.space].name} · ${GAMUTS[params.gamut].name} gamut` +
          `${S.cvd === 'none' ? '' : ` · optimized under ${S.cvd} at severity ${S.sev}`}`,
        `${S.pts.length} control point(s)${expCont() ? ', resampled to 256 by arc length' : ''}`,
        ...(params.gamut === 'srgb' ? [] : ['NOTE: clipped to sRGB on the way out.']),
        ...(outside
          ? [
              `NOTE: ${outside}/${cols.length} sample(s) fell outside the ` +
                `${GAMUTS[params.gamut].name} gamut and were mapped into it.`,
            ]
          : []),
      ];
    }
    const rgb255 = (p) => toSRGB(toGamut(p, 'srgb')).map((c) => Math.round(255 * clamp01(c)));
    /** evenly spaced stops for the formats that interpolate rather than tabulate */
    const stops = (cols, n) =>
      Array.from({ length: n }, (_, i) => cols[Math.round((i * (cols.length - 1)) / (n - 1))]);

    function mplCode(cols, link) {
      const lines = [];
      for (let i = 0; i < cols.length; i += 6)
        lines.push(
          '    ' +
            cols
              .slice(i, i + 6)
              .map((p) => `'${toHex(p)}'`)
              .join(', ') +
            ',',
        );
      const cont = expCont();
      return [
        ...headText(cols, link).map((l) => `# ${l}`),
        'from matplotlib import colormaps',
        `from matplotlib.colors import ${cont ? 'LinearSegmentedColormap' : 'ListedColormap'}`,
        '',
        cont
          ? `${ident()} = LinearSegmentedColormap.from_list('${stem()}', [`
          : `${ident()} = ListedColormap([`,
        ...lines,
        cont ? '])' : `], name='${stem()}')`,
        `colormaps.register(${ident()})`,
      ].join('\n');
    }

    function cssCode(cols, link) {
      const head = [`/* ${headText(cols, link).join('\n   ')} */`];
      if (!expCont())
        return [
          ...head,
          ':root {',
          ...cols.map((p, i) => `  --${stem()}-${i}: ${toHex(p)};`),
          '}',
        ].join('\n');
      const n = 33,
        st = stops(cols, n);
      return [
        ...head,
        ':root {',
        `  --${stem()}: linear-gradient(to right,`,
        ...st.map(
          (p, i) => `    ${toHex(p)} ${((100 * i) / (n - 1)).toFixed(2)}%${i < n - 1 ? ',' : ''}`,
        ),
        '  );',
        '}',
      ].join('\n');
    }

    function csvCode(cols, link) {
      return [
        ...headText(cols, link).map((l) => `# ${l}`),
        'i,t,hex,r,g,b,L,C,h',
        ...cols.map((p, i) => {
          const [r, g, b] = rgb255(p),
            [L, C, h] = toLCh(p);
          const t = cols.length > 1 ? i / (cols.length - 1) : 0;
          return [
            i,
            t.toFixed(6),
            toHex(p),
            r,
            g,
            b,
            L.toFixed(3),
            C.toFixed(3),
            norm360(h).toFixed(2),
          ].join(',');
        }),
      ].join('\n');
    }

    /** ParaView / VTK. Continuous maps get 33 control points and let ParaView
     *  interpolate; a categorical set is indexedLookup, one entry per class. */
    function pvCode(cols, link) {
      const cont = expCont(),
        pts = cont ? stops(cols, 33) : cols;
      return [
        '<ColorMaps>',
        `  <!-- ${headText(cols, link).join(' | ')} -->`,
        `  <ColorMap name="${stem()}" space="RGB"${cont ? '' : ' indexedLookup="true"'}>`,
        ...pts.map((p, i) => {
          const [r, g, b] = toSRGB(toGamut(p, 'srgb')).map((c) => clamp01(c).toFixed(6));
          const x = cont ? (i / (pts.length - 1)).toFixed(6) : String(i);
          return `    <Point x="${x}" o="1" r="${r}" g="${g}" b="${b}"/>`;
        }),
        '  </ColorMap>',
        '</ColorMaps>',
      ].join('\n');
    }

    const jsonCode = (cols, link) =>
      JSON.stringify(
        {
          name: stem(),
          mode: S.mode,
          space: params.space,
          gamut: params.gamut,
          notes: headText(cols, link),
          colors: cols.map(toHex),
          control_points: S.pts,
        },
        null,
        1,
      );

    const FORMATS = {
      matplotlib: {
        ext: 'py',
        mime: 'text/x-python',
        gen: mplCode,
        empty: '# nothing to export — add some points',
      },
      css: { ext: 'css', mime: 'text/css', gen: cssCode, empty: '/* nothing to export */' },
      csv: { ext: 'csv', mime: 'text/csv', gen: csvCode, empty: '# nothing to export' },
      paraview: {
        ext: 'xml',
        mime: 'application/xml',
        gen: pvCode,
        empty: '<!-- nothing to export -->',
      },
      json: { ext: 'json', mime: 'application/json', gen: jsonCode, empty: '{}' },
    };
    /** the export in format f; the link is packed first so the header can quote it */
    async function exportText(f) {
      const cols = expCols();
      if (!cols.length) return f.empty;
      return f.gen(cols, await packLink());
    }

    /**
     * A scene is everything that is not view state: the points, the obstacles and
     * planes, the bounds and profiles, the weights, and which chart they all mean
     * something in. The selection is deliberately dropped — it is an index into
     * arrays the file also carries, and restoring it buys nothing.
     */
    const sceneJSON = () =>
      JSON.stringify(
        {
          precept: 1,
          space: params.space,
          gamut: params.gamut,
          // a profile is not one of the built-ins, so it has to travel with the scene
          icc: params.gamut.startsWith('icc-') ? GAMUTS[params.gamut] : undefined,
          ...S,
          sel: undefined,
          marks: undefined,
        },
        null,
        1,
      );

    const vec3 = (a) => Array.isArray(a) && a.length === 3 && a.every(Number.isFinite);
    // null counts as bad: JSON has no Infinity or NaN, so stringify emits null for
    // them, and a null landing where a number belongs is the same failure with a
    // friendlier disguise. Nothing precept writes is legitimately null.
    const deepFinite = (v) =>
      Array.isArray(v)
        ? v.every(deepFinite)
        : v && typeof v === 'object'
          ? Object.values(v).every(deepFinite)
          : v !== null && (typeof v !== 'number' || Number.isFinite(v));
    /** the accepted values for a button group, read off the buttons themselves */
    const menu = (id) => [...$(id).children].map((b) => b.dataset.v);

    /**
     * A scene file is untrusted input. A NaN or an unrecognized enum reaching the
     * renderer is fatal with no way back short of a reload — an unknown CVD name
     * indexes the CVD table to undefined and the next matrix build throws inside
     * the frame loop. So check before assigning, not after.
     */
    function loadScene(text) {
      const o = JSON.parse(text);
      if (o.precept !== 1) throw new Error('not a precept scene file');
      if (o.icc?.p?.length === 3 && o.icc.w) {
        GAMUTS[o.gamut] = o.icc;
        paintGamutList();
      }
      if (!SPACES[o.space] || !GAMUTS[o.gamut]) throw new Error('unknown space or gamut');
      if (!Array.isArray(o.pts) || !o.pts.every(vec3)) throw new Error('bad control points');
      if (!o.obs?.every((x) => vec3(x.c) && Number.isFinite(x.r))) throw new Error('bad obstacles');
      if (!o.planes?.every((x) => vec3(x.n) && Number.isFinite(x.d))) throw new Error('bad planes');
      if (!deepFinite(o)) throw new Error('scene contains a non-finite number');
      for (const [k, ok] of [
        ['cvd', Object.keys(CVD_ID)],
        ['mode', menu('mode')],
        ['tool', menu('tool')],
      ])
        if (k in o && !ok.includes(o[k])) throw new Error(`bad ${k}: ${o[k]}`);
      // Validation can only reject what it thought to check, and anything it misses
      // throws halfway through the assignment below — leaving a half-loaded scene
      // with no way back. So make the load atomic instead of trusting the checks:
      // keep the current scene, and put it back if applying the new one throws.
      const undo = JSON.parse(sceneJSON());
      try {
        applyScene(o);
      } catch (err) {
        applyScene(undo);
        throw err;
      }
    }

    function applyScene(o) {
      params.space = o.space;
      params.gamut = o.gamut;
      for (const k of Object.keys(S)) if (k in o) S[k] = o[k];
      if (!('pin' in o)) S.pin = []; // a scene written before pins existed
      // The two term maps are keyed by objective, and which objectives exist changes
      // between versions. Restoring them wholesale lets a scene written before a
      // term leave that term at undefined, which reads as off and cannot be
      // switched on. Keep the keys OBJ defines and take the file's value only
      // where it has one.
      S.w = Object.fromEntries(OBJ.map((t) => [t.key, o.w?.[t.key] ?? W_DEFAULT[t.key] ?? 1]));
      S.on = Object.fromEntries(OBJ.map((t) => [t.key, o.on?.[t.key] ?? !OPT_IN.includes(t.key)]));
      // a stored profile keeps to the axis, as an edited one does
      S.lprof = S.lprof.map(PLOTS.L.clamp);
      S.hprof = S.hprof.map(PLOTS.H.clamp);
      S.sel = null;
      refitSpace(); // a new chart moves everything
      mirror();
      // a full sync: the sidebar has to describe the scene just applied, and a
      // light one leaves it showing the previous palette's numbers and swatches
      // until something else repaints it
      sync({ colors: true });
    }

    /**
     * The scene in the URL. Deflated before base64 because the JSON is a couple of
     * kilobytes of mostly punctuation and repeated keys; base64url so the result
     * survives being pasted anywhere a link goes.
     */
    const b64url = (buf) =>
      btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    const unb64url = (t) =>
      Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
    const pipe = (data, stream) => new Response(new Blob([data]).stream().pipeThrough(stream));

    /** pack into the address bar; copying it is the button's job, not this one's */
    async function packLink() {
      const packed = b64url(
        await pipe(sceneJSON(), new CompressionStream('deflate-raw')).arrayBuffer(),
      );
      history.replaceState(null, '', `#s=${packed}`);
      return location.href;
    }

    /** a scene in the hash wins over the default palette, so a link opens on it */
    async function loadFromHash() {
      const m = /^#s=(.+)$/.exec(location.hash);
      if (!m) return false;
      try {
        loadScene(await pipe(unb64url(m[1]), new DecompressionStream('deflate-raw')).text());
        return true;
      } catch (err) {
        console.warn('ignoring unreadable scene in the URL:', err.message);
        return false;
      }
    }

    /**
     * A profile becomes a gamut like any other. The key is fresh each time because
     * the RGB<->XYZ matrices are memoized by it, so reusing one would serve the
     * previous profile's matrix for the new profile's primaries.
     */
    let iccN = 0;
    $('iccbtn').onclick = () => $('iccfile').click();
    $('iccfile').onchange = async (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      try {
        const g = gamutFromICC(await f.arrayBuffer(), f.name.replace(/\.[^.]+$/, ''));
        const key = `icc-${++iccN}`;
        GAMUTS[key] = g;
        params.gamut = key;
        paintGamutList();
        refitSpace();
        S.slice = [...FRAME.mid];
        sync({ colors: true });
      } catch (err) {
        alert(`could not read that profile: ${err.message}`);
      }
    };

    $('huereset').onclick = () => {
      S.hue = [0, 360];
      boundsChanged();
    };

    $('sharelink').onclick = async (e) => {
