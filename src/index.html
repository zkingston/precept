      const url = await packLink();
      await copyText(e.target, url, 'copy link to this palette');
    };

    $('savepy').onclick = async () => {
      const f = FORMATS[S.fmt];
      download(
        `${f.ext === 'py' ? ident() : stem()}.${f.ext}`,
        (await exportText(f)) + '\n',
        f.mime,
      );
    };
    /**
     * Clipboard writes reject for reasons the page cannot see coming — an insecure
     * origin, a window that lost focus, a permission the browser declines — and an
     * async handler swallows that, so the button did nothing and said nothing.
     * Try the API, fall back to the old selection trick, and if both fail say so
     * on the button rather than leaving it looking like it worked.
     */
    async function copyText(btn, text, label) {
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch {
        /* fall through */
      }
      if (!ok) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta);
        ta.select();
        try {
          ok = document.execCommand('copy');
        } catch {
          ok = false;
        }
        ta.remove();
      }
      btn.textContent = ok ? 'copied' : 'copy failed';
      setTimeout(() => (btn.textContent = label), ok ? 900 : 1800);
      return ok;
    }

    $('copypy').onclick = async (e) => copyText(e.target, await exportText(FORMATS[S.fmt]), 'copy');
    $('exportfmt').onchange = (e) => {
      S.fmt = e.target.value;
    };

    // ─── the selection, in whichever notation you think in ───────────────────────
    // LCh and oklch() read the CHART directly and are not gamut-mapped, so they
    // round-trip exactly and will show you an out-of-gamut node as out of gamut.
    // hex and rgb necessarily map into sRGB first, because that is all they can say.
    const nums = (v, n) => {
      const m = v.match(/-?\d*\.?\d+/g);
      return m && m.length >= n ? m.map(Number) : null;
    };
    const COLORFMT = {
      hex: {
        label: 'hex',
        hint: '#440154',
        to: toHex,
        from: (v) =>
          /^#?[0-9a-f]{6}$/i.test(v.trim()) ? fromHex(v.trim().replace(/^#/, '')) : null,
      },
      rgb: {
        label: 'rgb 0–255',
        hint: '68, 1, 84',
        to: (p) => rgb255(p).join(', '),
        from: (v) => {
          const m = nums(v, 3);
          return m ? fromSRGB(m.slice(0, 3).map((x) => x / 255)) : null;
        },
      },
      lch: {
        label: 'OkLCh',
        hint: '26.5 13.1 305',
        to: (p) => {
          const [L, C, h] = toLCh(p);
          return `${L.toFixed(2)} ${C.toFixed(2)} ${norm360(h).toFixed(1)}`;
        },
        from: (v) => {
          const m = nums(v, 3);
          return m ? fromLCh([m[0], m[1], m[2]]) : null;
        },
      },
      oklch: {
        label: 'oklch()',
        hint: 'oklch(26.5% 0.131 305)',
        to: (p) => {
          const [L, C, h] = toLCh(p);
          return `oklch(${L.toFixed(2)}% ${(C / 100).toFixed(4)} ${norm360(h).toFixed(1)})`;
        },
        from: (v) => {
          const m = nums(v, 3);
          return m ? fromLCh([m[0], m[1] * 100, m[2]]) : null;
        },
      },
    };
    $('colorfmt').onchange = (e) => {
      S.cfmt = e.target.value;
      $('hex').placeholder = COLORFMT[S.cfmt].hint;
      sync();
    };

    // ─── objectives and gradient stepping ────────────────────────────────────────
    // The decision variables are always the control points. In continuous mode the
    // objective is a functional of the CURVE they generate, so the gradient flows
    // back through the spline for free — no separate "trajectory" path is needed.

    function markedEdge() {
      if (S.marks.length !== 2) return null;
      const [a, b] = S.marks,
        wa = whereIs(a),
        wb = whereIs(b);
      if (!wa || !wb || wa.c !== wb.c) return null;
      const n = wa.run.nodes.length,
        lo = Math.min(wa.k, wb.k),
        hi = Math.max(wa.k, wb.k);
      if (hi - lo === 1) return 'inner';
      if (wa.run.closed && lo === 0 && hi === n - 1) return 'wrap';
      return null;
    }

    /** what the menu can offer for the marks as they stand */
    function linkActs() {
      if (S.mode === 'discrete') return []; // no curve, so no edges to make or break
      if (S.marks.length !== 2) return S.marks.length ? ['clear marks'] : [];
      if (markedEdge()) return ['disconnect', 'clear marks'];
      const [a, b] = S.marks;
      return degree(a) < 2 && degree(b) < 2 ? ['connect', 'clear marks'] : ['clear marks'];
    }

    /**
     * Join the two marked nodes.
     *
     * Both have to be ends — degree under two — and then there are two cases. Ends
     * of the same run close it into a cycle. Ends of different runs merge them,
     * reversing whichever sides are needed so the two marked nodes finish adjacent.
     */
    function linkMarks() {
      const [a, b] = S.marks;
      if (S.marks.length !== 2 || degree(a) >= 2 || degree(b) >= 2) return;
      const rs = runs(),
        wa = whereIs(a),
        wb = whereIs(b);
      if (wa.c === wb.c) {
        if (wa.run.nodes.length < 3) return; // two points cannot enclose anything
        rs[wa.c].closed = true;
      } else {
        // put a at the tail of its run and b at the head of its own, then concatenate
        const ra = rs[wa.c],
          rb = rs[wb.c];
        if (ra.nodes[ra.nodes.length - 1] !== a) ra.nodes.reverse();
        if (rb.nodes[0] !== b) rb.nodes.reverse();
        ra.nodes = [...ra.nodes, ...rb.nodes];
        rs.splice(wb.c, 1);
      }
      setRuns(rs);
      S.marks = [];
      disturb(); // the problem changed shape under Adam
      fitProfiles();
      sync();
    }

    /** Break the edge between the two marked nodes: open a cycle, or split a run. */
    function unlinkMarks() {
      const edge = markedEdge();
      if (!edge) return;
      const rs = runs(),
        w = whereIs(S.marks[0]);
      if (edge === 'wrap') {
        rs[w.c].closed = false; // a cycle opens at the seam
      } else {
        const nodes = rs[w.c].nodes,
          at = Math.min(w.k, whereIs(S.marks[1]).k);
        if (rs[w.c].closed) {
          // opening a cycle anywhere else means rotating the seam to the new break
          rs[w.c] = { nodes: [...nodes.slice(at + 1), ...nodes.slice(0, at + 1)], closed: false };
        } else {
          rs.splice(
            w.c,
            1,
            { nodes: nodes.slice(0, at + 1), closed: false },
            { nodes: nodes.slice(at + 1), closed: false },
          );
        }
      }
      setRuns(rs);
      S.marks = [];
      disturb();
      fitProfiles();
      sync();
    }

    const lprofRange = () => {
      if (S.pts.length < 2) return [20, 90];
      const Ls = S.pts.map((p) => p[0]);
      return [Math.min(...Ls), Math.max(...Ls)];
    };

    /** target ← a straight line spanning that range, in the direction the ramp runs */
    const lprofLine = () => {
      const [lo, hi] = lprofRange();
      const down = S.pts.length >= 2 && S.pts[0][0] > S.pts[S.pts.length - 1][0];
      const [a, b] = down ? [hi, lo] : [lo, hi];
      S.lprof = Array.from({ length: LK }, (_, i) => a + ((b - a) * i) / (LK - 1));
    };
    /**
     * target ← a tent: both ends at the darker endpoint, the middle at the lighter.
     * This is the shape a DIVERGING map wants — two hues meeting at a light center,
     * so lightness has to rise and fall rather than climb. A straight line cannot
     * express it.
     */
    const lprofArch = () => {
      const [lo, hi] = lprofRange();
      const mid = (LK - 1) / 2;
      S.lprof = Array.from(
        { length: LK },
        (_, i) => lo + (hi - lo) * (1 - Math.abs(i - mid) / mid),
      );
    };

    /**
     * A palette measurement at position t, on the palette's own parameter.
     *
     * Not rampOf: that spaces samples by arc length across every run at once, while
     * the profile terms read the target at t = i/(n-1) over the palette index. With
     * one run the two agree; with a break they do not, and `fit` produced a target
     * the ramp it was fitted to did not sit on. A break is a jump, so t lands on
     * one side of it or the other rather than between.
     */
    function palAt(pal, t, meas, hue) {
      const n = pal.length;
      if (!n) return hue ? 0 : 50;
      if (n === 1) return meas(pal[0]);
      const x = Math.min(1, Math.max(0, t)) * (n - 1),
        i = Math.min(n - 2, Math.floor(x)),
        f = x - i;
      if (S.cut[i]) return meas(pal[f < 0.5 ? i : i + 1]);
      const [a, b] = [meas(pal[i]), meas(pal[i + 1])];
      return hue ? norm360(a + angDiff(b, a) * f) : a * (1 - f) + b * f;
    }

    /** target ← whatever the ramp is doing right now, as a starting point to edit */
    const lprofFit = () => {
      const P = palette();
      if (P.length >= 2)
        S.lprof = Array.from({ length: LK }, (_, k) => palAt(P, k / (LK - 1), (p) => p[0], false));
    };

    const hprofFit = () => {
      const P = palette();
      if (P.length >= 2)
        S.hprof = Array.from({ length: LK }, (_, k) =>
          palAt(P, k / (LK - 1), (p) => norm360(hueOf(p)), true),
        );
    };
    /** size both profiles to the palette, and start each as the ramp it has */
    const fitProfiles = () => {
      syncProfiles();
      lprofFit();
      hprofFit();
    };
    /**
     * A steady turn. The direction has to come from the whole measured run, not
     * from its two ends: magma's ends are 264° and 109°, whose short way is −155°,
     * while the ramp actually turns +205° through zero. Summing the small steps
     * recovers the true turn, and only then is it spread evenly and normalized.
     */
    const hprofSweep = () => {
      hprofFit();
      const turn = totalTurn(S.hprof),
        a = S.hprof[0];
      S.hprof = Array.from({ length: LK }, (_, i) => norm360(a + (turn * i) / (LK - 1)));
    };
    /**
     * Two plateaus meeting in the middle, which is what a diverging map's hue
     * actually does. `long` takes the other arc between them: the short turn less
     * a full circle. Only the midpoint moves, but that is enough, because the
     * polyline joins consecutive knots the short way round, so a midpoint on the
     * far arc drags both halves of the crossing with it.
     */
    const hprofSplit = (long = false) => {
      hprofFit();
      const a = S.hprof[0],
        b = S.hprof[LK - 1],
        mid = (LK - 1) / 2;
      const turn = angDiff(b, a);
      const d = turn - (long ? 360 * Math.sign(turn || 1) : 0); // ends level: go all the way round
      S.hprof = Array.from({ length: LK }, (_, i) =>
        norm360(i < mid ? a : i > mid ? b : a + d / 2),
      );
    };

    /**
     * Rebuild the table only when its SHAPE changes, and otherwise write the
     * numbers into the cells that already exist.
     *
     * A solver run syncs the sidebar about eight times a second, and replacing
     * innerHTML that often destroys a checkbox between mousedown and mouseup and
     * takes the focus out of a weight field mid-number. The shape is the labels and
     * the term keys, so a row appearing, a mode switch or an observer change still
     * rebuilds.
     */
    let metricsShape = null;
    function paintMetrics(rows) {
      const tbl = $('metrics');
      const shape = rows.map(([k, , , obj]) => `${k}|${obj ?? ''}`).join(';');
      if (shape !== metricsShape) {
        metricsShape = shape;
        tbl.innerHTML =
          '<tbody>' +
          rows
            .map(([k, v, warn, obj, help]) => {
              // data-help, not title: the OS tooltip makes you wait a second to find out
              // whether hovering does anything, and the sidebar scrolls, which would clip
              // a positioned one. A line under the table is instant and never clipped.
              // the marker can take focus, so the keyboard reaches the hint, and the
              // checkbox is described by it, so a screen reader reads both together
              const q = help
                ? `<span class="q"${obj ? ` id="q-${obj}"` : ''} role="note" tabindex="0" aria-label="${esc(help)}" data-h="${esc(help)}">?</span>`
                : '';
              return (
                `<tr data-k="${esc(obj ?? k)}"><td>${obj ? `<label class="chk"><input type="checkbox" data-on="${obj}" aria-describedby="q-${obj}"${S.on[obj] ? ' checked' : ''}>${k}</label>` : k}${q}</td>` +
                `<td class="${warn ? 'warn' : ''}"><i class="sh"></i><b class="bang"${warn ? '' : ' hidden'}>!<span class="sr"> nonzero</span></b><span>${v}</span></td>` +
                // the multiplier sits against its own number rather than over the column:
                // one mark per weight says what that weight is, where a heading says it
                // once and then leaves eleven bare numbers to be taken on trust
                (obj
                  ? `<td class="w"><input class="w" type="number" min="0" max="20" step="any" data-w="${obj}"` +
                    ` value="${S.w[obj]}"${S.on[obj] ? '' : ' disabled'} title="relative pull in the combined step"` +
                    `><span class="mx"${S.on[obj] ? '' : ' data-off'}>&times;</span></td>`
                  : '<td class="w"></td>') +
                '</tr>'
              );
            })
            .join('') +
          '</tbody>';
        homePlots(); // the rebuild took any docked plot with it
      }
      // the plot rows are interleaved with these, so index against the term rows
      // alone rather than against every row in the table
      const trs = [...tbl.tBodies[0].rows].filter((r) => !r.classList.contains('plotrow'));
      rows.forEach(([, v, warn, obj, , share], i) => {
        const tr = trs[i],
          cell = tr?.cells[1];
        if (!cell) return;
        if (cell.lastChild.textContent !== String(v)) cell.lastChild.textContent = v;
        paintShare(cell.firstChild, share);
        cell.children[1].hidden = !warn;
        const cls = warn ? 'warn' : '';
        if (cell.className !== cls) cell.className = cls;
        if (!obj) return;
        const box = tr.querySelector('[data-on]');
        if (box && box.checked !== !!S.on[obj]) box.checked = S.on[obj];
        const w = tr.querySelector('input.w');
        if (!w || document.activeElement === w) return; // never overwrite what is being typed
        if (+w.value !== S.w[obj]) w.value = S.w[obj];
        if (w.disabled === !!S.on[obj]) w.disabled = !S.on[obj];
        tr.querySelector('.mx')?.toggleAttribute('data-off', !S.on[obj]);
      });
    }

    /**
     * The bar beside a term's value: its share of the solver's last step. The
     * weights say how hard each term pulls; this says where that pull went, which
     * is what a stalled run needs to show. A step moving against a term paints it
     * red. Hidden until a run has produced a step.
     */
    function paintShare(el, share) {
      const live = share !== undefined;
      el.toggleAttribute('data-live', live);
      if (!live) return;
      el.style.setProperty('--v', (share === null ? 0 : Math.min(1, Math.abs(share))).toFixed(3));
      el.toggleAttribute('data-neg', share < 0);
      el.title =
        share === null
          ? 'no pull in the last step'
          : `${share < 0 ? '−' : '+'}${Math.abs(share).toFixed(2)} of the last step${share < 0 ? ', against it' : ''}`;
    }

    /** one line per term, shown under the table while its ? is hovered */
    const HELP = {
      rep: 'Pushes swatches apart.',
      repcvd: 'Pushes swatches apart under every color vision.',
      arc: 'Length of the ramp.',
      lramp: 'Distance from the lightness profile.',
      chroma: 'Distance from the middle of the chroma band.',
      hprof: 'Distance from the hue profile.',
      feas: 'How far the curve leaves the feasible set.',
      pair: 'Unevenness of the perceived steps along the ramp.',
      contr: 'Swatches below the contrast floor.',
      lsep: 'Pairs too close in lightness for what their hue and chroma tell apart.',
      hsep: 'Pairs closer in hue than the even spacing round the arc.',
      bend: 'Bending of the ramp. A circle is 1, a straight line 0.',
      sym: 'Lightness difference between the two arms.',
      space: 'Unevenness of the control point spacing.',
    };

    /**
     * The nearest CSS named color, for the tooltip and the selection readout.
     *
     * The 148 keywords of CSS Color 4, which is a standard rather than a survey,
     * so the names are the ones a stylesheet will accept. Only the NAMES are
     * written here: each is resolved to bytes by the browser through a canvas
     * fillStyle round trip, so no hex value in this file can be wrong. A keyword
     * the browser does not know leaves fillStyle at the sentinel and is dropped,
     * which is the check on the list itself.
     *
     * Nearest under this app's own metric rather than sRGB distance, so which name
     * you get moves with the space, as every other distance here does.
     *
     * Along the chord, not the geodesic: this is an argmin over 148 fixed anchors,
     * so the ranking is what matters and not the lengths. The geodesic costs 123ms
     * a lookup in CAM02-UCS against 2.8ms, a visible hitch on a click, and it does
     * not move the answer: over a grid of sRGB in every space the two pick a
     * different name on 42 of 16000 colors, 0.26%, and never in the chart, where
     * the chord IS the geodesic.
     *
     * Shown on the selected node and nowhere else, so it costs one lookup per
     * click rather than one per swatch per repaint.
     */
    const CSS_NAMES = `
  aliceblue antiquewhite aqua aquamarine azure beige bisque black blanchedalmond blue blueviolet brown
  burlywood cadetblue chartreuse chocolate coral cornflowerblue cornsilk crimson cyan darkblue darkcyan
  darkgoldenrod darkgray darkgreen darkgrey darkkhaki darkmagenta darkolivegreen darkorange darkorchid
  darkred darksalmon darkseagreen darkslateblue darkslategray darkslategrey darkturquoise darkviolet
  deeppink deepskyblue dimgray dimgrey dodgerblue firebrick floralwhite forestgreen fuchsia gainsboro
  ghostwhite gold goldenrod gray green greenyellow grey honeydew hotpink indianred indigo ivory khaki
  lavender lavenderblush lawngreen lemonchiffon lightblue lightcoral lightcyan lightgoldenrodyellow
  lightgray lightgreen lightgrey lightpink lightsalmon lightseagreen lightskyblue lightslategray
  lightslategrey lightsteelblue lightyellow lime limegreen linen magenta maroon mediumaquamarine mediumblue
  mediumorchid mediumpurple mediumseagreen mediumslateblue mediumspringgreen mediumturquoise
  mediumvioletred midnightblue mintcream mistyrose moccasin navajowhite navy oldlace olive olivedrab orange
  orangered orchid palegoldenrod palegreen paleturquoise palevioletred papayawhip peachpuff peru pink plum
  powderblue purple rebeccapurple red rosybrown royalblue saddlebrown salmon sandybrown seagreen seashell
  sienna silver skyblue slateblue slategray slategrey snow springgreen steelblue tan teal thistle tomato
  turquoise violet wheat white whitesmoke yellow yellowgreen`
      .trim()
      .split(/\s+/);
    let NAMED_COLORS = null;
    const namedColors = () =>
      (NAMED_COLORS ??= (() => {
        const c = document.createElement('canvas').getContext('2d');
        return CSS_NAMES.flatMap((n) => {
          c.fillStyle = '#010203'; // sentinel: an unknown keyword leaves it here
          c.fillStyle = n;
          return c.fillStyle === '#010203' ? [] : [[n, fromHex(c.fillStyle)]];
        });
      })());
    // memoized on the hex, since the swatch column asks for every swatch at each
    // sidebar repaint and the answer only changes with the color or the space
    const NAME_CACHE = new Map();
    const colorName = (p) => {
      const key = `${params.space}|${toHex(p)}`;
      let best = NAME_CACHE.get(key);
      if (best) return best;
      const g = spaceMetric();
      let bd = Infinity;
      for (const [n, q] of namedColors()) {
        const d = lineDelta(p, q, g, 4);
        if (d < bd) {
          bd = d;
          best = n;
        }
      }
      if (NAME_CACHE.size > 1024) NAME_CACHE.clear();
      NAME_CACHE.set(key, best);
      return best;
    };

    /**
     * The page drives the solver; it does not run it. Everything below is messages.
     *
     * The worker keeps its own copy of the state, so a run starts by sending one.
     * While it runs, an edit here — a dragged point, a changed bound, a different
     * space — sends another, which is why sync() ends by pushing state whenever the
     * change did not come from the worker in the first place.
     */
    let solver = null,
      runId = 0;
    let restarts = 0; // the last count the worker reported

    const solverState = () => ({
      S: structuredClone(S),
      params: { ...params },
      // the built-in gamuts are already in the worker's own module; a profile the
      // user loaded exists only here, so it travels
      gamuts: Object.fromEntries(Object.entries(GAMUTS).filter(([k]) => k.startsWith('icc-'))),
      disturbed: takeDisturbed(),
    });

    /** true while applying the worker's points, so sync() does not echo them back */
    let applying = false;

    function fromSolver(pts, done) {
      // A slice posts its points before it reads the messages queued behind it, so
      // an edit made during a run is always followed by exactly one frame computed
      // from the palette as it was. Applying that frame puts S.pts back a node
      // while pin, cut and sel are already the new length — and syncPins, finding
      // the mismatch, drops every pin the palette had. Adding a node under a
      // running solver silently unpinned everything.
      //
      // The count is the whole of the test: a frame of the right shape can only be
      // stale about positions the solver is moving anyway, and the next state
      // message brings the worker back into step.
      if (pts.length !== S.pts.length) return;
      applying = true;
      S.pts = pts;
      // the sidebar re-evaluates every term and repaints the panel, which is too
      // much to do at frame rate; the views stay live and the numbers follow at a
      // third of it
      sync({ light: !done && ++frames % 3 !== 0 });
      applying = false;
    }

    function solverWorker() {
      if (solver) return solver;
      solver = new Worker('./solver-worker.js', { type: 'module' });
      solver.onmessage = ({ data: m }) => {
        // A stop and an immediate restart leaves the ending run's last message in
        // flight. Without the id it lands on the new run: `final` would put the
        // button back to `run optimizer` over a worker that is still stepping, and every
        // `pts` after that is dropped, so the palette freezes with no way back.
        if (m.id !== runId) return;
        if (m.t === 'pts') {
          if (!running) return;
          stepShare = m.share;
          const info = `step ${m.tick}${m.restarts ? ` · ${m.restarts} restart${m.restarts > 1 ? 's' : ''}` : ''}`;
          if ($('runinfo').textContent !== info) $('runinfo').textContent = info;
          if (m.restarts > restarts) announce(`restart ${m.restarts}`);
          restarts = m.restarts;
          fromSolver(m.pts, false);
          return;
        }
        // the last jolt is not the answer: the worker returns whichever attempt
        // scored best, and this is also how a converged run reports that it stopped
        if (m.t === 'final') {
          if (running) announce('Optimizer converged.');
          endRun();
          fromSolver(m.pts, true);
        }
      };
      return solver;
    }

    /** what a screen reader hears about the solver; the button's text changes silently */
    const announce = (text) => {
      $('live').textContent = text;
    };

    function startSolver() {
      if (running) return;
      running = true;
      frames = 0;
      restarts = 0;
      $('runinfo').textContent = 'step 0';
      announce('Optimizer running.');
      $('run').textContent = 'stop';
      $('run').dataset.on = '';
      solverWorker().postMessage({ t: 'start', id: ++runId, ...solverState() });
    }
    /** the button answers now; the worker's last word arrives as `final` */
    function stopSolver() {
      if (!running) return;
      announce('Optimizer stopped.');
      endRun();
      solver.postMessage({ t: 'stop' });
    }
    function endRun() {
      running = false;
      $('run').textContent = 'run optimizer';
      delete $('run').dataset.on;
    }

    // ─── profile plots: what the ramp does, and what you want it to do ──────────
    // The left pad holds the tick labels AND the range bracket, with air between
    // them: the bracket is a control and reads as one by not being crowded against
    // the numbers it is not part of. Labels end around x 18, the bracket sits at
    // 26, the plot starts at 36.
    const LPAD = { l: 36, r: 10, t: 10, b: 15 };

    /**
     * The two profiles, side by side. They were one canvas with a toggle, which
     * made them look like alternatives — but a ramp has a lightness shape AND a
     * hue shape at the same time, and you edit one against the other. The axes are
     * fixed at 0..100 and 0..360, never derived from the data: an axis that fits
     * itself means dragging a knot up grows the range, so the next pixel is worth
     * more than the last and the knot runs away from the cursor.
     */
    const PLOTS = {
      L: {
        key: 'lprof',
        term: 'lramp',
        lo: 0,
        hi: 100,
        ticks: [0, 50, 100],
        hue: false,
        meas: (P) => P.map((p) => p[0]),
        excluded: () =>
          [
            [0, S.lo[0]],
            [S.hi[0], 100],
          ].filter(([a, b]) => b > a),
        fit: lprofFit,
        p1: lprofLine,
        p2: lprofArch,
        labels: ['line', 'arch'],
        tips: ['straight ramp · double-click to reverse', 'tent · double-click for a dark middle'],
      },
      H: {
        key: 'hprof',
        term: 'hprof',
        lo: 0,
        hi: 360,
        ticks: [0, 90, 180, 270, 360],
        hue: true,
        meas: (P) => P.map(hueOf).map(norm360),
        excluded: () => {
          const [lo, hi] = S.hue;
          if (hueAll()) return [];
          return lo < hi
            ? [
                [0, lo],
                [hi, 360],
              ].filter(([a, b]) => b > a)
            : [[hi, lo]];
        },
        fit: hprofFit,
        p1: hprofSweep,
        p2: hprofSplit,
        labels: ['sweep', 'split'],
        tips: [
          'steady turn · double-click to reverse',
          'two plateaus · double-click for the long way',
        ],
      },
    };
    for (const [id, p] of Object.entries(PLOTS)) {
      p.root = document.querySelector(`.pplot[data-plot=${id}]`);
      p.el = p.root.querySelector('canvas');
      p.ctx = p.el.getContext('2d');
      p.prof = () => S[p.key];
      // A knot can sit anywhere on the axis, outside the band or the arc included:
      // the bounds say where the palette may go, the profile says where it should.
      p.clamp = p.hue ? norm360 : (v) => Math.min(p.hi, Math.max(p.lo, v));
    }
    const PLOTLIST = Object.values(PLOTS);

    const plotX = (p, t) => LPAD.l + t * (p.el.clientWidth - LPAD.l - LPAD.r);
    const plotY = (p, v) =>
      p.el.clientHeight -
      LPAD.b -
      ((v - p.lo) / (p.hi - p.lo)) * (p.el.clientHeight - LPAD.t - LPAD.b);
    const plotT = (p, x) => (x - LPAD.l) / (p.el.clientWidth - LPAD.l - LPAD.r);
    const plotV = (p, y) =>
      p.lo +
      ((p.el.clientHeight - LPAD.b - y) / (p.el.clientHeight - LPAD.t - LPAD.b)) * (p.hi - p.lo);

    /**
     * The span the profile occupies, drawn as a bracket down the axis gutter and
     * draggable there: the middle moves the whole profile, either end stretches it
     * about the other. Editing every knot at once, without a modifier to hold or a
     * row of panel to spend, in the 8px the tick labels do not use.
     *
     * Both plots. See plotUnwrap for how a hue profile is made into something with a
     * span at all.
     */
    const GRIP = 7;

    /**
     * The profile as a path rather than as a set of values.
     *
     * Hue knots are stored wrapped and the polyline joins them the short way, so
     * the excursion the ramp really makes is the running sum of those steps — the
     * quantity totalTurn reports, and the reason magma's 264 to 109 is a turn of
     * +205 rather than the -155 its two endpoints suggest. Unwrapped, a hue profile
     * is a line like a lightness one, and both transforms below are the same
     * arithmetic on it. Lightness is already a line and comes back unchanged.
     */
    const plotUnwrap = (p) => {
      const prof = p.prof();
      if (!p.hue) return prof.slice();
      const u = [prof[0]];
      for (let i = 1; i < prof.length; i++) u.push(u[i - 1] + angDiff(prof[i], prof[i - 1]));
      return u;
    };

    const plotBand = (p) => {
      if (p.prof().length < 2) return null;
      const u = plotUnwrap(p);
      const lo = Math.min(...u),
        hi = Math.max(...u);
      // Lightness has ends and the bracket sits between them. Hue has none, so it
      // is centred on the profile's own middle brought back onto the axis: the same
      // construction, a midpoint and a half-span, reading as a gauge of the turn.
      const mid = p.hue ? norm360((lo + hi) / 2) : (lo + hi) / 2,
        half = (hi - lo) / 2;
      // and it wraps rather than being cut off at the edge, the same way the curve
      // above it does. Clipped instead, turning a profile past the end of the axis
      // made the bracket shrink, which is the one thing turning does not do.
      const segs = [];
      if (p.hue && half >= 180) segs.push([p.lo, p.hi]);
      else
        for (const off of p.hue ? [-360, 0, 360] : [0]) {
          const a = Math.max(p.lo, mid - half + off),
            b = Math.min(p.hi, mid + half + off);
          if (b > a) segs.push([a, b]);
        }
      const end = (v) => plotY(p, p.hue ? norm360(v) : v);
      return { u, lo, hi, segs, yHi: end(mid + half), yLo: end(mid - half) };
    };
    const plotGrip = (p, y) => {
      const b = plotBand(p);
      if (!b) return null;
      // ends closer together than the two grips can be told apart: a flat profile
      // has nothing to scale anyway, since every knot is already on the anchor
      const flat = Math.abs(b.yLo - b.yHi) < 2 * GRIP;
      if (!flat && Math.abs(y - b.yHi) <= GRIP) return 'hi';
      if (!flat && Math.abs(y - b.yLo) <= GRIP) return 'lo';
      return b.segs.some(([a, c]) => y >= plotY(p, c) - GRIP && y <= plotY(p, a) + GRIP)
        ? 'move'
        : null;
    };
    /**
     * Always from the snapshot taken when the drag began, never from the last
     * frame: composing the transform each move would drift, and a move that has run
     * into the ceiling would keep flattening the profile against it instead of
     * simply stopping. Moving stops at the wall; stretching anchors on the end that
     * is not moving.
     */
    function plotStretch(p, d, y) {
      const prof = p.prof(),
        { u, grip } = d;
      const lo = Math.min(...u),
        hi = Math.max(...u);
      const dv = plotV(p, y) - plotV(p, d.y);
      const put = (v, i) => (prof[i] = p.hue ? norm360(v) : v);
      const [blo, bhi] = [p.lo, p.hi];

      if (grip === 'move') {
        // a circle simply turns; an axis with ends stops at them rather than
        // flattening the profile against them
        const s = p.hue ? dv : Math.min(bhi - hi, Math.max(blo - lo, dv));
        u.forEach((v, i) => put(v + s, i));
        return;
      }
      if (hi - lo < 1e-9) return;
      /**
       * A step wider than half a circle is read as the short way round the other
       * side the next time the path is unwrapped, so the profile would jump to a
       * different winding mid-drag and not come back. Cap the spread where that
       * would start rather than let it happen.
       */
      const step = Math.max(...u.slice(1).map((v, i) => Math.abs(v - u[i])));
      const kMax = p.hue && step > 0 ? 179 / step : Infinity;
      const wall = (v, a, b) => (p.hue ? v : Math.min(b, Math.max(a, v)));
      const k = Math.min(
        kMax,
        grip === 'hi'
          ? (Math.max(lo, wall(hi + dv, lo, bhi)) - lo) / (hi - lo)
          : (hi - Math.min(hi, wall(lo + dv, blo, hi))) / (hi - lo),
      );
      const anchor = grip === 'hi' ? lo : hi;
      u.forEach((v, i) => put(anchor + (v - anchor) * k, i));
    }

    function layoutPlot() {
      const dpr = Math.min(2, devicePixelRatio || 1);
      for (const p of PLOTLIST) {
        const w = Math.max(1, Math.round(p.el.clientWidth * dpr));
        const h = Math.max(1, Math.round(p.el.clientHeight * dpr));
        if (p.el.width === w && p.el.height === h) continue; // assigning either one wipes the canvas
        p.el.width = w;
        p.el.height = h;
        p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // the wipe means the redraw has to live here rather than at the call site:
        // the resize observer fires after the last draw, and so does un-hiding
        if (p.prof().length) drawPlot(p);
      }
    }

    const drawPlots = () => PLOTLIST.forEach(drawPlot);

    function drawPlot(p) {
      const ctx = p.ctx,
        W = p.el.clientWidth,
        H = p.el.clientHeight;
      if (!W || !H || !p.prof().length) return;
      const hud =
        getComputedStyle(document.documentElement).getPropertyValue('--hud').trim() || '#3a3a42';
      const P = palette();
      const meas = P.length >= 2 ? p.meas(P) : [];

      ctx.clearRect(0, 0, W, H);
      // what the bounds exclude is shaded, and the knots stay out of it
      ctx.fillStyle = hud;
      ctx.globalAlpha = 0.1;
      for (const [a, b] of p.excluded())
        ctx.fillRect(LPAD.l, plotY(p, b), W - LPAD.l - LPAD.r, plotY(p, a) - plotY(p, b));
      ctx.strokeStyle = hud;
      ctx.globalAlpha = 0.28;
      ctx.lineWidth = 1;
      ctx.font = "9px 'Fira Mono',ui-monospace,monospace";
      ctx.fillStyle = hud;
      for (const v of p.ticks) {
        ctx.beginPath();
        ctx.moveTo(LPAD.l, plotY(p, v));
        ctx.lineTo(W - LPAD.r, plotY(p, v));
        ctx.stroke();
        ctx.globalAlpha = 0.75;
        ctx.fillText(String(v).padStart(3), 2, plotY(p, v) + 3);
        ctx.globalAlpha = 0.28;
      }
      const band = plotBand(p);
      if (band) {
        const bx = LPAD.l - 10;
        ctx.globalAlpha = 0.7;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (const [a, c] of band.segs) {
          ctx.moveTo(bx, plotY(p, c));
          ctx.lineTo(bx, plotY(p, a));
        }
        for (const y of [band.yHi, band.yLo]) {
          ctx.moveTo(bx - 5, y);
          ctx.lineTo(bx + 5, y);
        }
        ctx.stroke();
        ctx.lineWidth = 1;
      }
      ctx.globalAlpha = 1;

      /**
       * Where the palette breaks, in the plot's own parameter. A run boundary after
       * swatch i sits at i/(n-1), and a segment straddling one is not drawn: the
       * profile has no value between two runs, and a line there would claim a ramp
       * that is not in the palette.
       */
      const breaks = (() => {
        const n = S.mode === 'continuous' ? S.pts.length : 0;
        if (n < 2) return [];
        return S.cut.map((c, i) => (c && i < n - 1 ? i / (n - 1) : -1)).filter((t) => t >= 0);
      })();
      const spans = (t0, t1) =>
        !breaks.some((b) => t0 <= b + 1e-9 && b <= t1 - 1e-9 && t1 - t0 > 1e-9);

      /**
       * A polyline on a circle. Where the short way between two samples crosses the
       * seam the segment is split, leaving one edge and re-entering the other,
       * instead of being drawn as a full-height plunge across a discontinuity that
       * is not really there.
       */
      const wrapped = (vals, paint) => {
        for (let i = 1; i < vals.length; i++) {
          if (!spans((i - 1) / (vals.length - 1), i / (vals.length - 1))) continue;
          const [a, b] = [vals[i - 1], vals[i]];
          const x0 = plotX(p, (i - 1) / (vals.length - 1)),
            x1 = plotX(p, i / (vals.length - 1));
          const d = p.hue ? angDiff(b, a) : b - a;
          if (!p.hue || Math.abs(a + d - b) < 1e-9) {
            paint(x0, a, x1, b, i);
            continue;
          }
          const edge = d > 0 ? 360 : 0;
          const xm = x0 + (x1 - x0) * ((edge - a) / d);
          paint(x0, a, xm, edge, i);
          paint(xm, 360 - edge, x1, b, i);
        }
      };

      if (meas.length >= 2) {
        ctx.lineCap = 'round';
        wrapped(meas, (x0, a, x1, b, i) => {
          ctx.beginPath();
          ctx.moveTo(x0, plotY(p, a));
          ctx.lineTo(x1, plotY(p, b));
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 5;
          ctx.stroke();
          ctx.strokeStyle = shownCss(P[i]);
          ctx.lineWidth = 3.5;
          ctx.stroke();
        });
      }
      const prof = p.prof();
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = hud;
      wrapped(prof, (x0, a, x1, b) => {
        ctx.beginPath();
        ctx.moveTo(x0, plotY(p, a));
        ctx.lineTo(x1, plotY(p, b));
        ctx.stroke();
      });
      ctx.setLineDash([]);
      for (const b of breaks) {
        const x = plotX(p, b + 0.5 / Math.max(1, S.pts.length - 1));
        ctx.strokeStyle = hud;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, LPAD.t);
        ctx.lineTo(x, p.el.clientHeight - LPAD.b);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      const focused = document.activeElement === p.el; // the knot the keys hold is drawn larger
      prof.forEach((v, i) => {
        const held = focused && i === p.k;
        ctx.beginPath();
        ctx.arc(plotX(p, i / (LK - 1)), plotY(p, v), held ? 5.5 : 3.6, 0, 7);
        ctx.fillStyle = held ? '#fff' : hud;
        ctx.fill();
        ctx.strokeStyle = held ? hud : 'rgba(255,255,255,.7)';
        ctx.lineWidth = held ? 2 : 1;
        ctx.stroke();
      });
    }

    let lDrag = null;
    for (const p of PLOTLIST) {
      const at = (e) => {
        const r = p.el.getBoundingClientRect();
        return [e.clientX - r.left, e.clientY - r.top];
      };
      p.el.addEventListener('pointerdown', (e) => {
        const [x, y] = at(e);
        const grip = x < LPAD.l ? plotGrip(p, y) : null; // the gutter is the bracket's
        if (grip) lDrag = { p, grip, y, u: plotUnwrap(p) };
        else {
          lDrag = { p, i: Math.min(LK - 1, Math.max(0, Math.round(plotT(p, x) * (LK - 1)))) }; // nearest knot
          p.prof()[lDrag.i] = p.clamp(plotV(p, y));
        }
        p.el.setPointerCapture(e.pointerId);
        sidebar();
      });
      p.el.addEventListener('pointermove', (e) => {
        if (lDrag?.p !== p) return;
        const [, y] = at(e);
        if (lDrag.grip) {
          plotStretch(p, lDrag, y);
          p.prof().forEach((v, i, a) => {
            a[i] = p.clamp(v);
          });
        } else p.prof()[lDrag.i] = p.clamp(plotV(p, y)); // to the axis, no further
        sidebar();
      });
      p.el.addEventListener('pointerup', () => {
        lDrag = null;
      });

      // The knots by keyboard: left and right pick one, up and down move it, page
      // up and page down move the whole profile, and shift makes the step five
      // times larger. Handled here and stopped, so the window's keys for the
      // selected node do not also fire.
      p.k = 0;
      p.el.addEventListener('focus', () => drawPlot(p));
      p.el.addEventListener('blur', () => drawPlot(p));
      p.el.addEventListener('keydown', (e) => {
        const prof = p.prof();
        if (!prof.length) return;
        p.k = Math.min(p.k, LK - 1);
        const step = (p.hue ? 2 : 1) * (e.shiftKey ? 5 : 1);
        const dir = { ArrowUp: 1, ArrowDown: -1, PageUp: 1, PageDown: -1 }[e.key];
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight')
          p.k = Math.min(LK - 1, Math.max(0, p.k + (e.key === 'ArrowRight' ? 1 : -1)));
        else if (dir && e.key.startsWith('Page'))
          prof.forEach((v, i) => {
            prof[i] = p.clamp(v + dir * step);
          });
        else if (dir) prof[p.k] = p.clamp(prof[p.k] + dir * step);
        else return;
        e.preventDefault();
        e.stopPropagation();
        sidebar();
        const v = prof[p.k].toFixed(0);
        announce(
          `${p.hue ? 'hue' : 'lightness'} knot ${p.k + 1} of ${LK}: ${v}${p.hue ? '°' : ''}`,
        );
      });
    }

    /** Each plot's checkbox is the same flag as its row in Metrics, so both are
     *  written from S rather than from each other. */
    function paintPlotButtons() {
      for (const p of PLOTLIST) {
        p.root.querySelector('[data-on]').checked = !!S.on[p.term];
        ['p1', 'p2'].forEach((k, i) => {
          const b = p.root.querySelector(`[data-p=${k}]`);
          b.textContent = p.labels[i];
          b.title = p.tips[i];
        });
      }
    }

    /**
     * Bound to each plot, not to the strip they sometimes share.
     *
     * Docked, a plot is a row of the Optimize table and the two have no ancestor
     * between them but the document — so a listener on #lplot heard only whichever
     * plots happened to be at home, which after the panel took them was none. The
     * canvas drag never had this problem because it was always bound to the canvas.
     * These are bound the same way now, and travel with the element that owns them.
     */
    for (const p of PLOTLIST) {
      p.root.onclick = (e) => {
        const { on, p: act } = e.target.dataset ?? {};
        if (on) S.on[on] = e.target.checked;
        else if (act) p[act]();
        else return;
        sidebar();
      };
      /**
       * Double-click flips the profile. The click pair has already laid down the
       * natural one by the time this fires, so it only has to invert what is there.
       *
       * How to invert depends on the shape, and reversing is not always it: a tent
       * reversed is the same tent. So a symmetric profile is mirrored in lightness
       * instead, turning a light-centered diverging ramp into a dark-centered one,
       * while an asymmetric one is reversed, turning dark-to-light into light-to-dark.
       */
      p.root.ondblclick = (e) => {
        const act = e.target.dataset?.p;
        if (act !== 'p1' && act !== 'p2') return;
        const prof = p.prof();
        if (p.hue) {
          // a sweep flips by running backwards; a split flips by taking the other arc
          if (act === 'p2') hprofSplit(true);
          else S.hprof = prof.slice().reverse();
        } else {
          const [lo, hi] = [Math.min(...prof), Math.max(...prof)];
          const symmetric = prof.every((v, i) => Math.abs(v - prof[LK - 1 - i]) < 1e-9);
          S.lprof = symmetric ? prof.map((v) => lo + hi - v) : prof.slice().reverse();
        }
        sidebar();
      };
    }

    // ─── sync: rebuild what changed, then tell the worker ───────────────────────
    /** Rebuild whatever the change touched. Small enough to be blunt about it. */
    function sync({ colors = false, light = false } = {}) {
      if (!applying) stepShare = null; // an edit: the last step no longer describes this palette
      derive();
      constrain();
      slices.forEach(paintSlice);
      paintShell();
      buildTube();
      buildPoints();
      buildObstacles();
      buildPlanes();
      if (!light) sidebar(); // which is what tells the solver
      noteEdit();
    }

    /**
     * The worker holds its own S, so anything changed here has to be sent.
     *
     * sidebar() is the place to send it from: every edit repaints the panel,
     * including the profile edits that touch nothing else in the scene. The two
     * that deliberately do not repaint, the weights and the rate, call this
     * themselves. `applying` keeps the solver's own frames from echoing back.
     */
    function pushState() {
      if (running && !applying) solver.postMessage({ t: 'state', ...solverState() });
    }

    // ─── undo / redo ─────────────────────────────────────────────────────────────
    const HIST = { past: [], future: [], last: null, timer: 0, depth: 60 };

    /**
     * A discrete palette is kept in its most distinct order. Off the same debounce
     * as the history, so a drag or a run reorders once, when it stops, rather than
     * under the pointer; pins, marks and the selection follow their colors.
     */
    function settle() {
      if (S.mode !== 'discrete' || S.pts.length < 3 || running || drag) return false;
      const o = distinctOrder(S.pts);
      if (o.every((v, i) => v === i)) return false;
      setRuns([{ nodes: o, closed: false }]);
      sync(); // and its debounce brings commit back to record it
      return true;
    }
    /**
     * Debounced off sync() rather than called at each edit site. A drag syncs on
     * every pointermove and the solver syncs every frame, so committing per sync
     * would bury one real edit under hundreds of intermediate ones. Waiting for the
     * stream to stop instead collapses a drag into a single entry and a whole Adam
     * run into a single entry, which is what you want to step back through — and no
     * edit path has to remember to call anything.
     */
    function commit() {
      if (settle()) return;
      const now = sceneJSON();
      if (now === HIST.last) return;
      if (HIST.last !== null && HIST.past.push(HIST.last) > HIST.depth) HIST.past.shift();
      HIST.last = now;
      HIST.future.length = 0;
      paintHist();
    }
    const noteEdit = () => {
      clearTimeout(HIST.timer);
      HIST.timer = setTimeout(commit, 400);
    };

    function travel(from, to) {
      clearTimeout(HIST.timer);
      if (!from.length) return;
      to.push(HIST.last);
      HIST.last = from.pop(); // set BEFORE applying: applyScene syncs,
      applyScene(JSON.parse(HIST.last)); // and the debounced commit must see no change
      paintHist();
    }
    const undo = () => travel(HIST.past, HIST.future);
    const redo = () => travel(HIST.future, HIST.past);
    const paintHist = () => {
      $('undo').disabled = !HIST.past.length;
      $('redo').disabled = !HIST.future.length;
    };
    $('undo').onclick = undo;
    $('redo').onclick = redo;
    /**
     * The gamut on a CIE 1931 chromaticity diagram.
     *
     * A chromaticity is a color with its brightness divided out, so the horseshoe
     * is the whole of what the eye can see reduced to two numbers, and a set of
     * three primaries is a triangle inside it. That is the one picture that says
     * what a gamut is without saying anything about lightness, which is why it
     * belongs beside the gamut menu rather than in the 3D view.
     *
     * The fill is sRGB, always, whatever gamut is selected. Chromaticities outside
     * sRGB cannot be shown on an sRGB screen, so painting them through a wider
     * matrix would draw colors the display then clips anyway, and the picture would
     * change every time the menu did. Clamping instead makes the region beyond the
     * sRGB triangle flatten toward its edge, which is honest about what is missing.
     *
     * The straight edge from the last locus point back to the first is the line of
     * purples: those are mixtures of the two ends of the spectrum, not wavelengths.
     */
    const chroma = $('chroma');
    const CH = { w: 420, h: 450, m: { l: 34, r: 10, t: 10, b: 26 }, xmax: 0.75, ymax: 0.85 };
    let locusFill = null,
      locusKey = null; // sRGB, so it survives a gamut change
    let locusLCh = null; // per pixel, so bounds are arithmetic
    /**
     * The deficiency on linear sRGB, where both models are defined.
     *
     * Machado is one matrix. Tritan above severity 0.8 blends into Brettel, which
     * is two matrices and a plane test, so this is a function rather than a matrix
     * and callers cannot assume linearity — see how the triangle is drawn.
     */
    const cvdLin = () => {
      if (S.cvd === 'none') return null;
      const m = internals.cvdMatrix(S.cvd, S.sev);
      const w = S.cvd === 'tritan' ? tritanMix(S.sev) : 0;
      const B = internals.BRETTEL_TRITAN;
      return (l) => {
        const a = [0, 1, 2].map((r) => m[3 * r] * l[0] + m[3 * r + 1] * l[1] + m[3 * r + 2] * l[2]);
        if (!w) return a;
        const h = B.n[0] * l[0] + B.n[1] * l[1] + B.n[2] * l[2] >= 0 ? B.h1 : B.h2;
        const b = [0, 1, 2].map((r) => h[3 * r] * l[0] + h[3 * r + 1] * l[1] + h[3 * r + 2] * l[2]);
        return a.map((v, i) => v + w * (b[i] - v));
      };
    };

    const chX = (x) => CH.m.l + (x / CH.xmax) * (CH.w - CH.m.l - CH.m.r);
    const chY = (y) => CH.h - CH.m.b - (y / CH.ymax) * (CH.h - CH.m.t - CH.m.b);

    /** the locus as a closed path in canvas coordinates */
    const locusPath = (g) => {
      g.beginPath();
      SPECTRAL_LOCUS.forEach(([x, y], i) =>
        i ? g.lineTo(chX(x), chY(y)) : g.moveTo(chX(x), chY(y)),
      );
      g.closePath();
    };

    /**
     * Every chromaticity inside the horseshoe, at the brightest sRGB that can carry
     * it. Scaling each by its own largest channel is what makes the picture look
     * like the familiar one: a chromaticity has no brightness of its own, so some
     * choice has to be made, and the brightest is the one that shows the most hue.
     */
    function paintLocus(cvd) {
      const img = new ImageData(CH.w, CH.h),
        d = img.data;
      // C/L and hue at each chromaticity, which is all the bounds test needs and
      // does not depend on them — see boundsMask
      const ratio = new Float32Array(CH.w * CH.h).fill(NaN),
        hue = new Float32Array(CH.w * CH.h);
      const M = internals.rgbFromXYZ('srgb');
      const pts = SPECTRAL_LOCUS.map(([x, y]) => [chX(x), chY(y)]);
      for (let py = 0; py < CH.h; py++) {
        // crossings of this scanline with the closed polygon, as x spans
        const xs = [];
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i],
            [xj, yj] = pts[j];
          if (yi > py + 0.5 !== yj > py + 0.5)
            xs.push(xi + ((py + 0.5 - yi) * (xj - xi)) / (yj - yi));
        }
        xs.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xs.length; k += 2)
          for (let px = Math.ceil(xs[k]); px <= xs[k + 1]; px++) {
            const x = ((px - CH.m.l) / (CH.w - CH.m.l - CH.m.r)) * CH.xmax;
            const y = ((CH.h - CH.m.b - py) / (CH.h - CH.m.t - CH.m.b)) * CH.ymax;
            if (y <= 0) continue;
            const xyz = [x / y, 1, (1 - x - y) / y];
            let rgb = [0, 1, 2].map((r) => M[r][0] * xyz[0] + M[r][1] * xyz[1] + M[r][2] * xyz[2]);
            if (cvd) rgb = cvd(rgb);
            const mx = Math.max(...rgb);
            if (!(mx > 0)) continue;
            const o = 4 * (py * CH.w + px);
            for (let c = 0; c < 3; c++)
              d[o + c] = 255 * clamp01(Math.max(0, rgb[c] / mx) ** (1 / 2.2));
            d[o + 3] = 255;
            const [L1, a1, b1] = fromXYZ(xyz);
            if (L1 > 0) {
              const i = py * CH.w + px;
              ratio[i] = Math.hypot(a1, b1) / L1;
              hue[i] = ((Math.atan2(b1, a1) * 180) / Math.PI + 360) % 360;
            }
          }
      }
      locusLCh = { ratio, hue };
      return img;
    }

    /**
     * Which chromaticities the bounds still allow.
     *
     * Lightness has no axis on this diagram — a chromaticity is a color with its
     * brightness already divided out — so the band cannot be drawn directly. It is
     * not absent from the answer, though. Oklab is linear in the cube root of a
     * scale on XYZ, so moving along a chromaticity at fixed hue scales L, a and b
     * together: hue does not depend on lightness at all, and C/L is a constant of
     * the chromaticity. Measured, both hold to 1e-10.
     *
     * That makes the test exact rather than sampled. The chroma band asks for
     * C = r·L in [C-, C+], which is an interval in L; intersect it with the
     * lightness band and the chromaticity survives if what is left is non-empty.
     * So the lightness band shows up here only through what it lets the chroma
     * band reach, and on its own it excludes nothing: any chromaticity can be had
     * at any lightness by turning the luminance up or down.
     *
     * The hue arc exempts chroma below 1, as the slice shaders do, but the
     * exemption has to be read against the chromaticity rather than the color, or
     * it swallows the diagram: the lightness band reaches 0 by default, so every
     * chromaticity could be taken near-black, be exempt, and the arc would veil
     * nothing. What the picture asks instead is whether this chromaticity can be
     * had at chroma 1 or more at all within the bounds. If it cannot it is neutral
     * and hue does not apply to it; if it can, it has to lie in the arc.
     */
    function boundsMask() {
      const { ratio, hue } = locusLCh;
      const [lL, lC] = [S.lo[0], S.lo[1]],
        [hL, hC] = [S.hi[0], S.hi[1]];
      const anyHue = hueAll();
      const m = new Uint8Array(CH.w * CH.h);
      for (let i = 0; i < m.length; i++) {
        const r = ratio[i];
        if (Number.isNaN(r)) continue;
        // the chroma band as an interval in L, met with the lightness band
        const lo = r > 0 ? Math.max(lL, lC / r) : lC > 0 ? Infinity : lL;
        const hi = r > 0 ? Math.min(hL, hC / r) : hL;
        if (lo > hi) continue;
        m[i] = anyHue || r * hi < 1 || inHueArc(hue[i]) ? 1 : 0;
      }
      return m;
    }

    function drawChroma() {
      const dpr = Math.min(2, devicePixelRatio || 1);
      chroma.width = CH.w * dpr;
      chroma.height = CH.h * dpr;
      chroma.style.aspectRatio = `${CH.w} / ${CH.h}`;
      const g = chroma.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const panel = getComputedStyle(document.body).getPropertyValue('--panel').trim() || '#1c1c1f';
      g.fillStyle = panel;
      g.fillRect(0, 0, CH.w, CH.h);
      g.fillRect(0, 0, 1, 1);
      const bg = g.getImageData(0, 0, 1, 1).data;

      g.save();
      locusPath(g);
      g.clip();
      // through a canvas rather than putImageData, which writes device pixels and
      // ignores the transform -- on a 2x display that put the fill at quarter size
      // in the corner while the clip path, which IS transformed, stayed put
      const key = `${S.cvd}|${S.sev}`;
      if (key !== locusKey) {
        const off = document.createElement('canvas');
        off.width = CH.w;
        off.height = CH.h;
        off.getContext('2d').putImageData(paintLocus(cvdLin()), 0, 0);
        locusFill = off;
        locusKey = key;
      }
      g.drawImage(locusFill, 0, 0, CH.w, CH.h);
      // what the bounds rule out, veiled rather than cut away: the horseshoe is the
      // landmark you read the rest against, and removing most of it loses that
      const mask = boundsMask();
      {
        const veil = new ImageData(CH.w, CH.h),
          v = veil.data;
        for (let i = 0; i < mask.length; i++)
          if (!mask[i] && !Number.isNaN(locusLCh.ratio[i])) {
            v[4 * i] = bg[0];
            v[4 * i + 1] = bg[1];
            v[4 * i + 2] = bg[2];
            v[4 * i + 3] = 214;
          }
        const off = document.createElement('canvas');
        off.width = CH.w;
        off.height = CH.h;
        off.getContext('2d').putImageData(veil, 0, 0);
        g.drawImage(off, 0, 0, CH.w, CH.h);
      }
      g.restore();

      // axes, under everything that matters
      g.strokeStyle = 'rgba(139,139,150,.35)';
      g.fillStyle = 'rgba(139,139,150,.9)';
      g.lineWidth = 1;
      g.font = '9px ui-monospace, monospace';
      for (let t = 0; t <= 0.8; t += 0.1) {
        if (t <= CH.xmax) {
          g.beginPath();
          g.moveTo(chX(t), chY(0));
          g.lineTo(chX(t), chY(0) + 3);
          g.stroke();
          g.textAlign = 'center';
          g.fillText(t.toFixed(1), chX(t), chY(0) + 13);
        }
        if (t <= CH.ymax) {
          g.beginPath();
          g.moveTo(chX(0), chY(t));
          g.lineTo(chX(0) - 3, chY(t));
          g.stroke();
          g.textAlign = 'right';
          g.fillText(t.toFixed(1), chX(0) - 6, chY(t) + 3);
        }
      }
      g.strokeStyle = 'rgba(139,139,150,.5)';
      g.beginPath();
      g.moveTo(chX(0), chY(CH.ymax));
      g.lineTo(chX(0), chY(0));
      g.lineTo(chX(CH.xmax), chY(0));
      g.stroke();
      g.textAlign = 'left';
      g.fillText('x', chX(CH.xmax) - 8, chY(0) + 13);
      g.fillText('y', chX(0) - 12, chY(CH.ymax) + 8);

      locusPath(g);
      g.strokeStyle = 'rgba(232,232,236,.55)';
      g.lineWidth = 1;
      g.stroke();

      /**
       * Where a chromaticity lands for the observer on screen.
       *
       * Machado is a matrix on linear sRGB, so it is linear on XYZ too, and a
       * linear map sends chromaticities to chromaticities: the triangle stays a
       * triangle and collapses toward the confusion line as severity rises. The
       * frame does not move -- the locus and the axes stay the normal observer's,
       * because a simulation reports the color a normal observer would see, not a
       * different set of matching functions.
       */
      const cv = cvdLin();
      const seen = ([x, y]) => {
        if (!cv) return [x, y];
        const xyz = [x / y, 1, (1 - x - y) / y];
        const M0 = internals.rgbFromXYZ('srgb'),
          M1 = internals.xyzFromRGB('srgb');
        const l = [0, 1, 2].map((r) => M0[r][0] * xyz[0] + M0[r][1] * xyz[1] + M0[r][2] * xyz[2]);
        const c = cv(l);
        const q = [0, 1, 2].map((r) => M1[r][0] * c[0] + M1[r][1] * c[1] + M1[r][2] * c[2]);
        const t = q[0] + q[1] + q[2];
        return t > 0 ? [q[0] / t, q[1] / t] : [x, y];
      };

      /** a gamut's triangle, and its white point */
      const triangle = (k, stroke, wide, dot) => {
        const gm = GAMUTS[k];
        if (!gm?.p) return;
        // walked, not cornered: a dichromat's map is two projections and an edge
        // folds where it crosses between them, so three mapped vertices would draw
        // a triangle over what is really a pair of segments meeting at white
        const N = cv ? 48 : 1;
        g.beginPath();
        let first = true;
        for (let e = 0; e < 3; e++) {
          const [ax, ay] = gm.p[e],
            [bx, by] = gm.p[(e + 1) % 3];
          for (let i = 0; i <= N; i++) {
            const t = i / N,
              [x, y] = seen([ax + (bx - ax) * t, ay + (by - ay) * t]);
            if (first) {
              g.moveTo(chX(x), chY(y));
              first = false;
            } else g.lineTo(chX(x), chY(y));
          }
        }
        g.closePath();
        g.strokeStyle = stroke;
        g.lineWidth = wide;
        g.stroke();
        if (!dot) return;
        g.fillStyle = stroke;
        const [wx, wy] = seen(gm.w);
        g.beginPath();
        g.arc(chX(wx), chY(wy), 3, 0, 7);
        g.fill();
        g.strokeStyle = 'rgba(255,255,255,.85)';
        g.lineWidth = 1;
        g.stroke();
      };
      // Black, not the interface foreground: this sits on the filled horseshoe
      // rather than on the panel, and that fill is bright everywhere the triangle
      // can reach, in either theme.
      // sRGB for reference whenever it is not the one selected
      if (params.gamut !== 'srgb') triangle('srgb', 'rgba(0,0,0,.35)', 1, false);
      triangle(params.gamut, '#000', 1.6, true);

      /** a chart point to canvas coordinates, through the observer on screen */
      const at = (p) => {
        const [X, Y, Z] = toXYZ(view(p)),
          t = X + Y + Z;
        return t > 0 ? [chX(X / t), chY(Y / t)] : null;
      };

      // the trajectory, one polyline per run, in the colors it passes through.
      // Discrete mode has no curve, and the swatches below are the whole story.
      if (S.mode === 'continuous' && S.pts.length >= 2) {
        g.lineCap = 'round';
        g.lineJoin = 'round';
        for (const c of curves()) {
          const q = c.map(at).filter(Boolean);
          if (q.length < 2) continue;
          g.beginPath();
          q.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
          g.strokeStyle = 'rgba(16,16,18,.85)';
          g.lineWidth = 4;
          g.stroke();
          // segment by segment for the color, over one casing, so the casing does
          // not overdraw the segment before it
          g.lineWidth = 2.8;
          for (let i = 0; i + 1 < q.length; i++) {
            g.beginPath();
            g.moveTo(q[i][0], q[i][1]);
            g.lineTo(q[i + 1][0], q[i + 1][1]);
            g.strokeStyle = shownCss(c[i]);
            g.stroke();
          }
        }
      }

      // where the palette actually sits
      const pal = palette();
      for (const p of pal) {
        const q = at(p);
        if (!q) continue;
        g.beginPath();
        g.arc(q[0], q[1], 3.4, 0, 7);
        g.fillStyle = shownCss(p);
        g.fill();
        g.strokeStyle = 'rgba(16,16,18,.85)';
        g.lineWidth = 1.2;
        g.stroke();
      }

      $('chromacap').textContent =
        'Colors are drawn in sRGB, so anything outside that triangle is shown at the nearest it can manage.';
    }
    /** a button opens its dialog once `ready` resolves; the close button and a click on the backdrop close it */
    function wireDialog(btn, dlg, close, ready = () => {}) {
      $(btn).onclick = async () => {
        await ready();
        $(dlg).showModal();
      };
      $(close).onclick = () => $(dlg).close();
      // the dialog's box is its only child, so a click whose target IS the dialog landed outside it
      $(dlg).onclick = (e) => {
        if (e.target === $(dlg)) $(dlg).close();
      };
    }
    wireDialog('chromabtn', 'chromadlg', 'chromaclose', drawChroma);

    /**
     * The three prose dialogs are rendered from src/text by scripts/render-docs.js,
     * markdown and math alike, so the page fetches finished HTML: no renderer, no
     * math fonts, no typesetting. The build writes the files; the dev server
     * renders them on request when it is serving the sources.
     */
    const DOCS = [
      ['./text/about.html', 'aboutbody'],
      ['./text/formulation.html', 'mathbody'],
      ['./text/spaces.html', 'spacebody'],
    ];
    async function renderDoc(url, into) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url}: ${res.status}`);
      $(into).innerHTML = await res.text();
    }
    // none of it is on screen until a ? button is pressed, so none of it starts
    // until the viewport has drawn
    const painted = new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const docsReady = painted
      .then(() => Promise.all(DOCS.map(([url, into]) => renderDoc(url, into))))
      .catch((e) => DOCS.forEach(([, into]) => ($(into).textContent = String(e))));
    for (const [btn, dlg, close] of [
      ['mathbtn', 'mathdlg', 'mathclose'],
      ['spacebtn', 'spacedlg', 'spaceclose'],
      ['aboutbtn', 'aboutdlg', 'aboutclose'],
    ])
      wireDialog(btn, dlg, close, () => docsReady);

    // ─── picking: one path for all four panels ───────────────────────────────────
    const ray = new T.Raycaster();
    const ndc = new T.Vector2();
    const plane = new T.Plane();
    let hovered = null;
    let hold = null;
    const dropHold = () => {
      if (hold) {
        clearTimeout(hold.t);
        hold = null;
      }
    };
    /** Slices track the node you touched, so every panel is cut through it. */
    function setSlices(p) {
      const c = toSpace(p);
      S.slice = c.map((v, k) => Math.min(FRAME.hi[k], Math.max(FRAME.lo[k], v)));
      paintSlices();
    }

    function select(sel) {
      S.sel = sel;
      const p =
        sel?.kind === 'pt' ? S.pts[sel.i] : sel?.kind?.startsWith('obs') ? S.obs[sel.i]?.c : null;
      if (p && S.lock) setSlices(p);
    }

    // a hidden quad has no rect, and has to answer nothing rather than throw, or
    // every pointer interaction on the canvas goes down with it
    const quadAt = (x, y) =>
      QUADS.find(
        (q) =>
          q.rect &&
          x >= q.rect.x &&
          x < q.rect.x + q.rect.w &&
          y >= q.rect.y &&
          y < q.rect.y + q.rect.h,
      );

    function castFrom(e) {
      scene.updateMatrixWorld(); // three does not do this for us, and a mesh built
      const r = canvas.getBoundingClientRect(); // since the last frame would raycast at the origin
      const x = e.clientX - r.left,
        y = e.clientY - r.top;
      const q = quadAt(x, y);
      if (!q) return null;
      ndc.set(((x - q.rect.x) / q.rect.w) * 2 - 1, -(((y - q.rect.y) / q.rect.h) * 2 - 1));
      ray.setFromCamera(ndc, q.cam);
      return q;
    }

    /** Where a click in a slice panel lands: on that panel's own cut plane. */
    function pointOn(q) {
      const ax = AXES[q.axis];
      plane.setFromNormalAndCoplanarPoint(ax.normal(), world(ax.corners(S.slice[q.axis])[0]));
      const hit = ray.ray.intersectPlane(plane, new T.Vector3());
      return hit && cpt(hit);
    }

    /**
     * Where a double-click in the 3D view lands.
     *
     * The solid is drawn BackSide, so the color you see at a pixel is its FAR
     * wall — and a raycast honors material.side, so the default hit against it is
     * that same far wall. Clicking therefore adds the color you clicked on, not
     * the one hidden behind it.
     *
     * Off the solid, fall back to the camera-facing plane through the current cut:
     * the same plane a drag in 3D already moves in, so a node added in empty space
     * lands where dragging would have put it.
     */
    function pointIn3D(q) {
      if (shell.visible) {
        const mask = ray.layers.mask;
        ray.layers.enable(1); // the solid lives on the 3D-only layer
        const hit = ray.intersectObject(shell, false)[0];
        ray.layers.mask = mask;
        if (hit) return cpt(hit.point);
      }
      plane.setFromNormalAndCoplanarPoint(q.cam.getWorldDirection(new T.Vector3()), world(S.slice));
      const at = ray.ray.intersectPlane(plane, new T.Vector3());
      return at && cpt(at);
    }

    /**
     * Small handles beat the bodies they sit on. Raw distance order is wrong here:
     * a sphere's near surface is always closer to the camera than the radius handle
     * on its far-ish side, so picking by distance alone made the handle unreachable
     * and every attempt to resize a sphere moved it instead.
     */
    const PICK_ORDER = { pt: 0, obsr: 0, planerot: 0, plane: 0, obs: 1 };
    const hitTest = () => {
      const hits = ray
        .intersectObjects(
          [...ptGroup.children, ...obsGroup.children, ...planeGroup.children],
          false,
        )
        .filter((h) => h.object.userData.kind);
      if (!hits.length) return undefined;
      const best = Math.min(...hits.map((h) => PICK_ORDER[h.object.userData.kind]));
      return hits.find((h) => PICK_ORDER[h.object.userData.kind] === best); // still nearest within its rank
    };

    canvas.addEventListener('pointerdown', (e) => {
      const q = castFrom(e);
      if (!q) return;
      controls.enabled = q.axis === undefined; // a drag in a slice panel must not orbit 3D
      const grabbed = hitTest();

      if (
        grabbed &&
        (e.ctrlKey || e.metaKey) &&
        grabbed.object.userData.kind === 'pt' &&
        S.mode === 'continuous'
      ) {
        // marking, not grabbing: no drag, no orbit, and the selection is left alone
        const { i } = grabbed.object.userData;
        const at = S.marks.indexOf(i);
        if (at >= 0) S.marks.splice(at, 1);
        else S.marks.push(i);
        controls.enabled = false;
        sync();
        return;
      }
      if (grabbed) {
        select({ ...grabbed.object.userData });
        // Drag on the plane through the object facing the camera. In an ortho panel
        // that normal IS an axis, so the out-of-plane coordinate is left alone —
        // one implementation covers 3D free dragging and slice-constrained dragging.
        plane.setFromNormalAndCoplanarPoint(
          q.cam.getWorldDirection(new T.Vector3()),
          grabbed.object.position.clone(),
        );
        drag = { ...S.sel };
        controls.enabled = false;
        canvas.setPointerCapture(e.pointerId);
        // A touch has no right button, so holding still on a node is the delete.
        // Mouse is excluded deliberately: pausing mid-drag to think is normal with
        // a mouse and must not destroy what you were about to move.
        if (e.pointerType !== 'mouse') {
          const { kind, i } = grabbed.object.userData;
          hold = {
            x: e.clientX,
            y: e.clientY,
            t: setTimeout(() => {
              hold = null;
              drag = null;
              openMenu(e.clientX, e.clientY, kind, i);
            }, 520),
          };
        }
      } else if (q.axis !== undefined) {
        // empty space in a slice panel: pan
        drag = { kind: 'pan', q, x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
        return;
      } else return; // empty space in 3D belongs to orbit
      sync();
    });

    canvas.addEventListener('dblclick', (e) => {
      const q = castFrom(e);
      if (!q || hitTest()) return; // only into empty space
      const p = q.axis === undefined ? pointIn3D(q) : pointOn(q);
      if (!p) return;
      if (S.tool === 'obstacle') {
        S.obs.push({ c: p, r: S.rad });
        select({ kind: 'obs', i: S.obs.length - 1 });
      } else if (S.tool === 'plane') {
        // a slice panel has an axis to align to; in 3D the cut faces the camera,
        // which is the only orientation the click itself carries any information about
        let n;
        if (q.axis === undefined) {
          const d = q.cam.getWorldDirection(new T.Vector3());
          const len = Math.hypot(d.y, d.x, d.z);
          n = [d.y / len, d.x / len, d.z / len]; // world → space is that swap
        } else {
          n = [0, 0, 0];
          n[q.axis] = 1;
        } // rotate the tip to change it
        S.planes.push({ n, d: dot3(n, toSpace(p)) }); // excludes n·c > d; flip in the panel
        select({ kind: 'plane', i: S.planes.length - 1 });
      } else select({ kind: 'pt', i: addPoint(p) });
      disturb();
      sync();
    });

    function dropOne(kind, i) {
      ({ pt: S.pts, obs: S.obs, obsr: S.obs, plane: S.planes, planerot: S.planes })[kind].splice(
        i,
        1,
      );
      if (kind !== 'pt') return;
      S.pin.splice(i, 1);
      // the node's two edges collapse into one, and it is a break if either was
      if (i > 0 && S.cut[i]) S.cut[i - 1] = true;
      S.cut.splice(i, 1);
      S.marks = S.marks.filter((m) => m !== i).map((m) => (m > i ? m - 1 : m));
    }

    function removeAt(kind, i) {
      // descending, so each splice leaves the indices still to come where they were
      for (const k of targetsFor(kind, i).sort((a, b) => b - a)) dropOne(kind, k);
      S.sel = null;
      sync();
    }

    /** the target of the context menu, which the right button and a long press both open */
    let menuFor = null;

    /**
     * What pin and delete act on: the marked set if the node under the cursor is
     * one of them, otherwise just that node.
     *
     * The same rule a file manager uses, and the reason marking is worth doing at
     * all — right-clicking inside a selection acts on the selection, right-clicking
     * outside it acts on what you clicked and leaves the marks alone, so a mark
     * made for a connect is not lost to an unrelated delete.
     */
    const targetsFor = (kind, i) =>
      kind === 'pt' && S.marks.length && S.marks.includes(i) ? [...S.marks] : [i];

    function openMenu(clientX, clientY, kind, i) {
      menuFor = { kind, i };
      const many = targetsFor(kind, i);
      const n = many.length > 1 ? ` ${many.length}` : '';
      const acts =
        kind === 'pt'
          ? // one state for the whole set rather than a toggle each: pin unless every
            // one of them already is
            [...linkActs(), (many.every((k) => S.pin[k]) ? 'unpin' : 'pin') + n, `delete${n}`]
          : ['delete'];
      const m = $('ctxmenu');
      m.innerHTML = acts.map((a) => `<button data-act="${a}">${a}</button>`).join('');
      m.hidden = false;
      const r = main.getBoundingClientRect();
      m.style.left = `${Math.min(clientX - r.left, main.clientWidth - m.offsetWidth - 6)}px`;
      m.style.top = `${Math.min(clientY - r.top, main.clientHeight - m.offsetHeight - 6)}px`;
    }
    const closeMenu = () => {
      $('ctxmenu').hidden = true;
      menuFor = null;
    };
    $('ctxmenu').onclick = (e) => {
      const act = e.target.dataset?.act;
      if (!act || !menuFor) return;
      const { kind, i } = menuFor;
      closeMenu();
      if (act === 'connect') return linkMarks();
      if (act === 'disconnect') return unlinkMarks();
      if (act === 'clear marks') {
        S.marks = [];
        return sync();
      }
      const verb = act.split(' ')[0];
      if (verb === 'delete') return removeAt(kind, i);
      const on = verb === 'pin';
      for (const k of targetsFor(kind, i)) S.pin[k] = on;
      sync();
    };
    // capture, so a click anywhere else dismisses it before that click does anything
    addEventListener(
      'pointerdown',
      (e) => {
        if (!$('ctxmenu').hidden && !$('ctxmenu').contains(e.target)) closeMenu();
      },
      true,
    );

    canvas.addEventListener('contextmenu', (e) => {
      if (!castFrom(e)) return;
      const hit = hitTest();
      if (!hit) return;
      e.preventDefault();
      openMenu(e.clientX, e.clientY, hit.object.userData.kind, hit.object.userData.i);
    });

    // wheel over a slice panel scrolls that cut plane; over 3D it stays OrbitControls'
    canvas.addEventListener(
      'wheel',
      (e) => {
        const r = canvas.getBoundingClientRect();
        const q = quadAt(e.clientX - r.left, e.clientY - r.top);
        if (!q || q.axis === undefined) return;
        e.preventDefault();
        if (e.ctrlKey || e.shiftKey || e.metaKey) {
          // plain wheel is still the slice
          q.cam.zoom = Math.min(24, Math.max(0.25, q.cam.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
          q.cam.updateProjectionMatrix();
          return;
        }
        setSlice(q.axis, S.slice[q.axis] - Math.sign(e.deltaY) * wheelStep(q.axis));
      },
      { passive: false },
    );

    canvas.addEventListener('pointermove', (e) => {
      if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 8) dropHold(); // moved: it is a drag
      if (!drag) {
        const r = canvas.getBoundingClientRect();
        const q = quadAt(e.clientX - r.left, e.clientY - r.top);
        hovered = q;
        controls.enabled = !!q && q.axis === undefined; // orbit and wheel-zoom belong to 3D only
        return;
      }
      if (drag.kind === 'pan') {
        const { q } = drag;
        // one screen pixel is this many world units, which is what keeps whatever
        // is under the cursor under the cursor
        const perPx = (2 * q.cam.top) / q.cam.zoom / q.rect.h;
        const right = new T.Vector3(1, 0, 0).applyQuaternion(q.cam.quaternion);
        const up = new T.Vector3(0, 1, 0).applyQuaternion(q.cam.quaternion);
        q.cam.position
          .addScaledVector(right, -(e.clientX - drag.x) * perPx)
          .addScaledVector(up, (e.clientY - drag.y) * perPx);
        drag.x = e.clientX;
        drag.y = e.clientY;
        return;
      }
      if (!castFrom(e)) return;
      const hit = ray.ray.intersectPlane(plane, new T.Vector3());
      if (!hit) return;
      const p = cpt(hit);
      if (drag.kind === 'obsr') {
        // the radius that puts the shell through the pointer: the same measure the
        // solver enforces, so the handle lands where it was dragged in every space
        const o = S.obs[drag.i];
        S.obs[drag.i].r = Math.min(60, Math.max(1, lineDelta(o.c, p, spaceMetric())));
      } else if (drag.kind === 'plane')
        S.planes[drag.i].d = dot3(S.planes[drag.i].n, toSpace(p)); // slide along the normal
      else if (drag.kind === 'planerot') {
        const pl = S.planes[drag.i],
          c = planeCenter(pl);
        const dir = sdir(hit.clone().sub(world(c))); // aim the normal at the handle
        const len = Math.hypot(...dir);
        if (len > 1e-6) {
          pl.n = dir.map((x) => x / len);
          pl.d = dot3(pl.n, c);
        } // pivot about the center
      } else if (drag.kind === 'pt') S.pts[drag.i] = p;
      else S.obs[drag.i].c = p;
      if (S.lock && drag.kind === 'pt') setSlices(p);
      disturb();
      sync();
    });

    canvas.addEventListener('pointerup', () => {
      drag = null;
      dropHold();
    });
    canvas.addEventListener('pointercancel', () => {
      drag = null;
      dropHold();
    });

    addEventListener('keydown', (e) => {
      if (/^(INPUT|SELECT)$/.test(e.target.tagName)) return; // the field's own undo wins
      const z = (e.ctrlKey || e.metaKey) && e.key.toLowerCase();
      if (z === 'z' || z === 'y') {
        e.preventDefault();
        return z === 'y' || e.shiftKey ? redo() : undo();
      }
      if (e.key === 'r' && hovered?.axis !== undefined) {
        resetView(hovered.cam);
        return;
      }
      // [ and ] walk the selection through the nodes, then the keep-out balls, then
      // the planes, so the canvas can be driven without a pointer
      if (e.key === '[' || e.key === ']') {
        const all = [
          ...S.pts.map((_, i) => ({ kind: 'pt', i })),
          ...S.obs.map((_, i) => ({ kind: 'obs', i })),
          ...S.planes.map((_, i) => ({ kind: 'plane', i })),
        ];
        if (!all.length) return;
        const kind = { obsr: 'obs', planerot: 'plane' }[S.sel?.kind] ?? S.sel?.kind;
        const at = all.findIndex((x) => x.kind === kind && x.i === S.sel?.i);
        const from = at < 0 ? (e.key === ']' ? -1 : 0) : at;
        const next = all[(from + (e.key === ']' ? 1 : -1) + all.length) % all.length];
        select(next);
        sync();
        const p = next.kind === 'pt' ? S.pts[next.i] : null;
        announce(
          next.kind === 'pt'
            ? `selected node ${next.i + 1}, ${toHex(p)}, ${colorName(p)}`
            : next.kind === 'obs'
              ? `selected keep-out ball ${next.i + 1}, radius ${S.obs[next.i].r.toFixed(1)}`
              : `selected halfplane ${next.i + 1}`,
        );
        return;
      }
      if (!S.sel) return;
      // arrows nudge the selection in the plane of the panel under the pointer, the
      // way a drag there would move it: one space unit a press, ten with shift
      const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[
        e.key
      ];
      if (dir && (S.sel.kind === 'pt' || S.sel.kind === 'obs')) {
        e.preventDefault();
        const q = hovered ?? QUADS[0],
          by = (e.shiftKey ? 10 : 1) * FRAME.s;
        const right = new T.Vector3(1, 0, 0).applyQuaternion(q.cam.quaternion);
        const up = new T.Vector3(0, 1, 0).applyQuaternion(q.cam.quaternion);
        const was = S.sel.kind === 'pt' ? S.pts[S.sel.i] : S.obs[S.sel.i].c;
        const p = cpt(
          wpt(was)
            .addScaledVector(right, dir[0] * by)
            .addScaledVector(up, dir[1] * by),
        );
        if (S.sel.kind === 'pt') {
          S.pts[S.sel.i] = p;
          if (S.lock) setSlices(p);
