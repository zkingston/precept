$('exportfmt').onchange = (e) => { S.fmt = e.target.value; };

// ─── the selection, in whichever notation you think in ───────────────────────
// LCh and oklch() read the CHART directly and are not gamut-mapped, so they
// round-trip exactly and will show you an out-of-gamut node as out of gamut.
// hex and rgb necessarily map into sRGB first, because that is all they can say.
const nums = (v, n) => { const m = v.match(/-?\d*\.?\d+/g); return m && m.length >= n ? m.map(Number) : null; };
const COLORFMT = {
  hex: { label: 'hex', hint: '#440154',
    to: toHex,
    from: (v) => (/^#?[0-9a-f]{6}$/i.test(v.trim()) ? fromHex(v.trim().replace(/^#/, '')) : null) },
  rgb: { label: 'rgb 0–255', hint: '68, 1, 84',
    to: (p) => rgb255(p).join(', '),
    from: (v) => { const m = nums(v, 3); return m ? fromSRGB(m.slice(0, 3).map((x) => x / 255)) : null; } },
  lch: { label: 'LCh chart', hint: '26.5 13.1 305',
    to: (p) => { const [L, C, h] = toLCh(p); return `${L.toFixed(2)} ${C.toFixed(2)} ${norm360(h).toFixed(1)}`; },
    from: (v) => { const m = nums(v, 3); return m ? fromLCh([m[0], m[1], m[2]]) : null; } },
  oklch: { label: 'oklch()', hint: 'oklch(26.5% 0.131 305)',
    to: (p) => { const [L, C, h] = toLCh(p); return `oklch(${L.toFixed(2)}% ${(C / 100).toFixed(4)} ${norm360(h).toFixed(1)})`; },
    from: (v) => { const m = nums(v, 3); return m ? fromLCh([m[0], m[1] * 100, m[2]]) : null; } },
};
$('colorfmt').onchange = (e) => {
  S.cfmt = e.target.value;
  $('hex').placeholder = COLORFMT[S.cfmt].hint;
  sync();
};

// ─── objectives and gradient stepping ────────────────────────────────────────
// The decision variables are always the control points. In continuous mode the
// objective is a functional of the CURVE they generate, so the gradient flows
// back through the spline for free — no separate "trajectory" path is needed.

const curveOf = (pts) => (pts.length >= 2 ? spline(pts.map((p) => toSpace(p)), PER_SPAN).map((c) => fromSpace(c)) : pts);

/**
 * Everything a term needs, built once per candidate point set. The spline is by
 * far the most expensive part of an objective evaluation and every term used to
 * rebuild it independently — which cost little with one term and a great deal
 * once a combined step evaluates nine of them at each of 6n perturbations.
 */
function ctxOf(pts) {
  const curve = curveOf(pts);
  const continuous = S.mode === 'continuous' && pts.length >= 2;
  return { pts, curve, pal: continuous ? resample(curve, pts.length, M()) : pts, probe: continuous ? curve : pts };
}
/** perceived chord — the cheap version of `delta` for use inside a gradient */
const pd = (a, b, g) => perceive(segLength(a, b, g));

/**
 * The observers the discrimination terms answer to. Choosing a deficiency in
 * the Vision panel narrows them to that observer at that severity; choosing
 * none means all three, so the default stays the conservative reading rather
 * than quietly optimising for normal vision alone.
 *
 * Only the terms about telling two colours APART take a view. Arc length,
 * bounds, monotonicity, gamut and planes are about where a colour sits, not how
 * well it is distinguished, and stay in the chart where they were defined.
 */
const primary = () => (S.cvd === 'none' ? NORMAL : view);
const criteria = () => (S.cvd === 'none' ? ALL_VIEWS : [NORMAL, view]);
const observer = () => (S.cvd === 'none' ? 'normal' : `${S.cvd} ${S.sev.toFixed(1)}`);

/**
 * Repulsion, not min-separation: a min over pairs is not differentiable, and a
 * gradient can only ever see the single closest pair. Summed inverse distance
 * feels every pair at once, and because it is measured with the PERCEIVED
 * distance, diminishing returns do the right thing on their own — far pairs
 * saturate and contribute almost nothing, so the step spends itself separating
 * the colours that are actually confusable.
 */
function repulsion(P, views) {
  const g = M();
  let e = 0;
  for (const v of views)
    for (let i = 0; i < P.length; i++)
      for (let j = i + 1; j < P.length; j++) e += 1 / Math.max(0.5, pd(v(P[i]), v(P[j]), g));
  return e;                                        // the floor keeps coincident colours finite
}

const LK = 9;                                    // knots in the editable profile

/**
 * Hue is a circle, so the profile keeps its knots in [0, 360) and puts the wrap
 * in the RULES rather than in the values.
 *
 * Storing unwrapped angles was the wrong call: an unwrapped run has an
 * arbitrary multiple of 360 in it that nothing pins down, so re-deriving it
 * each frame let it flip between turns as the palette moved, and the axis
 * flip-flopped with it. Normalised knots have exactly one representation.
 *
 * The wrap then lives in three rules. Between adjacent knots, interpolate the
 * SHORT way. Compare by shortest signed difference, so 359° and 1° are two
 * degrees apart. And when a segment crosses the seam, draw it leaving one edge
 * and re-entering the other. Nothing anywhere holds a number outside [0, 360).
 *
 * The cost is that no single knot interval may turn more than 180°. With nine
 * knots that still allows a 1440° sweep end to end, against the ~290° of the
 * widest real colormap, so it costs nothing that exists.
 */
const norm360 = (h) => ((h % 360) + 360) % 360;
const angDiff = (a, b) => { let d = (a - b) % 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
/** total signed turn of a hue run, from steps that are each unambiguous */
const totalTurn = (hs) => hs.slice(1).reduce((t, h, i) => t + angDiff(h, hs[i]), 0);
/** target hue at t, taking the short way between adjacent knots */
const hprofAt = (t) => {
  const x = Math.min(1, Math.max(0, t)) * (LK - 1), i = Math.min(LK - 2, Math.floor(x)), f = x - i;
  return norm360(S.hprof[i] + angDiff(S.hprof[i + 1], S.hprof[i]) * f);
};

/** target lightness at position t along the ramp, piecewise linear between knots */
const lprofAt = (t) => {
  const x = Math.min(1, Math.max(0, t)) * (LK - 1), i = Math.min(LK - 2, Math.floor(x)), f = x - i;
  return S.lprof[i] * (1 - f) + S.lprof[i + 1] * f;
};
/**
 * The lightness the waypoints actually span — the extremes over ALL of them,
 * not just the two ends. A ramp whose middle overshoots its endpoints would
 * otherwise get a target that cannot reach where it already goes, and the
 * profile term would spend itself pulling the overshoot back in.
 */
const lprofRange = () => {
  if (S.pts.length < 2) return [20, 90];
  const Ls = S.pts.map((p) => p[0]);
  return [Math.min(...Ls), Math.max(...Ls)];
};

/** target ← a straight line spanning that range, in the direction the ramp runs */
const lprofLine = () => {
  const [lo, hi] = lprofRange();
  const down = S.pts.length >= 2 && S.pts[0][0] > S.pts[S.pts.length - 1][0];
  const [a, b] = down ? [hi, lo] : [lo, hi];
  S.lprof = Array.from({ length: LK }, (_, i) => a + ((b - a) * i) / (LK - 1));
};
/**
 * target ← a tent: both ends at the darker endpoint, the middle at the lighter.
 * This is the shape a DIVERGING map wants — two hues meeting at a light centre,
 * so lightness has to rise and fall rather than climb. A straight line cannot
 * express it, and neither could the old monotonicity term, which is the other
 * reason that one had to become a drawn profile.
 */
const lprofArch = () => {
  const [lo, hi] = lprofRange();
  const mid = (LK - 1) / 2;
  S.lprof = Array.from({ length: LK }, (_, i) => lo + (hi - lo) * (1 - Math.abs(i - mid) / mid));
};

/** target ← whatever the ramp is doing right now, as a starting point to edit */
const lprofFit = () => {
  const P = S.pts.length >= 2 ? resample(curve(), LK, M()) : [];
  if (P.length === LK) S.lprof = P.map((p) => p[0]);
};

const hprofFit = () => {
  const P = S.pts.length >= 2 ? resample(curve(), LK, M()) : [];
  if (P.length === LK) S.hprof = P.map(hueOf).map(norm360);
};
/**
 * A steady turn. The direction has to come from the whole measured run, not
 * from its two ends: magma's ends are 264° and 109°, whose short way is −155°,
 * while the ramp actually turns +205° through zero. Summing the small steps
 * recovers the true turn, and only then is it spread evenly and normalised.
 */
const hprofSweep = () => {
  hprofFit();
  const turn = totalTurn(S.hprof), a = S.hprof[0];
  S.hprof = Array.from({ length: LK }, (_, i) => norm360(a + (turn * i) / (LK - 1)));
};
/** two plateaus meeting in the middle — what a diverging map's hue actually does */
const hprofSplit = () => {
  hprofFit();
  const a = S.hprof[0], b = S.hprof[LK - 1], mid = (LK - 1) / 2;
  S.hprof = Array.from({ length: LK }, (_, i) =>
    norm360(i < mid ? a : i > mid ? b : a + angDiff(b, a) / 2));
};

/** one line per term, shown under the table while its ? is hovered */
const HELP = {
  rep:      "Spread swatches apart, as the selected observer sees them.",
  repcvd:   "Spread them apart for every observer at once.",
  arc:      "Total length of the trajectory. Descend to shorten it.",
  lramp:    "Distance from the profile drawn in the plot below.",
  chroma:   "Distance from the middle of the chroma band.",
  hprof:    "Distance from the hue profile drawn in the plot below.",
  space:    "Control points bunched or unevenly spaced.",
  unif:     "Unevenness of the perceived steps between swatches.",
};

const hinge = (v) => (v > 0 ? v : 0);

/**
 * Halfplanes are placed in the ACTIVE SPACE's coordinates — an axis-aligned cut
 * in CIELAB is a different constraint from the same cut in sRGB, which is free
 * generality from the space selector. The bounds below are the opposite choice:
 * they are read off the CHART, because "lightness" and "chroma" should mean the
 * perceptual ones no matter which coordinates you happen to be looking at.
 */
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const planePenalty = (p) => {
  if (!S.planes.length) return 0;
  const c = toSpace(p);
  return S.planes.reduce((a, pl) => a + hinge(dot3(pl.n, c) - pl.d) ** 2, 0);
};

const OBJ = [
  { key: 'rep', label: () => `repulsion · ${observer()}`, f: (x) => repulsion(x.pal, [primary()]) },
  { key: 'repcvd', label: () => `repulsion · ${S.cvd === 'none' ? 'all' : '+' + S.cvd}`,
    f: (x) => repulsion(x.pal, criteria()) },
  { key: 'arc', label: 'arc length', mode: 'continuous', f: (x) => arcLength(x.curve, M()) },
  /**
   * Perceptual uniformity: equal perceived steps between consecutive swatches.
   * Measured with the CHART metric, deliberately, not the active space's — the
   * question is whether the ramp is perceptually even, not whether it is even
   * in whatever coordinates you happen to be viewing. So this reads non-zero
   * exactly when resampling in a non-perceptual space has bunched the steps,
   * and when curvature makes chords shorter than the arcs they subtend.
   */
  /**
   * Distance from the lightness profile drawn in the plot. Lightness against
   * position is the one curve these colormaps are really designed around —
   * turbo's is a deliberate arc rather than a line — so it is the one curve
   * worth being able to draw by hand and hand to the solver.
   *
   * This subsumes a separate monotonicity term: draw a profile that only rises
   * and matching it enforces monotonicity, and it does so with a target for
   * every position rather than merely a sign constraint on each step. A ramp
   * can be monotone and still stall and lurch; it cannot do that and track a
   * drawn line. Which is why there is no `lightness monotone` any more.
   */
  { key: 'lramp', label: 'lightness profile', bad: true, mode: 'continuous',
    f: (x) => {
      const P = x.pal, n = P.length;
      if (n < 2) return 0;
      return P.reduce((e, p, i) => e + (p[0] - lprofAt(i / (n - 1))) ** 2, 0) / n;
    } },
  /**
   * Chroma aims at the middle of the band rather than climbing as high as the
   * gamut allows. Maximising was measurably the wrong prior: viridis's chroma
   * DIPS through the middle of the ramp (14→8→19) while a maximiser pushes it
   * up (14→22→19). A target plus the gamut penalty reproduces a dip or an arc
   * on its own, because the reachable chroma varies with lightness and hue —
   * the profile falls out of the constraint rather than being asked for.
   */
  { key: 'chroma', label: 'chroma target',
    f: (x) => {
      const t = (S.lo[1] + S.hi[1]) / 2;
      return x.pal.reduce((e, p) => e + (Math.hypot(p[1], p[2]) - t) ** 2, 0) / x.pal.length;
    } },
  /**
   * Distance from the hue profile drawn in the plot, chroma-weighted so it is a
   * distance in the chart rather than an angle — being 40° off matters at chroma
   * 20 and not at chroma 2, where hue is not a real quantity. Compared by
   * shortest signed difference, so the seam at 0° costs nothing.
   */
  { key: 'hprof', label: 'hue profile', bad: true, mode: 'continuous',
    f: (x) => {
      const P = x.pal, n = P.length;
      if (n < 2 || !S.hprof.length) return 0;
      let e = 0;
      for (let i = 0; i < n; i++) {
        const c = Math.hypot(P[i][1], P[i][2]);
        if (c < 1) continue;                          // no meaningful hue to chase
        e += ((c * angDiff(hueOf(P[i]), hprofAt(i / (n - 1))) * Math.PI) / 180) ** 2;
      }
      return e / n;
    } },
  /**
   * Keeps consecutive control points evenly spaced, and repels them apart when
   * they bunch. Σ(d̄/dᵢ) − n, not the variance of the segment lengths: variance
   * is minimised by every segment being equal AND ZERO, so it would happily
   * collapse the whole trajectory onto a point. The ratio form is minimised at
   * even spacing by AM–HM, blows up as any single segment closes, and is scale
   * invariant — so it fights bunching without also fighting `arc length` over
   * how long the ramp should be. Zero exactly when the waypoints are even.
   *
   * ponytail: scale invariance cuts both ways. It cannot see a UNIFORM collapse
   * — every segment shrinking together leaves the ratios at 1 and the term at
   * zero — so the overall scale has to be held by something else: pinned
   * endpoints, or simply not descending arc length. It stops relative bunching,
   * which is the failure this term exists for, and nothing more.
   */
  { key: 'space', label: 'waypoint spacing', mode: 'continuous',
    f: (x) => {
      const P = x.pts, n = P.length - 1;
      if (n < 2) return 0;
      const g = M(), d = [];
      for (let i = 0; i < n; i++) d.push(Math.max(0.05, segLength(P[i], P[i + 1], g)));
      const mean = d.reduce((a2, b) => a2 + b, 0) / n;
      return d.reduce((a2, b) => a2 + mean / b, 0) - n;
    } },
  { key: 'unif', label: 'uniformity', bad: true,
    f: (x) => {
      const P = x.pal, v = primary();
      if (P.length < 3) return 0;
      const d = [];
      for (let i = 1; i < P.length; i++) d.push(pd(v(P[i - 1]), v(P[i]), EUCLIDEAN));
      const m = d.reduce((a, b) => a + b, 0) / d.length;
      return d.reduce((a, b) => a + (b - m) ** 2, 0) / d.length;
    } },
];

/** Terms included in the combined step. Constraints on, shaping opt-in. */
S.on = Object.fromEntries(OBJ.map((o) => [o.key, o.key !== 'rep']));
/** Relative pull of each term in the combined step. */
S.w = Object.fromEntries(OBJ.map((o) => [o.key, 1]));

const STEP_MAX = 4;        // chart units moved by the largest component at rate 1

/**
 * Central differences over the 3n control coordinates, for several terms at
 * once. Each perturbation builds ONE context and every term reads it, so a
 * combined step costs barely more than a single-term one.
 *
 * Each term's gradient is normalised to unit max and then scaled by its weight
 * before the terms are summed. The normalisation is deliberate and this is not
 * the gradient of Σ wᵢfᵢ: these objectives span four orders of magnitude, so an
 * honest sum is simply the plane-cost gradient with rounding noise attached.
 * Normalising first puts every term on the same footing; the weight then says
 * how hard each one pulls, in units anyone can reason about — weight 2 against
 * weight 1 is twice the pull, whatever the term happens to measure in.
 *
 * A pinned endpoint is a variable removed from the problem, not a move undone
 * afterwards: its gradient is never formed, so it cannot skew the normalisation
 * that sets the step size for everything else.
 */
function gradientOf(terms) {
  const base = S.pts.map((p) => [...p]);
  const h = 0.25;
  // gated on the mode too, so a hidden checkbox cannot quietly hold points still
  const pinned = (i) => S.pinEnds && S.mode === 'continuous' && base.length > 1 && (i === 0 || i === base.length - 1);
  const per = terms.map(() => base.map(() => [0, 0, 0]));
  for (let i = 0; i < base.length; i++) {
    if (pinned(i)) continue;
    for (let k = 0; k < 3; k++) {
      const lo = base.map((q) => [...q]), hi = base.map((q) => [...q]);
      lo[i][k] -= h; hi[i][k] += h;
      const [cl, ch] = [ctxOf(lo), ctxOf(hi)];
      terms.forEach((t, m) => { per[m][i][k] = (t.f(ch) - t.f(cl)) / (2 * h); });
    }
  }
  const total = base.map(() => [0, 0, 0]);
  per.forEach((g, m) => {
    const mx = Math.max(...g.flat().map(Math.abs));
    if (!Number.isFinite(mx) || mx === 0) return;            // flat term: no opinion
    const w = S.w[terms[m].key] / mx;
    g.forEach((row, i) => row.forEach((v, k) => { total[i][k] += v * w; }));
  });
  return { base, total };
}

/** dir +1 descends, -1 ascends. */
function stepBy(terms, dir) {
  if (!terms.length || !S.pts.length) return;
  const { base, total } = gradientOf(terms);
  const mx = Math.max(...total.flat().map(Math.abs));
  if (!Number.isFinite(mx) || mx === 0) return;              // nothing to do
  const scale = (dir * S.rate * STEP_MAX) / mx;
  S.pts = base.map((p, i) => p.map((v, k) => v - scale * total[i][k]));
  if (S.lock && S.pts[S.sel?.i]) setSlices(S.pts[S.sel.i]);
  sync();
}

const stepAlong = (obj, dir) => stepBy([obj], dir);

/**
 * Adam over the control points. `gradientOf` already returns the weighted sum
 * of unit-normalised term gradients, so what Adam adds on top is per-coordinate
 * step sizing — which is precisely what the fixed-rate stepper lacked: a heavily
 * weighted term used to bulldoze the others, because every coordinate moved by
 * the same amount regardless of how confident the gradient was there.
 *
 * Moments are reset whenever the problem changes shape under them (a point
 * added or removed), since a stale moment for a coordinate that no longer means
 * the same thing is worse than no moment at all.
 */
const ADAM = { b1: 0.9, b2: 0.999, eps: 1e-8, lr: 1.2 };
let adam = null;
const adamReset = () => { adam = { m: S.pts.map(() => [0, 0, 0]), v: S.pts.map(() => [0, 0, 0]), t: 0 }; };

function adamStep() {
  const terms = activeTerms();
  if (!terms.length || !S.pts.length) return false;
  if (!adam || adam.m.length !== S.pts.length) adamReset();
  const { base, total } = gradientOf(terms);
  adam.t++;
  const lr = S.rate * ADAM.lr;
  let moved = 0;
  S.pts = base.map((p, i) => p.map((val, k) => {
    const g = total[i][k];
    adam.m[i][k] = ADAM.b1 * adam.m[i][k] + (1 - ADAM.b1) * g;
    adam.v[i][k] = ADAM.b2 * adam.v[i][k] + (1 - ADAM.b2) * g * g;
    const mh = adam.m[i][k] / (1 - ADAM.b1 ** adam.t);
    const vh = adam.v[i][k] / (1 - ADAM.b2 ** adam.t);
    const d = (lr * mh) / (Math.sqrt(vh) + ADAM.eps);
    moved = Math.max(moved, Math.abs(d));
    return val - d;
  }));
  return moved;
}

let running = false, tick = 0;
function solve() {
  if (!running) return;
  const moved = adamStep();
  // the sidebar rebuilds its whole table and re-evaluates every term, which is
  // far too much to do at solver rate; the views stay live, the numbers lag
  sync({ light: ++tick % 8 !== 0 });
  if (moved === false) return stopSolver();
  requestAnimationFrame(solve);
}
function startSolver() {
  if (running) return;
  running = true; tick = 0; adamReset();
  $('run').textContent = 'stop'; $('run').style.background = '#6c3030';
  requestAnimationFrame(solve);
}
function stopSolver() {
  running = false;
  $('run').textContent = 'run Adam'; $('run').style.background = '';
  sync();
}
const activeTerms = () => OBJ.filter((o) => S.on[o.key] && S.w[o.key] > 0 && (!o.mode || o.mode === S.mode));

// ─── lightness plot: what the ramp does, and what you want it to do ─────────
const LPAD = { l: 26, r: 10, t: 10, b: 15 };

/**
 * The two profiles, side by side. They were one canvas with a toggle, which
 * made them look like alternatives — but a ramp has a lightness shape AND a
 * hue shape at the same time, and you edit one against the other. The axes are
 * fixed at 0..100 and 0..360, never derived from the data: an axis that fits
 * itself means dragging a knot up grows the range, so the next pixel is worth
 * more than the last and the knot runs away from the cursor.
 */
const PLOTS = {
  L: { key: 'lprof', term: 'lramp', lo: 0, hi: 100, ticks: [0, 50, 100], hue: false,
       meas: (P) => P.map((p) => p[0]),
       clamp: (v) => Math.min(100, Math.max(0, v)),          // lightness has ends
       fit: lprofFit, p1: lprofLine, p2: lprofArch, labels: ['line', 'arch'],
       tips: ['a straight ramp over the waypoints’ lightness range · double-click to reverse it',
              'a tent, dark ends and light middle, for a diverging ramp · double-click for a dark middle'] },
  H: { key: 'hprof', term: 'hprof', lo: 0, hi: 360, ticks: [0, 90, 180, 270, 360], hue: true,
       meas: (P) => P.map(hueOf).map(norm360),
       clamp: norm360,                                       // hue does not, so it wraps
       fit: hprofFit, p1: hprofSweep, p2: hprofSplit, labels: ['sweep', 'split'],
       tips: ['a steady turn from the first hue to the last · double-click to turn the other way',
              'two hue plateaus meeting in the middle, for a diverging ramp'] },
};
for (const [id, p] of Object.entries(PLOTS)) {
  p.root = document.querySelector(`.pplot[data-plot=${id}]`);
  p.el = p.root.querySelector('canvas');
  p.ctx = p.el.getContext('2d');
  p.prof = () => S[p.key];
}
const PLOTLIST = Object.values(PLOTS);

const lpx = (p, t) => LPAD.l + t * (p.el.clientWidth - LPAD.l - LPAD.r);
const lpy = (p, v) => p.el.clientHeight - LPAD.b - ((v - p.lo) / (p.hi - p.lo)) * (p.el.clientHeight - LPAD.t - LPAD.b);
const lpt = (p, x) => (x - LPAD.l) / (p.el.clientWidth - LPAD.l - LPAD.r);
const lpv = (p, y) => p.lo + ((p.el.clientHeight - LPAD.b - y) / (p.el.clientHeight - LPAD.t - LPAD.b)) * (p.hi - p.lo);

function layoutPlot() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  for (const p of PLOTLIST) {
    const w = Math.max(1, Math.round(p.el.clientWidth * dpr));
    const h = Math.max(1, Math.round(p.el.clientHeight * dpr));
    if (p.el.width === w && p.el.height === h) continue;   // assigning either one wipes the canvas
    p.el.width = w; p.el.height = h;
    p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // the wipe means the redraw has to live here rather than at the call site:
    // the resize observer fires after the last draw, and so does un-hiding
    if (p.prof().length) drawPlot(p);
  }
}

const drawPlots = () => PLOTLIST.forEach(drawPlot);

function drawPlot(p) {
  const ctx = p.ctx, W = p.el.clientWidth, H = p.el.clientHeight;
  if (!W || !H || !p.prof().length) return;
  const hud = getComputedStyle(document.documentElement).getPropertyValue('--hud').trim() || '#3a3a42';
  const P = palette();
  const meas = P.length >= 2 ? p.meas(P) : [];

  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = hud; ctx.globalAlpha = 0.28; ctx.lineWidth = 1;
  ctx.font = '9px ui-monospace,monospace'; ctx.fillStyle = hud;
  for (const v of p.ticks) {
    ctx.beginPath(); ctx.moveTo(LPAD.l, lpy(p, v)); ctx.lineTo(W - LPAD.r, lpy(p, v)); ctx.stroke();
    ctx.globalAlpha = 0.75;
    ctx.fillText(String(v).padStart(3), 2, lpy(p, v) + 3);
    ctx.globalAlpha = 0.28;
  }
  ctx.globalAlpha = 1;

  /**
   * A polyline on a circle. Where the short way between two samples crosses the
   * seam the segment is split, leaving one edge and re-entering the other,
   * instead of being drawn as a full-height plunge across a discontinuity that
   * is not really there.
   */
  const wrapped = (vals, paint) => {
    for (let i = 1; i < vals.length; i++) {
      const [a, b] = [vals[i - 1], vals[i]];
      const x0 = lpx(p, (i - 1) / (vals.length - 1)), x1 = lpx(p, i / (vals.length - 1));
      const d = p.hue ? angDiff(b, a) : b - a;
      if (!p.hue || Math.abs(a + d - b) < 1e-9) { paint(x0, a, x1, b, i); continue; }
      const edge = d > 0 ? 360 : 0;
      const xm = x0 + (x1 - x0) * ((edge - a) / d);
      paint(x0, a, xm, edge, i);
      paint(xm, 360 - edge, x1, b, i);
    }
  };

  if (meas.length >= 2) {
    ctx.lineCap = 'round';
    wrapped(meas, (x0, a, x1, b, i) => {
      ctx.beginPath(); ctx.moveTo(x0, lpy(p, a)); ctx.lineTo(x1, lpy(p, b));
      ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.stroke();
      ctx.strokeStyle = out(P[i]); ctx.lineWidth = 3.5; ctx.stroke();
    });
  }
  const prof = p.prof();
  ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.strokeStyle = hud;
  wrapped(prof, (x0, a, x1, b) => {
    ctx.beginPath(); ctx.moveTo(x0, lpy(p, a)); ctx.lineTo(x1, lpy(p, b)); ctx.stroke();
  });
  ctx.setLineDash([]);
  prof.forEach((v, i) => {
    ctx.beginPath(); ctx.arc(lpx(p, i / (LK - 1)), lpy(p, v), 3.6, 0, 7);
    ctx.fillStyle = hud; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.stroke();
  });
}

let lDrag = null;
for (const p of PLOTLIST) {
  const at = (e) => { const r = p.el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  p.el.addEventListener('pointerdown', (e) => {
    const [x, y] = at(e);
    lDrag = { p, i: Math.min(LK - 1, Math.max(0, Math.round(lpt(p, x) * (LK - 1)))) };  // nearest knot
    p.el.setPointerCapture(e.pointerId);
    p.prof()[lDrag.i] = p.clamp(lpv(p, y));
    sidebar();
  });
  p.el.addEventListener('pointermove', (e) => {
    if (lDrag?.p !== p) return;
    p.prof()[lDrag.i] = p.clamp(lpv(p, at(e)[1]));   // to the visible window, no further
    sidebar();
  });
  p.el.addEventListener('pointerup', () => { lDrag = null; });
}

/** Each plot's checkbox is the same flag as its row in Metrics, so both are
 *  written from S rather than from each other. */
function paintPlotButtons() {
  for (const p of PLOTLIST) {
    p.root.querySelector('[data-on]').checked = !!S.on[p.term];
    ['p1', 'p2'].forEach((k, i) => {
      const b = p.root.querySelector(`[data-p=${k}]`);
      b.textContent = p.labels[i]; b.title = p.tips[i];
    });
  }
}

const plotOf = (e) => PLOTS[e.target.closest('.pplot')?.dataset.plot];
$('lplot').onclick = (e) => {
  const p = plotOf(e), { on, p: act } = e.target.dataset ?? {};
  if (!p) return;
  if (on) S.on[on] = e.target.checked;
  else if (act) p[act]();
  else return;
  sidebar();
};
/**
 * Double-click flips the profile. The click pair has already laid down the
 * natural one by the time this fires, so it only has to invert what is there.
 *
 * How to invert depends on the shape, and reversing is not always it: a tent
 * reversed is the same tent. So a symmetric profile is mirrored in lightness
 * instead, turning a light-centred diverging ramp into a dark-centred one,
 * while an asymmetric one is reversed, turning dark-to-light into light-to-dark.
 */
$('lplot').ondblclick = (e) => {
  const p = plotOf(e), act = e.target.dataset?.p;
  if (!p || (act !== 'p1' && act !== 'p2')) return;
  const prof = p.prof();
  if (p.hue) {
    S.hprof = prof.slice().reverse();      // a hue sweep flips by running backwards
  } else {
    const [lo, hi] = [Math.min(...prof), Math.max(...prof)];
    const symmetric = prof.every((v, i) => Math.abs(v - prof[LK - 1 - i]) < 1e-9);
    S.lprof = symmetric ? prof.map((v) => lo + hi - v) : prof.slice().reverse();
  }
  sidebar();
};

/** The backdrop drives the HUD and outline colours too — a light surround with
 *  light labels on it is unreadable. Contrast is decided by the backdrop's own
 *  lightness in the chart, which is the one perceptual number we already have. */
function applyBg() {
  renderer.setClearColor(new T.Color(S.bg), 1);
  const light = fromHex(S.bg)[0] > 55;
  document.documentElement.style.setProperty('--hud', light ? '#3a3a42' : '#c6c6d0');
  slices.forEach((s) => s.edge.material.color.set(light ? 0x3a3a42 : 0xc6c6d0));
  drawPlots();
}

/** Slices track the node you touched, so every panel is cut through it. */
function setSlices(p) {
  const c = toSpace(p);
  S.slice = c.map((v, k) => Math.min(FRAME.hi[k], Math.max(FRAME.lo[k], v)));
  ['sL', 'sA', 'sB'].forEach((id, k) => ($(id).value = S.slice[k]));
  [$('vL'), $('vA'), $('vB')].forEach((el, k) => (el.textContent = S.slice[k].toFixed(0)));
}

function select(sel) {
  S.sel = sel;
  const p = sel?.kind === 'pt' ? S.pts[sel.i] : sel?.kind?.startsWith('obs') ? S.obs[sel.i]?.c : null;
  if (p && S.lock) setSlices(p);
}

/**
 * The feasibility constraint, applied where state becomes geometry. Every path
 * that writes a node — drag, hex field, preset load, gradient step,
 * gamut switch — already routes through sync(), so projecting here makes an
 * out-of-gamut node impossible rather than merely unlikely.
 *
 * toGamut bisects chroma at fixed lightness, so this is NOT the Euclidean
 * nearest feasible point; it is the nearest one of the same hue and lightness,
 * which is the projection worth having for colour. Paired with the gradient
 * buttons it makes those steps ordinary projected gradient descent.
 *
 * Note this constrains the NODES. A spline through feasible nodes can still
 * bulge outside — the gamut solid is not convex — which is why the gamut
 * penalty term still has work to do on the curve samples.
 */
const constrain = () => { S.pts = S.pts.map(feasify); };

// ─── the feasible set ────────────────────────────────────────────────────────
// The gamut, the lightness and chroma bands, the hue arc, the keep-out spheres
// and the halfplanes. These describe a feasible set rather than a preference,
// so they are enforced by projection rather than weighted against the rest: a
// palette outside them is not a worse palette, it is not a palette.

/** how far outside the feasible set, in chart units; 0 means feasible */
function infeasibility(q) {
  const c = Math.hypot(q[1], q[2]);
  return Math.max(
    inGamut(q) ? 0 : 1,
    hinge(S.lo[0] - q[0]), hinge(q[0] - S.hi[0]),
    hinge(S.lo[1] - c), hinge(c - S.hi[1]),
    (c * hueGap(q) * Math.PI) / 180,
    Math.sqrt(obstaclePenalty(q, S.obs, M(), primary())),
    Math.sqrt(planePenalty(q)));
}

const clampL = ([L, a, b]) => [Math.min(S.hi[0], Math.max(S.lo[0], L)), a, b];

const clampC = ([L, a, b]) => {
  const c = Math.hypot(a, b), t = Math.min(S.hi[1], Math.max(S.lo[1], c));
  if (t === c) return [L, a, b];
  // at the neutral axis there is no hue to preserve, so leave along the middle
  // of the allowed arc — the one direction that cannot then violate the hue arc
  if (c < 1e-9) return fromLCh([L, t, S.hue[0] + norm360(S.hue[1] - S.hue[0]) / 2]);
  return [L, (a * t) / c, (b * t) / c];
};

const clampH = (q) => {
  const c = Math.hypot(q[1], q[2]);
  if (c < 1 || hueGap(q) === 0) return q;            // hue is not a real quantity near the axis
  const h = hueOf(q);
  return fromLCh([q[0], c, angGap(h, S.hue[0]) <= angGap(h, S.hue[1]) ? S.hue[0] : S.hue[1]]);
};

/** planes live in SPACE coords and n is unit, so this is the exact projection */
const clampPlanes = (q) => {
  if (!S.planes.length) return q;
  let c = toSpace(q);
  for (const pl of S.planes) {
    const v = dot3(pl.n, c) - pl.d;
    if (v > 0) c = c.map((x, j) => x - v * pl.n[j]);
  }
  return fromSpace(c);
};

/**
 * Out of every keep-out ball, along the ray from its centre. The ball is round
 * in PERCEIVED distance under the active metric and colour-vision view, which
 * is not a sphere in the chart, so the exit point is found by bisection rather
 * than by adding a radius. obstaclePenalty is (r - d)² when inside and 0 when
 * out, which is all the test this needs.
 */
function clampObs(q) {
  const g = M(), v = primary();
  for (const o of S.obs) {
    const inside = (x) => obstaclePenalty(x, [o], g, v) > 0;
    if (!inside(q)) continue;
    let u = [0, 1, 2].map((k) => q[k] - o.c[k]);
    let n = Math.hypot(...u);
    if (n < 1e-9) { u = [0, 1, 0]; n = 1; }          // dead centre: any direction will do
    u = u.map((x) => x / n);
    const at = (t) => o.c.map((cc, k) => cc + t * u[k]);
    let hi = Math.max(1e-3, unperceive(o.r));
    for (let k = 0; k < 40 && inside(at(hi)); k++) hi *= 1.6;
    let lo = 0;
    for (let k = 0; k < 30; k++) { const t = (lo + hi) / 2; inside(at(t)) ? (lo = t) : (hi = t); }
    q = at(hi);
  }
  return q;
}

/**
 * Nearest feasible node. The sets are not all convex — the gamut has the
 * blue-cyan concavity and a keep-out ball's complement never is — so this is
 * alternating projection rather than anything with a convergence proof: it
 * finds A feasible point near the input, which is what a projected gradient
 * step needs, not the metrically nearest one.
 *
 */
function feasify(p) {
  let q = toGamut(p);
  for (let it = 0; it < 12 && infeasibility(q) > 1e-4; it++)
    q = toGamut(clampObs(clampPlanes(clampH(clampC(clampL(q))))));
  return q;
}
/** hand edits make the accumulated moments meaningless */
const disturb = () => { if (adam) adam = null; };

/** Rebuild whatever the change touched. Small enough to be blunt about it. */
function sync({ colors = false, light = false } = {}) {
  constrain();
  slices.forEach(paintSlice);
  paintShell();
  buildTube(); buildPoints(); buildObstacles(); buildPlanes();
  if (!light) sidebar();
  noteEdit();
}

// ─── undo / redo ─────────────────────────────────────────────────────────────
const HIST = { past: [], future: [], last: null, timer: 0, depth: 60 };

/**
 * Debounced off sync() rather than called at each edit site. A drag syncs on
 * every pointermove and the solver syncs every frame, so committing per sync
 * would bury one real edit under hundreds of intermediate ones. Waiting for the
 * stream to stop instead collapses a drag into a single entry and a whole Adam
 * run into a single entry, which is what you want to step back through — and no
 * edit path has to remember to call anything.
 */
function commit() {
  const now = sceneJSON();
  if (now === HIST.last) return;
  if (HIST.last !== null && HIST.past.push(HIST.last) > HIST.depth) HIST.past.shift();
  HIST.last = now;
  HIST.future.length = 0;
  paintHist();
}
const noteEdit = () => { clearTimeout(HIST.timer); HIST.timer = setTimeout(commit, 400); };

function travel(from, to) {
  clearTimeout(HIST.timer);
  if (!from.length) return;

  + `<optgroup label="discrete">${Object.entries(PRESETS).filter(([, p]) => p.mode === 'discrete')
      .map(([k]) => `<option value="${k}">${k}</option>`).join('')}</optgroup>`;
buildShell();
shell.material.uniforms.uOpacity.value = S.shell; shell.visible = S.shell > 0;
select(S.sel);

lprofLine(); hprofFit(); mirror(); commit();
new ResizeObserver(layout).observe(main);   // catches sidebar and devtools resizes too
layout();
applyBg();
setView();
frame();
</script>
</html>
