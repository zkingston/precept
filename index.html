<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precept Palette Optimizer</title>
<style>
  :root { --bg:#101012; --panel:#1c1c1f; --line:#32323a; --fg:#e8e8ec; --dim:#8b8b96; --hot:#ff5b5b; --hud:#33333a; }
  * { box-sizing:border-box; }
  body { margin:0; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.45 ui-sans-serif,system-ui,sans-serif; }
  /* the row must be 1fr, not the implicit auto: a sidebar taller than the
     viewport would otherwise stretch the row and push the canvas off-screen */
  #app { display:grid; grid-template-columns:1fr 330px; grid-template-rows:1fr; height:100vh; }
  main, aside { min-height:0; }

  main { position:relative; min-width:0; }
  #gl { display:block; width:100%; height:100%; touch-action:none; }
  /* one canvas, four scissored viewports; the HUD is plain DOM on top */
  .quad { position:absolute; pointer-events:none; }
  .quad .tag { position:absolute; top:8px; left:10px; font:10px/1 ui-monospace,monospace; letter-spacing:.1em;
               text-transform:uppercase; color:var(--hud); }
  .quad .sl { position:absolute; top:10px; bottom:10px; right:9px; display:flex; flex-direction:column;
              align-items:center; gap:6px; pointer-events:auto; font:11px ui-monospace,monospace; color:var(--hud); }
  /* vertical range: writing-mode is the supported route now, and direction:rtl
     is what puts the minimum at the bottom rather than the top */
  .quad .sl input { flex:1; min-height:0; width:18px; accent-color:#5f8ba6;
                    writing-mode:vertical-lr; direction:rtl; }
  .quad .sl b { font-weight:400; text-align:center; }
  .quad .sl i { font-style:normal; }
  input[type=color] { width:34px; height:24px; padding:1px; background:#26262b;
                      border:1px solid var(--line); border-radius:4px; }
  input[type=checkbox] { accent-color:#5f8ba6; width:14px; height:14px; }
  /* no native dual range exists, so stack two: tracks inert, thumbs live */
  .dual { position:relative; flex:1; height:18px; min-width:0; }
  .dual::before { content:''; position:absolute; left:0; right:0; top:8px; height:3px; border-radius:2px; background:#3a3a42; }
  .dual .fill { position:absolute; left:0; right:0; top:8px; height:3px; border-radius:2px; }
  .dual input { position:absolute; inset:0; width:100%; height:18px; margin:0; background:none;
                pointer-events:none; -webkit-appearance:none; appearance:none; }
  .dual input::-webkit-slider-thumb { pointer-events:auto; -webkit-appearance:none; appearance:none;
    width:13px; height:13px; border-radius:50%; background:#7dd3fc; border:1px solid #1c1c1f; cursor:pointer; }
  .dual input::-moz-range-thumb { pointer-events:auto; width:13px; height:13px; border-radius:50%;
    background:#7dd3fc; border:1px solid #1c1c1f; cursor:pointer; }
  .dual input::-moz-range-track { background:none; }
  /* inline-flex, not flex: as a block it claimed the whole table cell and
     pushed the ? marker onto a line of its own */
  label.chk { display:inline-flex; align-items:center; gap:7px; cursor:pointer; vertical-align:middle; }
  #huewheel { cursor:crosshair; touch-action:none; }
  /* tools live over the viewport, where the things they make are */
  #tool { position:absolute; top:190px; right:12px; display:flex; gap:4px; }
  #tip { position:absolute; right:14px; top:12px; padding:7px;
         background:#1c1c20ee; border:1px solid var(--line); border-radius:6px; }
  #tipcanvas { display:block; border-radius:3px; width:264px; height:128px; }
  #tipbtns { display:flex; gap:4px; margin-top:6px; }
  #tipbtns button { flex:1; font-size:10px; padding:2px 0; }
  #tipbtns button[aria-pressed=true] { background:#3d5a6c; border-color:#5f8ba6; }
  #hist { position:absolute; top:190px; right:130px; display:flex; gap:4px; }
  #hist button:disabled { opacity:.3; cursor:default; }
  #tool button, #graybtn, #hist button { width:34px; height:34px; padding:0; display:grid; place-items:center;
    background:#26262bd9; border:1px solid var(--line); border-radius:5px; cursor:pointer;
    color:var(--fg); font-size:15px; line-height:1; }
  #tool button:hover, #graybtn:hover, #hist button:not(:disabled):hover { background:#32323ae6; }
  #tool button[aria-pressed=true], #graybtn[aria-pressed=true] { background:#3d5a6c; border-color:#5f8ba6; }
  #tool svg { width:19px; height:19px; fill:none; stroke:var(--fg); stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; }
  #lplot { position:absolute; bottom:14px; right:14px; height:126px; display:flex; gap:16px; }
  .pplot { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  /* the controls sit above the plot rather than beside it: inside, they landed
     exactly where the curve ends up once lightness rises to the right */
  .phead { display:flex; align-items:center; gap:6px; height:18px;
           font:10px ui-sans-serif,system-ui,sans-serif; color:var(--hud); }
  .phead .pbtns { margin-left:auto; display:flex; gap:3px; }
  .phead button { padding:1px 7px; font:10px ui-monospace,monospace; background:#26262bcc;
    color:var(--fg); border:1px solid var(--line); border-radius:3px; cursor:pointer; }
  .pcanvas { flex:1; min-height:0; width:100%; display:block; cursor:ns-resize; touch-action:none; }
  #toolnote { position:absolute; top:230px; right:12px; white-space:nowrap; text-align:right;
    font:11px/1.4 ui-sans-serif,system-ui,sans-serif; color:var(--hud); pointer-events:none; }
  #hex { flex:1; min-width:0; font:12px ui-monospace,monospace; text-transform:lowercase; }

  aside { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px;
          display:flex; flex-direction:column; gap:13px; }
  h1 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0; font-weight:600; }
  h2 { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:0 0 6px; font-weight:600; }
  section { border-top:1px solid var(--line); padding-top:11px; }
  section:first-of-type { border-top:0; padding-top:0; }

  .row { display:flex; align-items:center; gap:8px; }
  .row + .row { margin-top:6px; }
  label.f { flex:0 0 68px; color:var(--dim); }
  input[type=range] { flex:1; min-width:0; accent-color:#7dd3fc; }
  .v { width:32px; text-align:right; font-variant-numeric:tabular-nums; }
  select, button { background:#26262b; color:var(--fg); border:1px solid var(--line);
                             border-radius:4px; padding:4px 6px; font:inherit; }
  button { cursor:pointer; } button:hover { background:#32323a; }
  .seg { display:flex; } .seg button { border-radius:0; flex:1; }
  .seg button:first-child { border-radius:4px 0 0 4px; } .seg button:last-child { border-radius:0 4px 4px 0; }
  .seg button[aria-pressed=true] { background:#3d5a6c; border-color:#5f8ba6; }

  /* the output belongs next to the thing it came from, not in a side panel;
     it sits between the preview above and the profile plots below */
  #bar { position:absolute; right:14px; top:270px; bottom:154px; width:38px; min-height:130px;
         display:flex; flex-direction:column; align-items:center; gap:6px; }
  #strip { width:100%; flex:1; min-height:0; display:block; border-radius:5px; border:1px solid #0004; }
  #swatches { display:flex; flex-direction:column-reverse; gap:3px; width:100%; flex:1; min-height:0; }
  .sw { flex:1; width:100%; border-radius:3px; border:1px solid #0006; cursor:pointer; position:relative; }
  .sw[data-sel=true] { outline:2px solid #fff; outline-offset:1px; }
  .sw[data-bad=true]::after { content:'!'; position:absolute; inset:0; display:grid; place-items:center;
                              color:var(--hot); font-weight:700; text-shadow:0 0 3px #000; }

  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:2px 0; } td:first-child { color:var(--dim); } td:last-child { text-align:right; }
  td.warn { color:var(--hot); }
  #metrics td:nth-child(2) { white-space:nowrap; }
  .q { cursor:help; opacity:.4; margin-left:4px; font-size:10px; vertical-align:super; }
  .q:hover { opacity:1; color:#7dd3fc; }
  #termhelp { min-height:2.6em; margin-top:7px; padding-top:6px; border-top:1px solid var(--line); }
  #metrics td.w { width:40px; padding-left:4px; }
  #metrics input.w { width:38px; background:#26262b; color:var(--fg); border:1px solid var(--line);
    border-radius:3px; padding:1px 3px; font:11px ui-monospace,monospace; text-align:right;
    -moz-appearance:textfield; appearance:textfield; }
  #metrics input.w::-webkit-outer-spin-button, #metrics input.w::-webkit-inner-spin-button {
    -webkit-appearance:none; margin:0; }
  #metrics input.w:disabled { opacity:.3; }
  #metrics td.btns { width:52px; text-align:right; white-space:nowrap; padding-left:6px; }
  #metrics td.btns button { padding:0 5px; font:11px/1.5 ui-monospace,monospace; margin-left:3px; }
  code { color:#9fd; }
  .note { color:var(--dim); font-size:11px; }
</style>

<div id="app">
  <main>
    <canvas id="gl"></canvas>
    <div id="tip">
      <canvas id="tipcanvas" width="264" height="128"></canvas>
      <div id="tipbtns"></div>
    </div>
    <div id="hist">
      <button id="undo" title="undo · ctrl+Z">↶</button>
      <button id="redo" title="redo · ctrl+shift+Z">↷</button>
    </div>
    <div class="quad" id="q1">
      <div class="sl"><i id="nL">L</i><input type="range" id="sL" min="0" max="100" step="0.5" value="55"><b id="vL">55</b></div></div>
    <div class="quad" id="q2">
      <div class="sl"><i id="nA">a</i><input type="range" id="sA" min="-36" max="36" step="0.5" value="0"><b id="vA">0</b></div></div>
    <div class="quad" id="q3">
      <div class="sl"><i id="nB">b</i><input type="range" id="sB" min="-36" max="36" step="0.5" value="0"><b id="vB">0</b></div></div>
    <div class="quad" id="q0"><span class="tag">3D · orbit</span></div>
    <div id="tool">
      <button data-v="edit" title="Points"><svg viewBox="0 0 24 24">
        <polyline points="4,18 10,8 16,14 20,5"/><circle cx="4" cy="18" r="2.1"/>
        <circle cx="10" cy="8" r="2.1"/><circle cx="16" cy="14" r="2.1"/><circle cx="20" cy="5" r="2.1"/></svg></button>
      <button data-v="obstacle" title="Keep-out spheres"><svg viewBox="0 0 24 24">
        <circle cx="11" cy="13" r="7"/><path d="M11 13 L16 8"/><circle cx="16.6" cy="7.4" r="2.1"/></svg></button>
      <button data-v="plane" title="Halfplanes"><svg viewBox="0 0 24 24">
        <path d="M3 15 L12 10 L21 13 L12 18 Z"/><path d="M12 10 L12 3"/><circle cx="12" cy="3" r="1.9"/></svg></button>
    </div>
    <div id="toolnote"></div>
    <div id="lplot">
      <div class="pplot" data-plot="L">
        <div class="phead">
          <label class="chk"><input type="checkbox" data-on="lramp">lightness profile</label>
          <span class="pbtns"><button data-p="fit" title="target ← the ramp's current profile">fit</button>
            <button data-p="p1"></button><button data-p="p2"></button></span>
        </div><canvas class="pcanvas"></canvas>
      </div>
      <div class="pplot" data-plot="H">
        <div class="phead">
          <label class="chk"><input type="checkbox" data-on="hprof">hue profile</label>
          <span class="pbtns"><button data-p="fit" title="target ← the ramp's current profile">fit</button>
            <button data-p="p1"></button><button data-p="p2"></button></span>
        </div><canvas class="pcanvas"></canvas>
      </div>
    </div>
    <div id="bar">
      <button id="graybtn" title="show the output in grayscale">◐</button>
      <canvas id="strip" width="40" height="600"></canvas><div id="swatches"></div>
    </div>
  </main>

  <aside>
    <h1>Precept Palette Optimizer</h1>

    <section>
      <h2>Palette</h2>
      <div class="seg" id="mode"><button data-v="continuous">Continuous</button><button data-v="discrete">Discrete</button></div>
      <div class="row" style="margin-top:6px"><label class="f">load</label>
        <select id="preset" style="flex:1"></select></div>
    </section>

    <section>
      <h2>View</h2>
      <div class="row"><label class="f">space</label><select id="spacesel" style="flex:1"></select></div>
      <div class="row"><label class="f">gamut</label><select id="gamutsel" style="flex:1"></select></div>
      <div class="row"><label class="f">vision</label>
        <select id="cvd" style="flex:1">
          <option value="none">normal</option><option value="protan">protanopia</option>
          <option value="deutan">deuteranopia</option><option value="tritan">tritanopia</option></select></div>
      <div class="row"><label class="f">severity</label>
        <input type="range" id="sev" min="0" max="1" step="0.05" value="1"><span class="v" id="sevv">1.0</span></div>
      <div class="row"><label class="f">solid</label>
        <input type="range" id="shell" min="0" max="1" step="0.02" value="0.8"><span class="v" id="shellv">.80</span></div>
      <div class="row"><label class="f">slices</label>
        <input type="range" id="sliceop" min="0.1" max="1" step="0.05" value="0.8"><span class="v" id="sliceopv">.80</span></div>
      <div class="row"><label class="f">backdrop</label><input type="color" id="bg" value="#f0ead6"></div>
      <div class="row"><label class="chk"><input type="checkbox" id="planes3d">slice planes in 3D</label></div>
      <div class="row"><label class="chk"><input type="checkbox" id="lock">lock slices to node</label></div>
    </section>

    <section id="selpanel">
      <h2>Selection</h2>
      <div class="row"><select id="colorfmt" style="width:88px"></select>
        <input type="text" id="hex" spellcheck="false" style="flex:1;min-width:0"></div>
      <div class="row"><span id="selinfo" class="note"></span></div>
      <div class="row"><button id="flip" style="flex:1">flip the excluded side</button></div>
    </section>

    <section>
      <h2>Bounds</h2>
      <div class="row"><label class="f">lightness</label>
        <span class="dual" id="ldual"><span class="fill"></span>
          <input type="range" id="lmin" min="0" max="100" step="1" value="0">
          <input type="range" id="lmax" min="0" max="100" step="1" value="100"></span>
        <span class="v" style="width:56px" id="lboundv">0–100</span></div>
      <div class="row"><label class="f">chroma</label>
        <span class="dual" id="cdual"><span class="fill"></span>
          <input type="range" id="cmin" min="0" max="40" step="0.5" value="0">
          <input type="range" id="cmax" min="0" max="40" step="0.5" value="40"></span>
        <span class="v" style="width:56px" id="cboundv">0–40</span></div>
      <div class="row" style="align-items:flex-start"><label class="f" style="padding-top:44px">hue</label>
        <canvas id="huewheel" width="112" height="112" title="drag an edge of the arc · double-click for any hue"></canvas>
        <span class="v" style="width:56px;padding-top:44px" id="hboundv">any</span></div>
    </section>

    <section><h2>Metrics</h2><table id="metrics"></table>
      <div id="termhelp" class="note"></div>
      <div class="row" style="margin-top:8px"><label class="f">rate</label>
        <input type="range" id="rate" min="0" max="1" step="0.02" value="0.3"><span class="v" id="ratev">.30</span></div>
      <div class="row"><label class="chk"><input type="checkbox" id="pinends">lock endpoints</label></div>
      <div class="row"><button id="steptotal" style="flex:1">step once</button>
        <button id="run" style="flex:1">run Adam</button></div>
    </section>
    <section><h2>Export</h2>
      <div class="row"><label class="f">name</label>
        <input type="text" id="scenename" value="precept" style="flex:1;min-width:0"></div>
      <div class="row"><button id="savescene" style="flex:1">save scene</button>
        <button id="loadscene" style="flex:1">load scene</button>
        <input type="file" id="scenefile" accept=".json,application/json" hidden></div>
      <div class="row"><label class="f">format</label><select id="exportfmt" style="flex:1"></select></div>
      <div class="row"><button id="copypy" style="flex:1">copy</button>
        <button id="savepy" style="flex:1">save</button></div></section>
  </aside>
</div>

<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>

<script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import {
  fromHex, toHex, toSRGB, fromSRGB, fromLinear, toGamut, inGamut, toLCh, fromLCh,
  arcLength, segLength, perceive, unperceive, resample, spline,
  minSeparation, obstaclePenalty, simulate, NORMAL, ALL_VIEWS, EUCLIDEAN, params, GAMUTS, internals,
  SPACES, toSpace, fromSpace, spaceExtent, spaceMetric, CUBE_FACES,
} from './color-space.ts';

// We do every colour computation ourselves and hand three gamma-encoded sRGB
// directly, so switch three's colour management off rather than have it convert
// twice. Everything below is display-referred sRGB, start to finish.
T.ColorManagement.enabled = false;

const $ = (id) => document.getElementById(id);
const clamp01 = (v) => Math.min(1, Math.max(0, v));

const S = {
  mode: 'continuous', tool: 'edit', cvd: 'none', sev: 1, gray: false,
  shell: 0.8, sliceOp: 0.8, rad: 12, rate: 0.3, pinEnds: true,
  bg: '#f0ead6', lock: true, planes3d: false,
  fmt: 'matplotlib', cfmt: 'hex',                // export format, selection colour format
  tipKind: 'sineramp',                           // which test image is showing
  lprof: [],                                     // target lightness profile, evenly spaced along t
  hprof: [],                                     // target hue profile, UNWRAPPED degrees
  slice: [55, 0, 0],                             // cut planes along L, a, b
  pts: [],                                       // filled from PRESETS below
  obs: [],
  planes: [],                                    // {n, d} in SPACE coords; n·c > d is excluded
  lo: [0, 0], hi: [100, 40],                     // lightness and chroma bounds, in CHART units
  hue: [0, 360],                                 // allowed hue arc, degrees, counterclockwise lo→hi
  sel: null,                                     // {kind:'pt'|'obs'|'plane', i}
};
let view = NORMAL;

/**
 * space coords ↔ world. Axis 0 is vertical, 1 is x, 2 is z, and the box is
 * centred on the gamut's own middle. The scale is ONE number for all three
 * axes: fitting each axis separately would fill the panels better and quietly
 * lie about every distance in them. Isometric or nothing.
 */
let FRAME = null;
const world = (c) => new T.Vector3((c[1] - FRAME.mid[1]) * FRAME.s, (c[0] - FRAME.mid[0]) * FRAME.s, (c[2] - FRAME.mid[2]) * FRAME.s);
const unworld = (v) => [v.y / FRAME.s + FRAME.mid[0], v.x / FRAME.s + FRAME.mid[1], v.z / FRAME.s + FRAME.mid[2]];
const wpt = (p) => world(toSpace(p));            // chart point → world
const cpt = (v) => fromSpace(unworld(v));        // world → chart point

function reframe() {
  QUADS.slice(0, 3).forEach((q) => resetView(q.cam));   // new coordinates, new view
  const { lo, hi } = spaceExtent();
  const mid = lo.map((v, i) => (v + hi[i]) / 2);
  const half = lo.map((v, i) => Math.max(1e-6, (hi[i] - v) / 2));
  FRAME = { lo, hi, mid, half, s: Math.min(50 / half[0], 36 / half[1], 36 / half[2]) };
  const { s } = FRAME;
  [{ w: half[1], h: half[2] }, { w: half[2], h: half[0] }, { w: half[1], h: half[0] }]
    .forEach((c, k) => (QUADS[k].cam.userData.content = { w: c.w * s, h: c.h * s }));
  // panel k cuts along axis k, and its slider is the only thing left naming it
  const names = SPACES[params.space].axes;
  [['sL', 'nL'], ['sA', 'nA'], ['sB', 'nB']].forEach(([sid, nid], k) => {
    $(nid).textContent = names[k];
    const el = $(sid);
    // step=any, not a fraction of the range: a snapping slider cannot land on
    // its own max (500 steps of range/500 overshoots it in floating point, so
    // the top reachable value is one step short) and cannot agree with a state
    // set by anything but itself.
    el.min = lo[k]; el.max = hi[k]; el.step = 'any';
  });
}
const hueOf = (p) => ((Math.atan2(p[2], p[1]) * 180) / Math.PI + 360) % 360;
const angGap = (x, y) => { const t = Math.abs(x - y) % 360; return Math.min(t, 360 - t); };

/** Hue is a circle, so the allowed arc runs lo→hi counterclockwise and may wrap
 *  through 0°. Magma's corridor does exactly that, so a non-wrapping range
 *  would not have been able to express it. */
const inHueArc = (h) => {
  const [lo, hi] = S.hue;
  if (hi - lo >= 360 || (lo === 0 && hi === 360)) return true;
  return lo <= hi ? h >= lo && h <= hi : h >= lo || h <= hi;
};
/** degrees off the arc; zero for near-neutrals, whose hue is not a real angle */
const hueGap = (p) => {
  const c = Math.hypot(p[1], p[2]);
  if (c < 1) return 0;
  const h = hueOf(p);
  return inHueArc(h) ? 0 : Math.min(angGap(h, S.hue[0]), angGap(h, S.hue[1]));
};

/** on-screen appearance: gamut-map, then push through the colour-vision view */
const rgb = (p) => toSRGB(view(toGamut(p, 'srgb'))).map(clamp01);
const paint = (p) => `rgb(${rgb(p).map((c) => Math.round(255 * c)).join(' ')})`;
/**
 * What the output bar shows. Grayscale here is the neutral colour at the SAME
 * chart lightness, not a luma-weighted average of the channels — the question
 * it answers is "does this ramp still read once hue and chroma are gone", and
 * only the perceptual lightness axis answers that.
 */
const out = (p) => paint(S.gray ? [p[0], 0, 0] : p);

/**
 * Starting points. The colormaps are nine evenly spaced samples of matplotlib's
 * own 256-entry tables — enough control points for the spline to track the
 * original closely, few enough to actually edit. A starting position, not a
 * reproduction: the point is to have something real to pull on.
 */
const PER_SPAN = 24;                             // spline samples per control interval

/**
 * Where a new control point belongs. Appending is almost never what you meant:
 * click near the ribbon and you want the curve to pass through there, which is
 * an insertion between the two controls that already bracket that stretch;
 * click out in open space and you are extending the ramp, which is an insertion
 * at whichever END you clicked nearer. Blind append does the second badly and
 * the first not at all — it drags the tail of the curve across the solid.
 *
 * `spline` emits PER_SPAN samples per interval, so the index of the nearest
 * curve sample names the interval directly. No search over control points.
 */
function addPoint(p) {
  const d3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  if (S.mode !== 'continuous' || S.pts.length < 2) return S.pts.push(p) - 1;

  const c = curve();
  let best = 0, near = Infinity;
  c.forEach((q, i) => { const d = d3(p, q); if (d < near) { near = d; best = i; } });
  if (near <= 10) {                              // chart units: about a comfortable ΔE
    const at = Math.min(S.pts.length - 1, Math.floor(best / PER_SPAN) + 1);
    S.pts.splice(at, 0, p);
    return at;
  }
  if (d3(p, S.pts[0]) < d3(p, S.pts[S.pts.length - 1])) { S.pts.unshift(p); return 0; }
  return S.pts.push(p) - 1;
}

const PRESETS = {
  viridis:     { mode: 'continuous', hex: ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#27ad81', '#5cc863', '#aadc32', '#fde725'] },
  magma:       { mode: 'continuous', hex: ['#000004', '#1d1147', '#51127c', '#832681', '#b73779', '#e55064', '#fb8761', '#fec287', '#fcfdbf'] },
  inferno:     { mode: 'continuous', hex: ['#000004', '#210c4a', '#57106e', '#8a226a', '#bc3754', '#e35933', '#f98c0a', '#f9c932', '#fcffa4'] },
  plasma:      { mode: 'continuous', hex: ['#0d0887', '#4c02a1', '#7e03a8', '#aa2395', '#cc4778', '#e56b5d', '#f89441', '#fdc328', '#f0f921'] },
  cividis:     { mode: 'continuous', hex: ['#00224e', '#1a386f', '#434e6c', '#61656f', '#7d7c78', '#9a9376', '#bbad6d', '#ddc858', '#fee838'] },
  turbo:       { mode: 'continuous', hex: ['#30123b', '#466be3', '#28bceb', '#32f298', '#a4fc3c', '#ecd13a', '#fb8122', '#d23105', '#7a0403'] },
  'tab10':      { mode: 'discrete', hex: ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'] },
  'okabe-ito':  { mode: 'discrete', hex: ['#000000', '#e69f00', '#56b4e9', '#009e73', '#f0e442', '#0072b2', '#d55e00', '#cc79a7'] },
  'set2':       { mode: 'discrete', hex: ['#66c2a5', '#fc8d62', '#8da0cb', '#e78ac3', '#a6d854', '#ffd92f', '#e5c494', '#b3b3b3'] },
};

// Open on a real colormap rather than a placeholder ramp: every metric in the
// panel then reads against something whose values are known and worth knowing.
S.pts = PRESETS.viridis.hex.map(fromHex);

/** The metric of the space on screen, calibrated on the neutral axis. */
const M = () => spaceMetric();

// Interpolated in the space you are looking at, so a curve that reads straight
// in the sRGB panel IS straight there. Control points still live in the chart.
const curve = () => (S.pts.length >= 2 ? spline(S.pts.map((p) => toSpace(p)), PER_SPAN).map((c) => fromSpace(c)) : S.pts);
/** One swatch per control point: the count is a consequence of the trajectory,
 *  not a separate dial that could disagree with it. */
const palette = () => (S.mode === 'discrete' || S.pts.length < 2 ? S.pts : resample(curve(), S.pts.length, M()));

// ─── renderer, scene, four cameras ───────────────────────────────────────────
const canvas = $('gl'), main = canvas.parentElement, lplotEl = $('lplot');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.outputColorSpace = T.LinearSRGBColorSpace;   // pass our sRGB values straight through
renderer.setScissorTest(true);
const scene = new T.Scene();

const cam3 = new T.PerspectiveCamera(42, 1, 1, 3000);
cam3.position.set(96, 62, 118);
const controls = new OrbitControls(cam3, canvas);
controls.enableDamping = true;

/** Ortho views. The camera placements are picked so the on-screen axes read the
 *  way each panel's tag claims — the "down L" camera sits below the solid,
 *  which is what puts +a right and +b up. */
const ortho = (pos, up, halfW, halfH) => {
  const c = new T.OrthographicCamera(-1, 1, 1, -1, 1, 3000);
  c.position.set(...pos); c.up.set(...up); c.lookAt(0, 0, 0);
  c.userData.content = { w: halfW, h: halfH };   // what has to stay on screen
  c.userData.home = c.position.clone();
  return c;
};
// content extents here are placeholders; reframe() fits them to the space
/** per-panel view state; picking reads the camera matrices so it follows along */
const resetView = (c) => { c.zoom = 1; c.position.copy(c.userData.home); c.updateProjectionMatrix(); };
const camL = ortho([0, -900, 0], [0, 0, 1], 36, 36);
const camA = ortho([-900, 0, 0], [0, 1, 0], 36, 50);
const camB = ortho([0, 0, 900], [0, 1, 0], 36, 50);

// Layer 1 holds the gamut shell: only the 3D view enables it, or each slice
// panel would be looking at its own cross-section through a translucent solid.
cam3.layers.enable(1);
// Layer 3 carries the slice planes. Every ortho view wants them — its own plane
// face-on, the other two edge-on as crosshairs — while 3D toggles them.
for (const c of [camL, camA, camB]) c.layers.enable(3);
const QUADS = [
  { el: $('q1'), cam: camL, axis: 0 },
  { el: $('q2'), cam: camA, axis: 1 },
  { el: $('q3'), cam: camB, axis: 2 },
  { el: $('q0'), cam: cam3 },
];
reframe();                       // FRAME must exist before anything calls world()
S.slice = [...FRAME.mid];

// ─── the colour pipeline, shared by every shader below ─────────────────────
const SPACE_ID = { oklab: 0, cielab: 1, cieluv: 2, ipt: 3, xyz: 4, srgb: 5 };
const CVD_ID = { none: 0, protan: 1, deutan: 2, tritan: 3 };
const m3 = (rows) => new T.Matrix3().set(...rows.flat());   // .set takes row-major

// Everything from "a point in the working space" to "a colour on screen",
// shared verbatim by the slice planes and the gamut solid. The two differ only
// in how they arrive at that point: one interpolates uv across a cut plane, the
// other reads it off the surface it is drawing.
const COLOR_GLSL = `
precision highp float;
uniform int uSpace, uCvd, uHueAll;
uniform float uSev, uOpacity;
uniform vec3 uLo, uHi, uWhite, uIptW, uCvdN, uMid;
uniform float uScale;
uniform vec2 uLB, uCB, uHue;
uniform mat3 uLmsLab, uXyzLms, uLmsXyz, uLabLms;
uniform mat3 uIptOppI, uIptLmsI, uGamut, uLinSrgb, uXyzSrgb, uCvd1, uCvd2;

const float D = 6.0 / 29.0;
float labfi(float t) { return t > D ? t * t * t : 3.0 * D * D * (t - 4.0 / 29.0); }
float spow(float v, float e) { return sign(v) * pow(abs(v), e); }
vec3 cbrt3(vec3 v) { return vec3(spow(v.x, 1.0/3.0), spow(v.y, 1.0/3.0), spow(v.z, 1.0/3.0)); }
float dec(float c) { return c <= 0.04045 ? c / 12.92 : pow((c + 0.055) / 1.055, 2.4); }
float enc(float c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * spow(c, 1.0 / 2.4) - 0.055; }

vec3 spaceToXyz(vec3 c) {
  if (uSpace == 0) { vec3 l = uLmsLab * (c / 100.0); return uXyzLms * (l * l * l); }
  if (uSpace == 1) {
    float fy = (c.x + 16.0) / 116.0;
    return vec3(labfi(fy + c.y / 500.0), labfi(fy), labfi(fy - c.z / 200.0)) * uWhite;
  }
  if (uSpace == 2) {
    if (c.x <= 0.0) return vec3(0.0);
    float wd = uWhite.x + 15.0 * uWhite.y + 3.0 * uWhite.z;
    float up = c.y / (13.0 * c.x) + 4.0 * uWhite.x / wd;
    float vp = c.z / (13.0 * c.x) + 9.0 * uWhite.y / wd;
    float Y = labfi((c.x + 16.0) / 116.0) * uWhite.y;
    return vec3(Y * 9.0 * up / (4.0 * vp), Y, Y * (12.0 - 3.0 * up - 20.0 * vp) / (4.0 * vp));
  }
  if (uSpace == 3) {
    vec3 p = uIptOppI * (c / 100.0);
    vec3 l = vec3(spow(p.x, 1.0/0.43), spow(p.y, 1.0/0.43), spow(p.z, 1.0/0.43)) * uIptW;
    return uIptLmsI * l;
  }
  if (uSpace == 4) return c / 100.0;
  vec3 g = c / 100.0;                                     // sRGB cube: decode, then to XYZ
  return uXyzSrgb * vec3(dec(g.x), dec(g.y), dec(g.z));
}

bool inArc(float h) {
  if (uHueAll == 1) return true;
  return uHue.x <= uHue.y ? (h >= uHue.x && h <= uHue.y) : (h >= uHue.x || h <= uHue.y);
}

/** inside the lightness / chroma / hue bounds? */
bool inBounds(vec3 lab) {
  float chroma = length(lab.yz);
  float hue = degrees(atan(lab.z, lab.y));
  hue = hue < 0.0 ? hue + 360.0 : hue;
  return lab.x >= uLB.x && lab.x <= uLB.y && chroma >= uCB.x && chroma <= uCB.y
         && (chroma < 1.0 || inArc(hue));
}

/** XYZ, through the selected observer, to something a monitor can show */
vec3 shown(vec3 xyz) {
  vec3 lin = uLinSrgb * xyz;
  if (uCvd > 0) {
    mat3 m = dot(uCvdN, lin) >= 0.0 ? uCvd1 : uCvd2;
    lin = mix(lin, m * lin, uSev);
  }
  return clamp(vec3(enc(lin.r), enc(lin.g), enc(lin.b)), 0.0, 1.0);
}

vec3 chartOf(vec3 xyz) { return (uLabLms * cbrt3(uLmsXyz * xyz)) * 100.0; }
`;

const SLICE_FRAG = COLOR_GLSL + `
varying vec2 vUv;
uniform int uAxis;
uniform float uT;
void main() {
  // spelled out rather than indexed: dynamic vector indexing is not worth the
  // portability question, and this mirrors AXES[k].at() line for line
  vec3 c;
  if (uAxis == 0) c = vec3(uT, mix(uLo.y, uHi.y, vUv.x), mix(uLo.z, uHi.z, vUv.y));
  else if (uAxis == 1) c = vec3(mix(uLo.x, uHi.x, vUv.y), uT, mix(uLo.z, uHi.z, vUv.x));
  else c = vec3(mix(uLo.x, uHi.x, vUv.y), mix(uLo.y, uHi.y, vUv.x), uT);

  vec3 xyz = spaceToXyz(c);
  vec3 ling = uGamut * xyz;
  if (any(lessThan(ling, vec3(-1e-9))) || any(greaterThan(ling, vec3(1.0 + 1e-9)))) discard;
  // out of bounds is cut away rather than dimmed: what is left is exactly the
  // set you asked for, with nothing to read past
  if (!inBounds(chartOf(xyz))) discard;
  gl_FragColor = vec4(shown(xyz), uOpacity);
}`;

// The solid is the gamut boundary, so there is nothing to test — every fragment
// is reachable by construction. Per fragment rather than per vertex also means
// the colour stops being an interpolation across triangles that are large where
// the surface curves most.
const SHELL_FRAG = COLOR_GLSL + `
varying vec3 vPos;
void main() {
  vec3 c = vec3(vPos.y / uScale + uMid.x, vPos.x / uScale + uMid.y, vPos.z / uScale + uMid.z);
  vec3 xyz = spaceToXyz(c);
  if (!inBounds(chartOf(xyz))) discard;
  gl_FragColor = vec4(shown(xyz), uOpacity);
}`;

/**
 * The caps. Cutting the shell by the bounds leaves a punctured surface, not a
 * solid: the boundary of the feasible set is the in-bounds part of the gamut
 * shell PLUS the parts of the bound surfaces lying inside the gamut. Those are
 * the two lightness planes, the two chroma cylinders and the two hue
 * half-planes, each carrying the same colour pipeline.
 *
 * A cap satisfies its own bound by construction, to within its tessellation,
 * so testing it again would make the surface flicker along its own edge. Each
 * cap is told which bound it is and skips exactly that test.
 */
const CAP_FRAG = COLOR_GLSL + `
varying vec3 vPos;
uniform int uCap;
void main() {
  vec3 c = vec3(vPos.y / uScale + uMid.x, vPos.x / uScale + uMid.y, vPos.z / uScale + uMid.z);
  vec3 xyz = spaceToXyz(c);
  vec3 ling = uGamut * xyz;
  if (any(lessThan(ling, vec3(-1e-9))) || any(greaterThan(ling, vec3(1.0 + 1e-9)))) discard;
  vec3 lab = chartOf(xyz);
  float chroma = length(lab.yz);
  float hue = degrees(atan(lab.z, lab.y));
  hue = hue < 0.0 ? hue + 360.0 : hue;
  if (uCap != 0 && (lab.x < uLB.x || lab.x > uLB.y)) discard;
  if (uCap != 1 && (chroma < uCB.x || chroma > uCB.y)) discard;
  if (uCap != 2 && chroma >= 1.0 && !inArc(hue)) discard;
  gl_FragColor = vec4(shown(xyz), uOpacity);
}`;

const SLICE_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }';
const SHELL_VERT = 'varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }';

const colorUniforms = () => ({
  uSpace: { value: 0 }, uCvd: { value: 0 }, uHueAll: { value: 1 },
  uSev: { value: 1 }, uOpacity: { value: 1 }, uScale: { value: 1 },
  uMid: { value: new T.Vector3() },
      uLo: { value: new T.Vector3() }, uHi: { value: new T.Vector3() },
      uWhite: { value: new T.Vector3() }, uIptW: { value: new T.Vector3() }, uCvdN: { value: new T.Vector3() },
      uLB: { value: new T.Vector2() }, uCB: { value: new T.Vector2() }, uHue: { value: new T.Vector2() },
      uLmsLab: { value: new T.Matrix3() }, uXyzLms: { value: new T.Matrix3() },
      uLmsXyz: { value: new T.Matrix3() }, uLabLms: { value: new T.Matrix3() },
      uIptOppI: { value: new T.Matrix3() }, uIptLmsI: { value: new T.Matrix3() },
      uGamut: { value: new T.Matrix3() }, uLinSrgb: { value: new T.Matrix3() },
      uXyzSrgb: { value: new T.Matrix3() },
  uCvd1: { value: new T.Matrix3() }, uCvd2: { value: new T.Matrix3() },
});

/** every constant the shaders need, straight from the model */
function setColorUniforms(u) {
  const I = internals;
  u.uSpace.value = SPACE_ID[params.space];
  u.uLo.value.fromArray(FRAME.lo); u.uHi.value.fromArray(FRAME.hi);
  u.uMid.value.fromArray(FRAME.mid); u.uScale.value = FRAME.s;
  u.uWhite.value.fromArray(I.CHART_WHITE); u.uIptW.value.fromArray(I.IPT.W);
  u.uLmsLab.value.copy(m3(I.LMS_LAB)); u.uXyzLms.value.copy(m3(I.XYZ_LMS));
  u.uLmsXyz.value.copy(m3(I.LMS_XYZ)); u.uLabLms.value.copy(m3(I.LAB_LMS));
  u.uIptOppI.value.copy(m3(I.IPT.OPP_I)); u.uIptLmsI.value.copy(m3(I.IPT.LMS_I));
  u.uGamut.value.copy(m3(I.rgbFromXYZ(params.gamut)));
  u.uLinSrgb.value.copy(m3(I.rgbFromXYZ('srgb')));
  u.uXyzSrgb.value.copy(m3(I.xyzFromRGB('srgb')));
  u.uLB.value.set(S.lo[0], S.hi[0]); u.uCB.value.set(S.lo[1], S.hi[1]);
  u.uHue.value.fromArray(S.hue);
  u.uHueAll.value = S.hue[0] === 0 && S.hue[1] === 360 ? 1 : 0;
  u.uCvd.value = CVD_ID[S.cvd]; u.uSev.value = S.sev;
  if (S.cvd !== 'none') {
    const [m1, m2, n] = I.BRETTEL[S.cvd];
    u.uCvd1.value.set(...m1); u.uCvd2.value.set(...m2); u.uCvdN.value.fromArray(n);
  }
}

// ─── the sRGB solid, as its actual boundary ──────────────────────────────────
// The gamut is the image of the RGB cube, so its boundary is the image of the
// cube's six faces. Exact, and 6N² quads instead of a volume of samples.
const SHELL_N = 28;
const shellGeo = (() => {
  const N = SHELL_N, idx = [], count = 6 * (N + 1) ** 2;
  for (let f = 0; f < 6; f++) {
    const base = f * (N + 1) ** 2;
    // Half the cube's faces have to wind the other way. The u×v normal of the
    // grid points along +w, which is outward only on the far face — and on top
    // of that world() is an odd permutation of the chart axes, so it mirrors
    // every triangle. Get this wrong and BackSide culls whole faces away: the
    // solid loses entire sides depending on where you orbit to.
    const flip = CUBE_FACES[f][3] === 1;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const o = base + j * (N + 1) + i;
      idx.push(...(flip
        ? [o, o + N + 1, o + 1, o + 1, o + N + 1, o + N + 2]
        : [o, o + 1, o + N + 1, o + 1, o + N + 2, o + N + 1]));
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(new Float32Array(count * 3), 3));
  g.setIndex(idx);
  return g;
})();

/**
 * Positions depend on the active gamut, so this reruns when the gamut changes.
 *
 * The cube on the parameter is not arbitrary. Oklab lightness goes as the CUBE
 * ROOT of linear intensity, so sampling linear = t³ lands the vertices at even
 * lightness steps. Sampling evenly in t — or with a display gamma, which was
 * the first thing I reached for — spends nearly every vertex on the bright half
 * and leaves the dark end a two-triangle spike that visibly fails to enclose
 * what the slices show is in gamut down there. The warp only moves vertices
 * around the surface; it never changes which surface they are on.
 */
function buildShell() {
  const N = SHELL_N, pos = shellGeo.attributes.position;
  let k = 0;
  for (const [u, v, w, f] of CUBE_FACES)
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
      const c = []; c[u] = (i / N) ** 3; c[v] = (j / N) ** 3; c[w] = f;
      const p = wpt(fromLinear(c));
      pos.setXYZ(k++, p.x, p.y, p.z);
    }
  pos.needsUpdate = true;
  shellGeo.computeBoundingSphere();
}
// BackSide, not DoubleSide: drawing only the far faces gives one clean layer of
// translucency instead of six stacked ones, and leaves the interior readable.
const shell = new T.Mesh(shellGeo, new T.ShaderMaterial({
  vertexShader: SHELL_VERT, fragmentShader: SHELL_FRAG,
  transparent: true, side: T.BackSide, depthWrite: false,
  uniforms: colorUniforms(),
}));
shell.renderOrder = 2;
shell.layers.set(1);
scene.add(shell);

/** the solid's colour is now a fragment shader; this only refreshes uniforms */
function paintShell() {
  setColorUniforms(shell.material.uniforms);
  shell.material.uniforms.uOpacity.value = S.shell;
  buildCaps();
  paintCaps();
}

// ─── caps: the feasible set's boundary where a bound cuts it ────────────────
const capGroup = new T.Group();
capGroup.layers.set(1);                            // part of the solid, so 3D only
scene.add(capGroup);
const CAP_N = 36, CAP_R = 60;
let capKey = null;

/** a point on cap `kind` at value v, parameterised over the unit square */
const capChart = (kind, v, u, w) => {
  if (kind === 0) return [v, (2 * u - 1) * CAP_R, (2 * w - 1) * CAP_R];        // L = v
  if (kind === 1) { const h = u * 2 * Math.PI;                                  // chroma = v
    return [w * 100, v * Math.cos(h), v * Math.sin(h)]; }
  const h = (v * Math.PI) / 180;                                                // hue = v
  return [w * 100, u * CAP_R * Math.cos(h), u * CAP_R * Math.sin(h)];
};

/**
 * Which way is out of the feasible set, in the chart. `sign` is +1 for a cap
 * on an upper bound and -1 for a lower one: leaving through the top of the
 * lightness band means increasing L, leaving through the bottom means
 * decreasing it, and likewise for chroma and for the two ends of the hue arc.
 */
const capOut = (kind, q, sign) => {
  const h = Math.atan2(q[2], q[1]);
  return kind === 0 ? [sign, 0, 0]
       : kind === 1 ? [0, sign * Math.cos(h), sign * Math.sin(h)]
       : [0, -sign * Math.sin(h), sign * Math.cos(h)];
};

function buildCaps() {
  const key = `${S.lo}|${S.hi}|${S.hue}|${params.space}|${params.gamut}`;
  if (key === capKey) return;
  capKey = key;
  capGroup.clear();
  const wanted = [
    ...(S.lo[0] > 0 ? [[0, S.lo[0], -1]] : []), ...(S.hi[0] < 100 ? [[0, S.hi[0], 1]] : []),
    ...(S.lo[1] > 0 ? [[1, S.lo[1], -1]] : []), ...(S.hi[1] < 40 ? [[1, S.hi[1], 1]] : []),
    ...(S.hue[0] === 0 && S.hue[1] === 360 ? [] : [[2, S.hue[0], -1], [2, S.hue[1], 1]]),
  ];
  for (const [kind, v, sign] of wanted) {
    const pos = [], idx = [];
    for (let j = 0; j <= CAP_N; j++) for (let i = 0; i <= CAP_N; i++)
      pos.push(...wpt(capChart(kind, v, i / CAP_N, j / CAP_N)).toArray());
    for (let j = 0; j < CAP_N; j++) for (let i = 0; i < CAP_N; i++) {
      const o = j * (CAP_N + 1) + i;
      idx.push(o, o + 1, o + CAP_N + 1, o + 1, o + CAP_N + 2, o + CAP_N + 1);
    }
    // The grid's u×v normal points outward on one cap of each pair and inward
    // on the other, and world() mirrors it again — the same trap the shell
    // hit. So measure it rather than predict it: compare one triangle against
    // a step in the known outward direction, and reverse the winding if they
    // disagree. Consistently outward is what lets these render BackSide.
    const q = capChart(kind, v, 0.5, 0.5), d = capOut(kind, q, sign);
    const outward = wpt(q.map((c, i) => c + 1e-3 * d[i])).sub(wpt(q));
    const t0 = 6 * ((CAP_N / 2 | 0) * CAP_N + (CAP_N / 2 | 0));
    const [A, B, C] = [0, 1, 2].map((k) => new T.Vector3().fromArray(pos, 3 * idx[t0 + k]));
    if (B.sub(A).cross(C.sub(A)).dot(outward) < 0)
      for (let t = 0; t < idx.length; t += 3) [idx[t + 1], idx[t + 2]] = [idx[t + 2], idx[t + 1]];
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    const m = new T.Mesh(g, new T.ShaderMaterial({
      vertexShader: SHELL_VERT, fragmentShader: CAP_FRAG,
      transparent: true, side: T.BackSide, depthWrite: false,
      uniforms: { ...colorUniforms(), uCap: { value: kind } },
    }));
    m.layers.set(1);
    m.renderOrder = 2;
    capGroup.add(m);
  }
  paintCaps();
}

function paintCaps() {
  for (const m of capGroup.children) {
    setColorUniforms(m.material.uniforms);
    m.material.uniforms.uOpacity.value = S.shell;
  }
}

// ─── slice planes: evaluated per fragment on the GPU ────────────────────────
// A slice texel is a pure function of (u,v): space coords → XYZ → gamut test →
// sRGB. That is a fragment shader by definition, and building it on the CPU as
// a 320² ImageData cost 60 ms per slice — the single most expensive thing in
// the app. Here the cut, the space, the gamut, the observer and the bounds are
// all uniforms, so moving a slider is a uniform write and nothing more.
//
// The algorithm exists twice, in TypeScript and in GLSL; the CONSTANTS do not.
// Every matrix below is uploaded from color-space.ts, so the two cannot drift
// numerically even though they must be kept in step logically.
const axLerp = (k, t) => FRAME.lo[k] + (FRAME.hi[k] - FRAME.lo[k]) * t;
const AXES = [
  { corners: (t) => [[t, FRAME.lo[1], FRAME.lo[2]], [t, FRAME.hi[1], FRAME.lo[2]], [t, FRAME.hi[1], FRAME.hi[2]], [t, FRAME.lo[1], FRAME.hi[2]]],
    at: (t, u, v) => [t, axLerp(1, u), axLerp(2, v)], normal: () => new T.Vector3(0, 1, 0) },
  { corners: (t) => [[FRAME.lo[0], t, FRAME.lo[2]], [FRAME.lo[0], t, FRAME.hi[2]], [FRAME.hi[0], t, FRAME.hi[2]], [FRAME.hi[0], t, FRAME.lo[2]]],
    at: (t, u, v) => [axLerp(0, v), t, axLerp(2, u)], normal: () => new T.Vector3(1, 0, 0) },
  { corners: (t) => [[FRAME.lo[0], FRAME.lo[1], t], [FRAME.lo[0], FRAME.hi[1], t], [FRAME.hi[0], FRAME.hi[1], t], [FRAME.hi[0], FRAME.lo[1], t]],
    at: (t, u, v) => [axLerp(0, v), axLerp(1, u), t], normal: () => new T.Vector3(0, 0, 1) },
];
function sliceMaterial() {
  return new T.ShaderMaterial({
    vertexShader: SLICE_VERT, fragmentShader: SLICE_FRAG,
    transparent: true, depthWrite: true, side: T.DoubleSide,
    uniforms: { ...colorUniforms(), uAxis: { value: 0 }, uT: { value: 0 } },
  });
}

const slices = AXES.map((ax, k) => {
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.Float32BufferAttribute(new Float32Array(12), 3));
  geo.setAttribute('uv', new T.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
  geo.setIndex([0, 1, 2, 0, 2, 3]);
  const mesh = new T.Mesh(geo, sliceMaterial());
  const edge = new T.LineLoop(new T.BufferGeometry().setAttribute('position', geo.attributes.position),
    new T.LineBasicMaterial({ color: 0x33333a }));
  edge.renderOrder = 1;
  mesh.layers.set(3); edge.layers.set(3);
  scene.add(mesh, edge);
  return { ax, k, geo, mesh, edge };
});

function paintSlice(s) {
  const t = S.slice[s.k];
  const p = s.geo.attributes.position;
  s.ax.corners(t).forEach((c, i) => p.setXYZ(i, ...world(c).toArray()));
  p.needsUpdate = true;
  s.geo.computeBoundingSphere();

  const u = s.mesh.material.uniforms;
  setColorUniforms(u);
  u.uAxis.value = s.k; u.uT.value = t; u.uOpacity.value = S.sliceOp;
}

// ─── trajectory, control points, obstacle spheres ────────────────────────────
// transparent + depthTest off puts these in the pass that runs AFTER the slice
// planes and exempts them from its depth, so the trajectory reads over the cut
// rather than being blended into it. renderOrder does the rest of the stacking.
const overlay = (extra) => new T.MeshBasicMaterial({ transparent: true, depthTest: false, ...extra });
const tube = new T.Mesh(new T.BufferGeometry(), overlay({ vertexColors: true }));
// a slightly fatter black tube, back faces only: what shows past the coloured
// one is exactly an outline, and it costs no shader work
const tubeEdge = new T.Mesh(new T.BufferGeometry(), overlay({ color: 0x000000, side: T.BackSide }));
tubeEdge.renderOrder = 6; tube.renderOrder = 7;
scene.add(tube, tubeEdge);

function buildTube() {
  tube.geometry.dispose(); tubeEdge.geometry.dispose();
  const c = curve();
  tube.visible = tubeEdge.visible = S.mode === 'continuous' && c.length >= 2;
  if (!tube.visible) { tube.geometry = tubeEdge.geometry = new T.BufferGeometry(); return; }
  const seg = Math.min(400, c.length * 2), radial = 8;
  const path = new T.CatmullRomCurve3(c.map(wpt));
  const g = new T.TubeGeometry(path, seg, 1.3, radial, false);
  tubeEdge.geometry = new T.TubeGeometry(path, seg, 1.75, radial, false);
  // TubeGeometry emits (seg+1) rings of (radial+1) vertices in order, so the
  // ring index recovers the curve parameter, and with it the colour.
  const col = new Float32Array(g.attributes.position.count * 3);
  for (let i = 0; i < g.attributes.position.count; i++) {
    const ring = Math.floor(i / (radial + 1));
    col.set(rgb(c[Math.min(c.length - 1, Math.round((ring / seg) * (c.length - 1)))]), i * 3);
  }
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  tube.geometry = g;
}

const ptGroup = new T.Group(), obsGroup = new T.Group(), planeGroup = new T.Group();
scene.add(ptGroup, obsGroup, planeGroup);
const DOT = new T.SphereGeometry(2.6, 20, 14), RING = new T.SphereGeometry(3.4, 20, 14);
const OBS_DIR = new T.Vector3(0.62, 0.5, 0.6).normalize();   // off-axis on purpose

function buildPoints() {
  ptGroup.clear();
  S.pts.forEach((p, i) => {
    const sel = S.sel?.kind === 'pt' && S.sel.i === i;
    // a handle sitting exactly on its own cut plane would otherwise be half
    // buried in it, and a handle you cannot see is one you cannot grab
    const ring = new T.Mesh(RING, overlay({ color: sel ? 0xffffff : 0x0d0d10, side: T.BackSide }));
    const dot = new T.Mesh(DOT, overlay({}));
    dot.material.color.setRGB(...rgb(p));
    ring.renderOrder = 8; dot.renderOrder = 9;
    ring.add(dot);
    ring.position.copy(wpt(p));
    ring.userData = { kind: 'pt', i };
    ptGroup.add(ring);
  });
}

function buildObstacles() {
  obsGroup.clear();
  S.obs.forEach((o, i) => {
    const sel = (S.sel?.kind === 'obs' || S.sel?.kind === 'obsr') && S.sel.i === i;
    // r is stored in PERCEIVED units, so the ball's geometric radius is f⁻¹(r)
    // ponytail: drawn as a sphere in every space. Only true in Oklab — in a
    // warped chart the keep-out set is that ball pushed through the map.
    const g = new T.SphereGeometry(unperceive(o.r) * FRAME.s, 28, 18);
    const m = new T.Mesh(g, new T.MeshBasicMaterial({
      color: 0xff5b5b, transparent: true, opacity: sel ? 0.26 : 0.13, depthWrite: false }));
    m.add(new T.Mesh(g, new T.MeshBasicMaterial({
      color: sel ? 0xffffff : 0xff5b5b, wireframe: true, transparent: true, opacity: 0.3 })));
    m.position.copy(wpt(o.c));
    m.userData = { kind: 'obs', i };
    // Handle on the surface, in a deliberately oblique direction: along an axis
    // it would project onto the centre in whichever panel looks down that axis,
    // and a handle you cannot separate from the centre is one you cannot grab.
    const h = new T.Mesh(DOT, overlay({ color: sel ? 0xffd76a : 0xc94f4f }));
    h.scale.setScalar(0.7);
    h.position.copy(m.position).addScaledVector(OBS_DIR, unperceive(o.r) * FRAME.s);
    h.renderOrder = 8;
    h.userData = { kind: 'obsr', i };
    obsGroup.add(m, h);
  });
}

/**
 * A halfplane is stored as an axis, a value and a side — so it draws as a quad
 * spanning the other two axes, and gets a handle at its centre. That handle is
 * an ordinary pickable object, which means dragging it (slides the cut),
 * right-clicking it (deletes) and selecting it all come from machinery that
 * already exists rather than a second interaction path.
 */
// world(c) is a permutation times ONE uniform scale, so a direction in space
// coordinates maps to a world direction by the same permutation and normalises
// out. That is what lets the gizmo basis be built in world space and read back.
const wdir = (n) => new T.Vector3(n[1], n[0], n[2]).normalize();
const sdir = (v) => [v.y, v.x, v.z];
/** the point of the plane nearest the middle of the box */
const planeCentre = (pl) => FRAME.mid.map((m, j) => m + (pl.d - dot3(pl.n, FRAME.mid)) * pl.n[j]);

const PLANE_R = 26, HANDLE_R = 15;

function buildPlanes() {
  planeGroup.clear();
  S.planes.forEach((pl, i) => {
    const sel = S.sel?.kind === 'plane' && S.sel.i === i;
    const W = world(planeCentre(pl)), n = wdir(pl.n);
    const u = new T.Vector3(0, 1, 0).cross(n);
    if (u.lengthSq() < 1e-6) u.set(1, 0, 0);
    u.normalize();
    const v = new T.Vector3().crossVectors(n, u);
    // The halfplane is infinite; the quad is a fixed-size gizmo so that seeing
    // one face-on does not flood a whole panel red. A handle, not a claim.
    const quad = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) =>
      W.clone().addScaledVector(u, a * PLANE_R).addScaledVector(v, b * PLANE_R));
    const geo = new T.BufferGeometry().setFromPoints(quad);
    geo.setIndex([0, 1, 2, 0, 2, 3]);
    planeGroup.add(new T.Mesh(geo, new T.MeshBasicMaterial({
      color: 0xff5b5b, transparent: true, opacity: sel ? 0.22 : 0.1, side: T.DoubleSide, depthWrite: false })));
    planeGroup.add(new T.LineLoop(
      new T.BufferGeometry().setAttribute('position', geo.attributes.position),
      new T.LineBasicMaterial({ color: 0xff5b5b, transparent: true, opacity: sel ? 1 : 0.6 })));

    const tip = W.clone().addScaledVector(n, HANDLE_R);          // points into the excluded half
    planeGroup.add(new T.Line(new T.BufferGeometry().setFromPoints([W, tip]),
      new T.LineBasicMaterial({ color: 0xff5b5b })));

    const centre = new T.Mesh(DOT, overlay({ color: sel ? 0xffffff : 0xff5b5b }));
    centre.position.copy(W);
    centre.renderOrder = 8;
    centre.userData = { kind: 'plane', i };
    const rot = new T.Mesh(DOT, overlay({ color: sel ? 0xffd76a : 0xc94f4f }));
    rot.scale.setScalar(0.75);
    rot.position.copy(tip);
    rot.renderOrder = 8;
    rot.userData = { kind: 'planerot', i };
    planeGroup.add(centre, rot);
  });
}

// ─── layout and render loop ──────────────────────────────────────────────────
function layout() {
  const w = Math.max(1, main.clientWidth), h = Math.max(1, main.clientHeight);
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(w, h, false);
  // 3|1: the three cuts stacked in a column, 3D taking the rest. QUADS is
  // already ordered with the ortho views first, so index 3 is the big one.
  const colW = Math.min(440, Math.max(200, Math.round(w * 0.3)));
  const rowH = Math.floor(h / 3);
  const RECTS = [
    { x: 0, y: 0, w: colW, h: rowH },
    { x: 0, y: rowH, w: colW, h: rowH },
    { x: 0, y: 2 * rowH, w: colW, h: h - 2 * rowH },
    { x: colW, y: 0, w: w - colW, h },
  ];
  QUADS.forEach((q, i) => {
    q.rect = RECTS[i];
    Object.assign(q.el.style, { left: q.rect.x + 'px', top: q.rect.y + 'px', width: q.rect.w + 'px', height: q.rect.h + 'px' });
    const aspect = q.rect.w / q.rect.h;
    if (q.cam.isPerspectiveCamera) { q.cam.aspect = aspect; }
    else {
      // grow the frustum to whichever dimension the content needs, so the view
      // fills the quad at any aspect instead of staying square and spilling out
      const { w: cw, h: ch } = q.cam.userData.content;
      const H = Math.max(ch, cw / aspect) * 1.08;
      q.cam.top = H; q.cam.bottom = -H; q.cam.right = H * aspect; q.cam.left = -H * aspect;
    }
    q.cam.updateProjectionMatrix();
  });
  lplotEl.style.left = RECTS[3].x + 14 + 'px';    // the plot belongs to the 3D panel
  layoutPlot();
}

function frame() {
  controls.update();
  const h = canvas.clientHeight;
  for (const q of QUADS) {
    const { x, y, w: qw, h: qh } = q.rect;
    renderer.setViewport(x, h - y - qh, qw, qh);      // WebGL counts y from the bottom
    renderer.setScissor(x, h - y - qh, qw, qh);
    renderer.clear();
    renderer.render(scene, q.cam);
  }
  requestAnimationFrame(frame);
}

// ─── sidebar ─────────────────────────────────────────────────────────────────
const strip = $('strip'), sctx = strip.getContext('2d');

function sidebar() {
  const pal = palette(), W = strip.width, H = strip.height;
  // one representation per mode: a ramp is not a set of swatches and a set of
  // swatches is not a ramp. Index 0 sits at the bottom either way, colorbar side up.
  const ramp = S.mode === 'continuous' && S.pts.length >= 2;
  strip.style.display = ramp ? '' : 'none';
  $('swatches').style.display = ramp ? 'none' : '';
  // A discrete set has no ramp to profile and no ends to pin — its order is
  // arbitrary — so both controls go away rather than sitting there inert.
  const cont = S.mode === 'continuous';
  lplotEl.style.display = cont ? '' : 'none';
  $('pinends').closest('.row').style.display = cont ? '' : 'none';
  if (cont) layoutPlot();
  if (ramp) {
    sctx.clearRect(0, 0, W, H);
    // uniform in ARC LENGTH — the additive quantity. See color-space.ts.
    resample(curve(), H, M()).forEach((p, i) => { sctx.fillStyle = out(p); sctx.fillRect(0, H - 1 - i, W, 1); });
  } else {
    $('swatches').innerHTML = pal.map((p, i) =>
      `<div class="sw" data-i="${i}" data-sel="${S.sel?.kind === 'pt' && S.sel.i === i}"
        data-bad="${!inGamut(p)}" style="background:${out(p)}" title="${toHex(p)}"></div>`).join('');
  }

  const rows = [];
  if (pal.length >= 2) {
    const worst = minSeparation(pal, M(), criteria());
    rows.push([`min Δ · ${observer()}`, minSeparation(pal, M(), [primary()]).toFixed(1), false, null,
      'Closest pair, as the selected observer sees it.'],
      ['min Δ · worst', worst.toFixed(1), worst < 8, null,
      'Closest pair over every observer. Red below 8.']);
  }
  if (S.mode === 'continuous' && S.pts.length >= 2) {
    const c = curve(), bad = c.filter((p) => !inGamut(p)).length;
    rows.push(['perceived end-to-end', perceive(arcLength(c, M())).toFixed(1), false, null,
      'Arc length after diminishing returns. Always the smaller number.'],
      ['out of gamut', `${bad}/${c.length}`, bad > 0, null,
      'Curve samples outside the gamut. Nodes are always inside.']);
  }
  if (S.obs.length) {
    const probe = S.mode === 'continuous' && S.pts.length >= 2 ? curve() : pal;
    const hit = probe.reduce((a, p) => a + obstaclePenalty(p, S.obs, M(), primary()), 0);
    rows.push(['obstacle cost', hit.toFixed(0), hit > 0]);
  }
  const cx = ctxOf(S.pts);
  for (const o of OBJ) {
    if (o.mode && o.mode !== S.mode) continue;
    const v = o.f(cx);
    rows.push([typeof o.label === 'function' ? o.label() : o.label,
      v < 10 ? v.toFixed(2) : v.toFixed(0), !!o.bad && v > 0, o.key, HELP[o.key]]);
  }
  const esc = (x) => x.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  $('metrics').innerHTML = rows.map(([k, v, warn, obj, help]) => {
    // data-help, not title: the OS tooltip makes you wait a second to find out
    // whether hovering does anything, and the sidebar scrolls, which would clip
    // a positioned one. A line under the table is instant and never clipped.
    const q = help ? `<span class="q" data-help="${esc(help)}">?</span>` : '';
    return `<tr><td>${obj ? `<label class="chk"><input type="checkbox" data-on="${obj}"${S.on[obj] ? ' checked' : ''}>${k}</label>` : k}${q}</td>` +
    `<td class="${warn ? 'warn' : ''}">${v}</td>` +
    (obj ? `<td class="w"><input class="w" type="number" min="0" max="20" step="0.25" data-w="${obj}"`
         + ` value="${S.w[obj]}"${S.on[obj] ? '' : ' disabled'} title="relative pull in the combined step"></td>`
         + `<td class="btns"><button data-obj="${obj}" data-dir="1" title="descend">−</button>`
         + `<button data-obj="${obj}" data-dir="-1" title="ascend">+</button></td>`
         : '<td class="w"></td><td class="btns"></td>') + '</tr>';
  }).join('');

  const s = S.sel;
  $('selpanel').style.display = s ? '' : 'none';
  const target = s?.kind === 'pt' ? S.pts[s.i] : s?.kind?.startsWith('obs') ? S.obs[s.i]?.c : null;
  // leave the field alone while it has focus, or it fights whoever is typing
  if (target && document.activeElement !== $('hex')) $('hex').value = COLORFMT[S.cfmt].to(target);
  $('hex').closest('.row').style.display = target ? '' : 'none';
  $('flip').closest('.row').style.display = s?.kind === 'plane' || s?.kind === 'planerot' ? '' : 'none';
  if (s?.kind === 'pt' && S.pts[s.i]) {
    const [L, C, h] = toLCh(S.pts[s.i]);
    $('selinfo').innerHTML = `point ${s.i} · <code>${toHex(S.pts[s.i])}</code> · L ${L.toFixed(1)} C ${C.toFixed(1)} h ${((h + 360) % 360).toFixed(0)}°`;
  } else if ((s?.kind === 'plane' || s?.kind === 'planerot') && S.planes[s.i]) {
    const pl = S.planes[s.i], ax = SPACES[params.space].axes;
    const terms = pl.n.map((c, j) => (Math.abs(c) < 0.01 ? '' : `${c > 0 ? '+' : '−'}${Math.abs(c).toFixed(2)}·${ax[j]}`))
      .filter(Boolean).join(' ').replace(/^\+/, '');
    $('selinfo').innerHTML = `plane ${s.i} · keep <code>${terms} ≤ ${pl.d.toFixed(1)}</code>`;
  } else if ((s?.kind === 'obs' || s?.kind === 'obsr') && S.obs[s.i]) {
    const o = S.obs[s.i];
    $('selinfo').innerHTML = `sphere ${s.i} · <code>${toHex(o.c)}</code> · r ${o.r.toFixed(1)} perceived, ${unperceive(o.r).toFixed(1)} in chart units`;
  }
  $('toolnote').textContent = { edit: 'double-click to add · drag to move · right-click to delete',
    obstacle: 'double-click a slice to place · drag the handle to resize',
    plane: 'double-click a slice to cut · drag the centre or the tip' }[S.tool];

  paintPlotButtons(); drawPlots(); drawWheel();
  drawTest();
}

// ─── test image preview ──────────────────────────────────────────────────────
// Metrics do not see banding. A colormap can score well on every term in the
// panel and still put a ridge where the data is flat, or lose a feature where
// its contrast dips — both of which are obvious the moment you map something
// through it. Everything here goes through the same view as the rest of the
// page, so the colour-vision and grayscale settings apply to the test too.
const tipc = $('tipcanvas'), tctx = tipc.getContext('2d');
const rnd = (seed) => () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

const TESTS = {
  sineramp: { mode: 'continuous', label: 'sineramp',
    note: 'Kovesi\u2019s test: a constant-amplitude sine riding a linear ramp, fading out downward. '
        + 'Where the map loses contrast the wave disappears early; where it has a false edge the flat ramp shows a band.',
    f: (x, y) => x + 0.05 * Math.sin(x * 32 * Math.PI) * (1 - y) },
  field: { mode: 'continuous', label: 'field',
    note: 'A smooth scalar field. Any ring, ridge or bright seam you can see is the colormap talking, not the data.',
    f: (x, y) => {
      const g = (cx, cy, s) => Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * s * s));
      return 0.95 * g(0.26, 0.62, 0.20) + 0.75 * g(0.68, 0.36, 0.26) + 0.45 * g(0.46, 0.84, 0.14);
    } },
  lines: { mode: 'discrete', label: 'lines',
    note: 'One series per class, crossing and overlapping. Line work is thin, so a pair that reads as distinct in a swatch row can still merge here.' },
  scatter: { mode: 'discrete', label: 'scatter',
    note: 'Every class on a light and a dark ground. A swatch that vanishes against either, or that you cannot tell from its neighbour, fails here and not in the metrics.' },
};

/** the palette as bytes, through the active view — CVD and grayscale included */
const lutOf = (n) => (S.mode === 'continuous' && S.pts.length >= 2 ? resample(curve(), n, M()) : palette())
  .map((p) => rgb(S.gray ? [p[0], 0, 0] : p).map((c) => Math.round(255 * c)));

function drawTest() {
  const W = tipc.width, H = tipc.height;
  const kind = TESTS[S.tipKind]?.mode === S.mode ? S.tipKind
             : Object.keys(TESTS).find((k) => TESTS[k].mode === S.mode);
  $('tipbtns').innerHTML = Object.entries(TESTS).filter(([, t]) => t.mode === S.mode)
    .map(([k, t]) => `<button data-tip="${k}" aria-pressed="${k === kind}" title="${t.note}">${t.label}</button>`).join('');
  const lut = lutOf(256);
  tctx.clearRect(0, 0, W, H);
  if (!lut.length) return;
  if (kind === 'scatter') return drawScatter(W, H, lut);
  if (kind === 'lines') return drawLines(W, H, lut);

  // normalise whatever the field returns, so a test only has to be smooth
  const f = TESTS[kind].f, v = new Float64Array(W * H);
  let mn = Infinity, mx = -Infinity;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = f(x / (W - 1), y / (H - 1));
    v[y * W + x] = t; if (t < mn) mn = t; if (t > mx) mx = t;
  }
  const span = mx - mn || 1, img = tctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const c = lut[Math.round(((v[i] - mn) / span) * (lut.length - 1))];
    img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1];
    img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
  }
  tctx.putImageData(img, 0, 0);
}

/**
 * Smooth crossing series rather than a random walk: noise would make them hard
 * to follow for reasons that are nothing to do with the colours. Each class
 * gets its own phase, frequency and tilt, so they overlap the way real series
 * do — which is where thin strokes of two similar hues stop being two.
 */
function drawLines(W, H, lut) {
  tctx.fillStyle = '#ececec'; tctx.fillRect(0, 0, W, H);
  tctx.strokeStyle = '#00000014'; tctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = Math.round((i * H) / 4) + 0.5;
    tctx.beginPath(); tctx.moveTo(0, y); tctx.lineTo(W, y); tctx.stroke();
  }
  tctx.lineJoin = 'round'; tctx.lineCap = 'round'; tctx.lineWidth = 2;
  lut.forEach((c, i) => {
    const r = rnd(i * 2749 + 91);
    const ph = r() * 7, fr = 1.1 + 2.2 * r(), tilt = (r() - 0.5) * 0.9, ph2 = r() * 7;
    tctx.strokeStyle = `rgb(${c.join(' ')})`;
    tctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const t = x / W;
      const v = Math.min(0.94, Math.max(0.06, 0.5 + tilt * (t - 0.5)
        + 0.2 * Math.sin(ph + fr * t * 6.2832) + 0.08 * Math.sin(ph2 + fr * 2.3 * t * 6.2832)));
      const y = H - 7 - v * (H - 14);
      x === 0 ? tctx.moveTo(x, y) : tctx.lineTo(x, y);
    }
    tctx.stroke();
  });
}

/** split ground, because a categorical colour has to survive both */
function drawScatter(W, H, lut) {
  tctx.fillStyle = '#f2f2f2'; tctx.fillRect(0, 0, W / 2, H);
  tctx.fillStyle = '#101014'; tctx.fillRect(W / 2, 0, W / 2, H);
  lut.forEach((c, i) => {
    const r = rnd(i * 7919 + 13);
    tctx.fillStyle = `rgb(${c.join(' ')})`;
    const cx = ((i + 0.5) / lut.length) * W, cy = H * (0.3 + 0.4 * r());
    for (let k = 0; k < 26; k++) {
      const x = cx + (r() - 0.5) * (W / lut.length) * 1.5, y = cy + (r() - 0.5) * H * 0.5;
      tctx.beginPath(); tctx.arc(x, y, 2.6, 0, 7); tctx.fill();
    }
  });
}

$('tipbtns').onclick = (e) => {
  const k = e.target.dataset.tip;
  if (k) { S.tipKind = k; drawTest(); }
};

// ─── export ──────────────────────────────────────────────────────────────────
const download = (name, text, type) => {
  const a = Object.assign(document.createElement('a'),
    { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  a.click();
  URL.revokeObjectURL(a.href);
};

/** a filename stem and a Python identifier, from whatever is in the name box */
const stem = () => ($('scenename').value.trim() || 'precept').replace(/[^\w-]+/g, '-');
const ident = () => stem().replace(/\W/g, '_').replace(/^(?=\d)/, 'cmap_');

/** A continuous map is emitted as 256 samples spaced by ARC LENGTH, not as its
 *  control points: every target below interpolates evenly in t, so handing over
 *  the control points would reintroduce exactly the non-uniformity the
 *  resampling exists to remove. toHex maps into sRGB whatever the working gamut
 *  is, because that is what every one of these consumers will display. */
const expCont = () => S.mode === 'continuous' && S.pts.length >= 2;
const expCols = () => (expCont() ? resample(curve(), 256, M()) : palette());

/** provenance, as plain lines; each format wraps them in its own comment syntax */
function headText(cols) {
  const outside = cols.filter((p) => !inGamut(p)).length;
  return [
    `${stem()} — generated by precept`,
    `${SPACES[params.space].name} · ${GAMUTS[params.gamut].name} gamut`
      + `${S.cvd === 'none' ? '' : ` · optimised under ${S.cvd} at severity ${S.sev}`}`,
    `${S.pts.length} control point(s)${expCont() ? ', resampled to 256 by arc length' : ''}`,
    ...(params.gamut === 'srgb' ? [] : ['NOTE: clipped to sRGB on the way out.']),
    ...(outside ? [`NOTE: ${outside}/${cols.length} sample(s) fell outside the `
                   + `${GAMUTS[params.gamut].name} gamut and were mapped into it.`] : []),
  ];
}
const rgb255 = (p) => toSRGB(toGamut(p, 'srgb')).map((c) => Math.round(255 * clamp01(c)));
/** evenly spaced stops for the formats that interpolate rather than tabulate */
const stops = (cols, n) => Array.from({ length: n }, (_, i) => cols[Math.round((i * (cols.length - 1)) / (n - 1))]);

function mplCode(cols) {
  const lines = [];
  for (let i = 0; i < cols.length; i += 6)
    lines.push('    ' + cols.slice(i, i + 6).map((p) => `'${toHex(p)}'`).join(', ') + ',');
  const cont = expCont();
  return [...headText(cols).map((l) => `# ${l}`),
    'from matplotlib import colormaps',
    `from matplotlib.colors import ${cont ? 'LinearSegmentedColormap' : 'ListedColormap'}`, '',
    cont ? `${ident()} = LinearSegmentedColormap.from_list('${stem()}', [` : `${ident()} = ListedColormap([`,
    ...lines,
    cont ? '])' : `], name='${stem()}')`,
    `colormaps.register(${ident()})`].join('\n');
}

function cssCode(cols) {
  const head = [`/* ${headText(cols).join('\n   ')} */`];
  if (!expCont())
    return [...head, ':root {', ...cols.map((p, i) => `  --${stem()}-${i}: ${toHex(p)};`), '}'].join('\n');
  const n = 33, st = stops(cols, n);
  return [...head, ':root {', `  --${stem()}: linear-gradient(to right,`,
    ...st.map((p, i) => `    ${toHex(p)} ${((100 * i) / (n - 1)).toFixed(2)}%${i < n - 1 ? ',' : ''}`),
    '  );', '}'].join('\n');
}

function csvCode(cols) {
  return [...headText(cols).map((l) => `# ${l}`), 'i,t,hex,r,g,b,L,C,h',
    ...cols.map((p, i) => {
      const [r, g, b] = rgb255(p), [L, C, h] = toLCh(p);
      const t = cols.length > 1 ? i / (cols.length - 1) : 0;
      return [i, t.toFixed(6), toHex(p), r, g, b, L.toFixed(3), C.toFixed(3), norm360(h).toFixed(2)].join(',');
    })].join('\n');
}

/** ParaView / VTK. Continuous maps get 33 control points and let ParaView
 *  interpolate; a categorical set is indexedLookup, one entry per class. */
function pvCode(cols) {
  const cont = expCont(), pts = cont ? stops(cols, 33) : cols;
  return ['<ColorMaps>', `  <!-- ${headText(cols).join(' | ')} -->`,
    `  <ColorMap name="${stem()}" space="RGB"${cont ? '' : ' indexedLookup="true"'}>`,
    ...pts.map((p, i) => {
      const [r, g, b] = toSRGB(toGamut(p, 'srgb')).map((c) => clamp01(c).toFixed(6));
      const x = cont ? (i / (pts.length - 1)).toFixed(6) : String(i);
      return `    <Point x="${x}" o="1" r="${r}" g="${g}" b="${b}"/>`;
    }),
    '  </ColorMap>', '</ColorMaps>'].join('\n');
}

const jsonCode = (cols) => JSON.stringify({
  name: stem(), mode: S.mode, space: params.space, gamut: params.gamut,
  notes: headText(cols), colors: cols.map(toHex), control_points: S.pts,
}, null, 1);

const FORMATS = {
  matplotlib: { ext: 'py', mime: 'text/x-python', gen: mplCode, empty: '# nothing to export — add some points' },
  css: { ext: 'css', mime: 'text/css', gen: cssCode, empty: '/* nothing to export */' },
  csv: { ext: 'csv', mime: 'text/csv', gen: csvCode, empty: '# nothing to export' },
  paraview: { ext: 'xml', mime: 'application/xml', gen: pvCode, empty: '<!-- nothing to export -->' },
  json: { ext: 'json', mime: 'application/json', gen: jsonCode, empty: '{}' },
};
for (const [k, f] of Object.entries(FORMATS)) {
  const render = f.gen;
  f.gen = () => { const cols = expCols(); return cols.length ? render(cols) : f.empty; };
}

/**
 * A scene is everything that is not view state: the points, the obstacles and
 * planes, the bounds and profiles, the weights, and which chart they all mean
 * something in. The selection is deliberately dropped — it is an index into
 * arrays the file also carries, and restoring it buys nothing.
 */
const sceneJSON = () =>
  JSON.stringify({ precept: 1, space: params.space, gamut: params.gamut, ...S, sel: undefined }, null, 1);

const vec3 = (a) => Array.isArray(a) && a.length === 3 && a.every(Number.isFinite);
// null counts as bad: JSON has no Infinity or NaN, so stringify emits null for
// them, and a null landing where a number belongs is the same failure with a
// friendlier disguise. Nothing precept writes is legitimately null.
const deepFinite = (v) => Array.isArray(v) ? v.every(deepFinite)
  : v && typeof v === 'object' ? Object.values(v).every(deepFinite)
  : v !== null && (typeof v !== 'number' || Number.isFinite(v));
/** the accepted values for a button group, read off the buttons themselves */
const menu = (id) => [...$(id).children].map((b) => b.dataset.v);

/**
 * A scene file is untrusted input. A NaN or an unrecognised enum reaching the
 * renderer is fatal with no way back short of a reload — an unknown CVD name
 * indexes BRETTEL to undefined and the next destructure throws inside the
 * frame loop. So check before assigning, not after.
 */
function loadScene(text) {
  const o = JSON.parse(text);
  if (o.precept !== 1) throw new Error('not a precept scene file');
  if (!SPACES[o.space] || !GAMUTS[o.gamut]) throw new Error('unknown space or gamut');
  if (!Array.isArray(o.pts) || !o.pts.every(vec3)) throw new Error('bad control points');
  if (!o.obs?.every((x) => vec3(x.c) && Number.isFinite(x.r))) throw new Error('bad obstacles');
  if (!o.planes?.every((x) => vec3(x.n) && Number.isFinite(x.d))) throw new Error('bad planes');
  if (!deepFinite(o)) throw new Error('scene contains a non-finite number');
  for (const [k, ok] of [['cvd', Object.keys(CVD_ID)], ['mode', menu('mode')],
                         ['tool', menu('tool')]])
    if (k in o && !ok.includes(o[k])) throw new Error(`bad ${k}: ${o[k]}`);
  // Validation can only reject what it thought to check, and anything it misses
  // throws halfway through the assignment below — leaving a half-loaded scene
  // with no way back. So make the load atomic instead of trusting the checks:
  // keep the current scene, and put it back if applying the new one throws.
  const undo = JSON.parse(sceneJSON());
  try { applyScene(o); } catch (err) { applyScene(undo); throw err; }
}

function applyScene(o) {
  params.space = o.space; params.gamut = o.gamut;
  for (const k of Object.keys(S)) if (k in o) S[k] = o[k];
  S.sel = null;
  reframe(); layout(); buildShell(); capKey = null;   // a new chart moves everything
  mirror();
  sync({ colors: true, light: true });
}

$('savescene').onclick = () => download(`${stem()}.json`, sceneJSON(), 'application/json');
$('loadscene').onclick = () => $('scenefile').click();
$('scenefile').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try { loadScene(await f.text()); } catch (err) { alert(`could not load scene: ${err.message}`); }
  e.target.value = '';                               // so the same file reloads
};
$('savepy').onclick = () => {
  const f = FORMATS[S.fmt];
  download(`${f.ext === 'py' ? ident() : stem()}.${f.ext}`, f.gen() + '\n', f.mime);
};
$('copypy').onclick = async (e) => {

  e.target.textContent = 'copied';
